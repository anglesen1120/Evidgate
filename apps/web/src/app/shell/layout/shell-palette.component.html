<h2 hlmDialogTitle>{{ title }}</h2>

<div class="flex flex-col gap-3">
  <label hlmLabel for="palette-query">{{ fieldLabel }}</label>
  <input
    #field
    id="palette-query"
    hlmInput
    type="text"
    role="combobox"
    autocomplete="off"
    [attr.aria-autocomplete]="'list'"
    [attr.aria-controls]="'palette-results'"
    [attr.aria-expanded]="true"
    [attr.aria-activedescendant]="activeId()"
    [value]="query()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />

  <p
    role="status"
    [attr.aria-live]="'polite'"
    aria-atomic="true"
    class="text-muted-foreground text-sm"
  >
    {{ statusText() }}
  </p>

  <div
    id="palette-results"
    role="listbox"
    [attr.aria-label]="matchesLabel"
    class="flex flex-col gap-2"
  >
    @for (section of sections(); track section.id; let g = $index) {
      <div role="group" [attr.aria-labelledby]="'palette-group-' + g">
        <p [id]="'palette-group-' + g" class="text-muted-foreground px-2 py-1 text-xs font-medium">
          {{ section.label }}
        </p>
        @for (item of section.items; track item.id) {
          <button
            type="button"
            role="option"
            tabindex="-1"
            class="hover:bg-muted focus-visible:outline-ring text-foreground flex border-0 min-h-11 w-full items-center rounded-md px-2 text-start text-sm focus-visible:outline-2 md:min-h-8"
            [id]="optionId(item)"
            [attr.aria-selected]="isActive(item)"
            [class.bg-muted]="isActive(item)"
            [class.bg-transparent]="!isActive(item)"
            (mousedown)="$event.preventDefault()"
            (click)="choose(item)"
          >
            {{ item.label }}
          </button>
        }
      </div>
    }
  </div>

  <p class="text-muted-foreground text-xs">{{ footerHint }}</p>
</div>
