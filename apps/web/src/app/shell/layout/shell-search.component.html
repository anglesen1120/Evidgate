<button
  type="button"
  hlmBtn
  [variant]="'ghost'"
  [size]="'icon'"
  class="screen-search min-h-(--eg-control-touch) min-w-(--eg-control-touch) text-muted-foreground"
  [attr.aria-keyshortcuts]="'Control+K Meta+K'"
  [hlmTooltip]="label"
  [attr.aria-label]="label"
  (click)="open()"
>
  <app-shell-icon [name]="'search'" />
</button>
