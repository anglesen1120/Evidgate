<div class="grid min-w-0 gap-(--eg-space-1)">
  <label
    hlmLabel
    [id]="orgId + '-label'"
    [for]="orgId"
    class="text-xs text-muted-foreground group-data-[compact=true]/scope:sr-only"
    i18n="@@shell.switcher.organization"
    >Organization</label
  >
  <hlm-select
    class="min-w-0"
    [attr.data-value]="currentOrg()?.id ?? ''"
    [value]="currentOrg()?.id ?? ''"
    [disabled]="organizations().length === 0"
    (valueChange)="select('org', $event)"
  >
    <hlm-select-trigger [buttonId]="orgId" class="min-h-(--eg-control-touch) w-full min-w-0">
      <span class="truncate">{{ currentOrg()?.name || chooseOrganization }}</span>
    </hlm-select-trigger>
    <hlm-select-content *hlmSelectPortal [aria-labelledby]="orgId + '-label'">
      @for (organization of organizations(); track organization.id) {
        <hlm-select-item
          [value]="organization.id"
          [attr.data-value]="organization.id"
          class="min-h-(--eg-control-touch) whitespace-normal [overflow-wrap:anywhere]"
          >{{ organization.name }}</hlm-select-item
        >
      }
    </hlm-select-content>
  </hlm-select>
</div>
<div class="grid min-w-0 gap-(--eg-space-1)">
  <label
    hlmLabel
    [id]="projectId + '-label'"
    [for]="projectId"
    class="text-xs text-muted-foreground group-data-[compact=true]/scope:sr-only"
    i18n="@@shell.switcher.project"
    >Project</label
  >
  <hlm-select
    class="min-w-0"
    [attr.data-value]="currentProject()?.id ?? ''"
    [value]="currentProject()?.id ?? ''"
    [disabled]="projects().length === 0 || !currentOrg()"
    (valueChange)="select('project', $event)"
  >
    <hlm-select-trigger [buttonId]="projectId" class="min-h-(--eg-control-touch) w-full min-w-0">
      <span class="truncate">{{
        currentProject()?.name || (projects().length === 0 ? noProjects : chooseProject)
      }}</span>
    </hlm-select-trigger>
    <hlm-select-content *hlmSelectPortal [aria-labelledby]="projectId + '-label'">
      @for (item of projects(); track item.id) {
        <hlm-select-item
          [value]="item.id"
          [attr.data-value]="item.id"
          class="min-h-(--eg-control-touch) whitespace-normal [overflow-wrap:anywhere]"
          >{{ item.name }}</hlm-select-item
        >
      }
    </hlm-select-content>
  </hlm-select>
</div>
