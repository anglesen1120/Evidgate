<nav class="eg-table-pagination" [attr.aria-label]="landmark()" [attr.aria-busy]="pending()">
  <span role="status" [attr.aria-live]="'polite'" [attr.aria-atomic]="true">{{ summary() }}</span>
  @if (loadedCaption() === null) {
    <div class="size-field">
      <label hlmLabel [for]="sizeId">{{ sizeLabel }}</label>
      <hlm-select
        #sizeField="ngModel"
        [ngModel]="pageSize()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="chooseSize($event, sizeField)"
      >
        <hlm-select-trigger [buttonId]="sizeId"><hlm-select-value /></hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal [aria-label]="sizeLabel">
          @for (size of sizes; track size) {
            <hlm-select-item [value]="size" [disabled]="busy()">{{ size }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
  }
  <div class="page-actions">
    <!-- Reserve feedback beside the controls: the table header can be above the viewport. -->
    <span
      data-page-feedback
      class="page-feedback"
      [class.invisible]="!pending()"
      [attr.role]="pending() ? 'progressbar' : null"
      [attr.aria-label]="pending() ? loadingLabel : null"
      [attr.aria-hidden]="pending() ? null : true"
    >
      <span class="page-spinner" aria-hidden="true"></span>
      {{ loadingLabel }}
    </span>
    <button
      #previousPage
      hlmBtn
      type="button"
      [attr.data-page]="'previous'"
      [variant]="'outline'"
      [class.page-boundary]="page() <= 1"
      [disabled]="loadedCaption() !== null && page() <= 1"
      [attr.aria-busy]="pending()"
      [attr.aria-disabled]="busy() || page() <= 1"
      (click)="move(false, previousPage, nextPage)"
    >
      {{ previousLabel }}
    </button>
    <button
      #nextPage
      hlmBtn
      type="button"
      [attr.data-page]="'next'"
      [variant]="'outline'"
      [class.page-boundary]="!canNext()"
      [disabled]="loadedCaption() !== null && !canNext()"
      [attr.aria-busy]="pending()"
      [attr.aria-disabled]="busy() || !canNext()"
      (click)="move(true, nextPage, previousPage)"
    >
      {{ nextLabel }}
    </button>
  </div>
</nav>
