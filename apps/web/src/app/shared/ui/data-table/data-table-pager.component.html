<nav class="eg-table-pagination" [attr.aria-label]="landmark()" [attr.aria-busy]="pending()">
  <span class="page-range">{{ summary() }}</span>
  <!-- Reserve feedback beside the controls, using the actual translated label width. -->
  <span
    data-page-feedback
    class="page-feedback"
    [class.invisible]="!pending()"
    [attr.role]="pending() ? 'progressbar' : null"
    [attr.aria-label]="pending() ? loadingLabel : null"
  >
    <span class="page-spinner" aria-hidden="true"></span>
    {{ loadingLabel }}
  </span>
  @if (loadedCaption() === null) {
    <div class="size-field">
      <label hlmLabel [for]="sizeId">{{ sizeLabel }}</label>
      <hlm-select
        #sizeField="ngModel"
        [ngModel]="pageSize()"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="chooseSize($event, sizeField)"
      >
        <hlm-select-trigger
          [buttonId]="sizeId"
          class="min-h-(--pager-target) min-w-(--pager-target) font-normal"
        >
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal [aria-label]="sizeLabel">
          @for (size of sizes; track size) {
            <hlm-select-item [value]="size" [disabled]="busy()">{{ size }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
  }
  <div class="page-actions">
    <span role="status">{{ pageLabel() }}</span>
    <button
      hlmBtn
      type="button"
      [attr.data-page]="'previous'"
      [variant]="'outline'"
      [size]="'icon'"
      [hlmTooltip]="previousLabel"
      [attr.aria-label]="previousLabel"
      [class.page-boundary]="page() <= 1"
      [attr.aria-disabled]="busy() || page() <= 1"
      (click)="move(false)"
    >
      <hlm-icon [name]="'lucideChevronLeft'" class="size-(--eg-space-5)" />
    </button>
    <button
      hlmBtn
      type="button"
      [attr.data-page]="'next'"
      [variant]="'outline'"
      [size]="'icon'"
      [hlmTooltip]="nextLabel"
      [attr.aria-label]="nextLabel"
      [class.page-boundary]="!canNext()"
      [attr.aria-disabled]="busy() || !canNext()"
      (click)="move(true)"
    >
      <hlm-icon [name]="'lucideChevronRight'" class="size-(--eg-space-5)" />
    </button>
  </div>
</nav>
