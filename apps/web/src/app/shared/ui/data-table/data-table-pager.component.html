<nav class="eg-table-pagination" [attr.aria-label]="landmark()" [attr.aria-busy]="busy()">
  <span role="status" [attr.aria-live]="'polite'" [attr.aria-atomic]="true">{{ summary() }}</span>
  @if (loadedCaption() === null) {
    <div class="size-field">
      <label hlmLabel [for]="sizeId">{{ sizeLabel }}</label>
      <hlm-select [value]="pageSize()" (valueChange)="chooseSize($event)">
        <hlm-select-trigger [buttonId]="sizeId"><hlm-select-value /></hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal [aria-label]="sizeLabel">
          @for (size of sizes; track size) {
            <hlm-select-item [value]="size" [disabled]="busy()">{{ size }}</hlm-select-item>
          }
        </hlm-select-content>
      </hlm-select>
    </div>
  }
  <div class="page-actions">
    <button
      #previousPage
      hlmBtn
      type="button"
      [attr.data-page]="'previous'"
      [variant]="'outline'"
      [disabled]="loadedCaption() !== null && page() <= 1"
      [attr.aria-busy]="busy()"
      [attr.aria-disabled]="busy() || page() <= 1"
      (click)="move(false, previousPage, nextPage)"
    >
      {{ previousLabel }}
    </button>
    <button
      #nextPage
      hlmBtn
      type="button"
      [attr.data-page]="'next'"
      [variant]="'outline'"
      [disabled]="loadedCaption() !== null && !canNext()"
      [attr.aria-busy]="busy()"
      [attr.aria-disabled]="busy() || !canNext()"
      (click)="move(true, nextPage, previousPage)"
    >
      {{ nextLabel }}
    </button>
  </div>
</nav>
