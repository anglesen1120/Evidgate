<section
  hlmCard
  class="min-w-0 gap-3 p-3 wrap-anywhere md:p-4 [&_p]:m-0"
  data-testid="suite-warnings"
  [attr.aria-label]="copy.title"
>
  <h2 hlmCardTitle class="m-0 text-base">{{ copy.title }}</h2>
  @if (warnings(); as items) {
    @if (items.length === 0) {
      <p data-testid="suite-warnings-empty">{{ copy.empty }}</p>
    } @else {
      <ul class="m-0 grid gap-2 ps-4" data-testid="suite-warnings-items">
        @for (warning of items; track $index) {
          <li>
            <bdi class="whitespace-pre-wrap">{{ warning }}</bdi>
          </li>
        }
      </ul>
    }
  } @else {
    <div hlmAlert role="note" class="grid gap-2 bg-muted" data-testid="suite-warnings-unavailable">
      <p>{{ copy.unavailable }}</p>
      <p>{{ copy.unavailableReason }}</p>
    </div>
  }
</section>
