<section data-testid="suite-warnings" [attr.aria-label]="copy.title">
  <h2>{{ copy.title }}</h2>
  @if (warnings(); as items) {
    @if (items.length === 0) {
      <p data-testid="suite-warnings-empty">{{ copy.empty }}</p>
    } @else {
      <ul data-testid="suite-warnings-items">
        @for (warning of items; track $index) {
          <li>
            <bdi>{{ warning }}</bdi>
          </li>
        }
      </ul>
    }
  } @else {
    <div data-testid="suite-warnings-unavailable">
      <p>{{ copy.unavailable }}</p>
      <p>{{ copy.unavailableReason }}</p>
    </div>
  }
</section>
