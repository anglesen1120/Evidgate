<header class="settings-header grid gap-2 wrap-anywhere">
  <h1
    class="m-0 font-[family-name:var(--eg-font-display)] text-xl md:text-2xl"
    i18n="@@settings.title"
  >
    Settings
  </h1>
  @if (session.currentOrg(); as org) {
    <p class="m-0 text-sm text-muted-foreground" i18n="@@settings.scope">
      Organization: {{ org.name }}
    </p>
  }
</header>
<div
  class="settings-layout grid min-w-0 gap-6"
  [class]="tabs().length > 0 ? 'md:grid-cols-[var(--eg-nav-width)_minmax(0,1fr)]' : ''"
>
  @if (tabs().length > 0) {
    <nav
      class="settings-nav min-w-0"
      aria-label="Settings destinations"
      i18n-aria-label="@@settings.navigation"
    >
      <div class="settings-mobile grid gap-2 md:hidden">
        <label hlmLabel for="settings-destination" i18n="@@settings.choose"
          >Choose a settings destination</label
        >
        <select
          hlmInput
          class="w-full min-w-0 min-h-[var(--eg-control-touch)]"
          #destination
          id="settings-destination"
          (change)="selectDestination(destination)"
        >
          @if (!activeSegment()) {
            <option value="" disabled i18n="@@settings.choose">
              Choose a settings destination
            </option>
          }
          @for (tab of tabs(); track tab.id) {
            <!-- `[selected]` is the one source of the select's value: it survives options being
                 created or replaced, which a `[value]` binding on the select does not. -->
            <option [value]="tab.segment" [selected]="activeSegment() === tab.segment">
              {{ tab.label }}
            </option>
          }
        </select>
      </div>
      <ul class="settings-links m-0 hidden list-none gap-1 p-0 md:grid">
        @for (tab of tabs(); track tab.id) {
          <li class="min-w-0">
            <a
              hlmBtn
              [variant]="'ghost'"
              class="w-full min-h-[var(--eg-control-touch)] justify-start whitespace-normal text-start aria-[current=page]:bg-accent aria-[current=page]:text-accent-foreground aria-[current=page]:font-semibold"
              [routerLink]="[tab.segment]"
              routerLinkActive="settings-link--active"
              [routerLinkActiveOptions]="{ exact: true }"
              [ariaCurrentWhenActive]="'page'"
              [attr.data-settings-tab]="tab.id"
            >
              {{ tab.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  }
  <div hlmCard class="settings-content min-w-0 gap-0 p-3 md:p-4">
    <router-outlet />
    @if (activeSegment() === 'quota-retention') {
      <app-retention-form />
    }
  </div>
</div>
