# Minimal CI: verify Testcontainers suites run on a GitHub-hosted runner
# (closes the 01.7.1-T1 Docker-availability check in plans/01-foundation.md §11).
# The full CI pipeline lands with 01.7.1.
name: docker-tests

on:
  push:
    branches: [develop, 'feature/*']
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode Evidgate.slnx

      - name: Build
        run: dotnet build --no-restore -c Release Evidgate.slnx

      - name: Test (incl. Testcontainers on runner Docker)
        run: dotnet test --no-build -c Release Evidgate.slnx
