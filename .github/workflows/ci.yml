# Evidgate CI (01.7.1-T1 / FR-01-1, AC1–AC3). One pipeline, one command list:
# every job invokes `scripts/verify.sh --stage …`, never a copy of the commands
# inside it, so a local `scripts/verify.sh` pass and CI cannot diverge (AC2 —
# enforced by scripts/check-ci-parity.sh, itself a verify.sh stage).
#
# Runner pin: ubuntu-24.04, not ubuntu-latest — the latest alias migrates to
# Ubuntu 26 on 2026-10-19 (01.7.1 §7). The Testcontainers suites need a Docker
# daemon, which GitHub-hosted Ubuntu runners provide (evidence: the interim
# docker-tests.yml, actions run 36205176754 — that workflow is deleted by this
# task, not extended; AC2 forbids a parallel copy).
#
# Supply chain (AC6): every `uses:` below is a full 40-hex commit SHA with the
# release tag in a comment; scripts/check-action-pins.sh enforces it.
#
# Budget (AC3, NFR-01-1): a warm-cache run must stay under 10 min. NuGet is
# cached on the `**/packages.lock.json` hash and npm on the `package-lock.json`
# hash, so a no-dependency-change PR hits both. The first real run measures the
# wall clock; this file deliberately does not fake a timing gate.
#
# Reserved: 01.7.1-T2 adds the `licence` job, 01.7.1-T4 the audit/SBOM gates and
# 11.6.1 hooks the `security` (CodeQL) stage into this file (§5/§7).
name: ci

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  # 06.3.2-T2.1 (AC4): the nightly fuzz run. The `fixtures-fuzz` job below is the only one that belongs to it and
  # every merge-path job is inverted off it, so the schedule adds the fuzz harness alone and no PR job runs
  # nightly. A manual "Run workflow" is the same nightly job.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # One in-flight run per ref and event kind: a superseded commit's push/PR run is
  # cancelled so stale results never hold a runner or report after a newer push. The
  # nightly schedule and a manual dispatch key on their own `nightly` group, so a
  # nightly fuzz run and a push run never cancel each other.
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'nightly' || 'ref' }}-${{ github.ref }}
  cancel-in-progress: true

# 00 §5.7 S3: least privilege — no secret is needed beyond the default token.
permissions:
  contents: read

env:
  # A CI job that calls verify.sh without `--stage` must judge the whole change
  # set. The path-scoped tiers are a local convenience: a runner clone is often
  # shallow or detached, and a CI verdict that skipped the .NET stages because a
  # change looked web-only is not one to merge on. Every job here passes
  # `--stage` explicitly, so this is the second lock on the same door.
  EVIDGATE_GATE_SCOPE: full

jobs:
  # 06.3.2-T2.1 (AC4): the workflow also runs on the nightly schedule, and only the `fixtures-fuzz` job belongs to
  # that run. Every merge-path job therefore carries `if: github.event_name == 'pull_request' || github.event_name
  # == 'push'`, so adding the schedule changes no PR behaviour and the nightly run stays the fuzz harness alone.
  verify:
    name: 'verify (dotnet)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # FR-01-2: the SDK (10.0.x) comes from global.json, not a floating range.
          global-json-file: global.json
          # AC3: NuGet cache keyed on the locked package graph.
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: 'Restore, build, format, test — verify.sh stages in order'
        run: >-
          ./scripts/verify.sh
          --stage restore
          --stage build
          --stage format
          --stage test

  # 02.9.1-T3.2 (AC6, T48): the M1 isolation gate — the RLS/composite-FK/API
  # isolation suite as its own job, so the milestone has one check to point at as
  # proof that tenant isolation held for the merge, and its JUnit report is the
  # T48 dogfooding evidence. The job runs only verify.sh stages (check-ci-parity
  # enforces it) and uploads the report even when the suite fails.
  # Making this job a *required* check is owner-blocked under 01.7.1-T3.1: branch
  # protection on the free private plan returns 403, so the check is wired but not
  # yet enforced by branch protection.
  isolation:
    name: 'isolation (M1 gate)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # FR-01-2: the SDK (10.0.x) comes from global.json, not a floating range.
          global-json-file: global.json
          # AC3: NuGet cache keyed on the locked package graph.
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: 'Restore, build, isolation — verify.sh stages in order'
        run: >-
          ./scripts/verify.sh
          --stage restore
          --stage build
          --stage isolation
      - name: 'Upload the isolation JUnit report'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-junit
          path: artifacts/test-results/isolation.junit.xml
          retention-days: 14

  # 06.3.2-T1.2 (AC2): the committed hostile-input corpus and its mutation smoke are their own job on the PR
  # trigger, so a parser-profile guard that regresses fails a named check instead of one case inside the suite.
  # `--stage build` precedes the stage because it runs `dotnet test --no-build -c Release`.
  fixtures-hostile:
    name: 'verify (hostile fixtures)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: 'Restore, build, hostile-input fixtures — verify.sh stages in order'
        run: >-
          ./scripts/verify.sh
          --stage restore
          --stage build
          --stage fixtures-hostile

  # 06.3.2-T2.1 (AC4): the nightly fuzz job — the seeded-mutation harness over the 06.3.1 parser profile, seeded
  # from fixtures/hostile/, on the ten-minute budget the `fixtures-fuzz` stage sets. It runs on the nightly
  # schedule and on demand, never on a PR, so the extra minutes never land on the merge path. `--stage build`
  # precedes the stage because it runs `dotnet test --no-build -c Release`; the 30-minute timeout is the 600 s
  # budget plus two builds of margin. It runs only verify.sh stages (check-ci-parity enforces it) and uploads the
  # findings directory on failure.
  fixtures-fuzz:
    name: 'verify (fuzz, nightly)'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: 'Restore, build, fuzz — verify.sh stages in order'
        run: >-
          ./scripts/verify.sh
          --stage restore
          --stage build
          --stage fixtures-fuzz
      - name: 'Upload the fuzz findings on failure'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: artifacts/fuzz-findings
          retention-days: 14

  web:
    name: 'verify (web)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-review-blockers reads commits: the diff scan ranges over
          # base...HEAD and the U1 ratchet over the head tree. A shallow clone
          # has no base commit and no history, and the stage fails closed.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # FR-01-2: the Node version (26) comes from .nvmrc, not a floating range.
          node-version-file: .nvmrc
          # AC3: npm cache keyed on the lock-file hash.
          cache: npm
          cache-dependency-path: package-lock.json
      # verify.sh never installs; each job installs the dependencies it needs
      # (locked modes only — npm ci, 00 §5.7 S6 / FR-01-1).
      - name: 'Install npm workspaces (locked)'
        run: npm ci --ignore-scripts
      - name: 'tsc, vitest, eslint, prettier — verify.sh stages in order'
        run: >-
          ./scripts/verify.sh
          --stage tsc-build
          --stage tsc-spec
          --stage vitest
          --stage eslint
          --stage prettier
      # Contract drift gate (AC1/§9, 01.3.2-T1.3): regenerates packages/sdk and
      # fails on any diff — the spec is the only thing humans edit.
      - name: 'Contract drift gate'
        run: ./scripts/verify.sh --stage check-codegen-drift --stage check-permissions-drift --stage check-rls
      # The REVIEW.md blocking rules a grep can see, on the lines this change set
      # adds, plus the U1 comment-id ratchet over the whole head tree. The diff
      # scan runs only for a landing on develop: on a pull request to main or a
      # push to main only the ratchet runs, because develop's own debt that the
      # scan tolerates (the 0053/0054 D1 policies) is not that event's change set
      # and would fail every promotion for it. On a pull request the base is the
      # merge commit's first parent — the base tip the merge was computed from,
      # never a payload sha that a merge in the branch has left behind; on a push
      # it is the ref the push started from, and an all-zero ref (a new branch)
      # makes the scanner fall back to origin/develop.
      - name: 'Review-blocker gate — verify.sh stage (diff scan on develop landings)'
        env:
          EVIDGATE_REVIEW_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          EVIDGATE_REVIEW_DIFF: ${{ ((github.event_name == 'pull_request' && github.base_ref == 'develop') || (github.event_name == 'push' && github.ref == 'refs/heads/develop')) && 'on' || 'off' }}
        run: ./scripts/verify.sh --stage check-review-blockers
      # The path-scoped tier classifier's fixtures: the allow-lists, the git
      # plumbing, the fail-closed paths, and the mirror of ALL_STAGES. It is a
      # check stage, so a narrowed local run still runs it; here it guards the
      # classifier itself. `EVIDGATE_GATE_SCOPE: full` is a latent lock: a tier is
      # consulted only by a bare `scripts/verify.sh`, and every call in this
      # workflow passes `--stage`, so it bites the day a job drops the stage list.
      - name: 'Gate-scope tier classifier — verify.sh stage'
        run: ./scripts/verify.sh --stage check-gate-scope
      # The stage above runs the checkout's copy. A pull request's ci.yml,
      # scripts/verify.sh and this step all come from the pull request, so this
      # step protects the scanner and its baseline — not the workflow: it
      # archives the entry file, the `scripts/review_blockers` package that holds
      # the rules and the baseline from the base revision into a clean
      # $RUNNER_TEMP directory and runs them from there, and the workflow's own
      # copy stays the coordinator's check (origin/develop) plus the gate-file
      # WARN. The two shas have separate jobs: the payload base sha names the
      # trusted copy, because the scanner and baseline must be a commit of the
      # base branch and checking it exists first keeps that choice stable, while
      # the diff range comes from the merge commit's first parent so a branch
      # that merged develop cannot re-scan base-side changes as its own. A base
      # commit that is not in the clone is a hard failure, not a fallback. The
      # first pull request to carry the gate has no base copy of the scanner, so
      # it runs its own and says so; that bootstrap disappears as soon as develop
      # carries the scanner.
      - name: 'Review-blocker gate from the base revision'
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_DIFF: ${{ github.base_ref == 'develop' && 'on' || 'off' }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA}" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::check-review-blockers: the base commit '${BASE_SHA:-<none>}' is not in this clone (fetch-depth: 0 should have it); refusing to judge this pull request without it"
            exit 2
          fi
          work="${RUNNER_TEMP}/review-blockers-base"
          # A clean directory per run: a stale module left by an earlier
          # checkout must never be imported beside this base's entry file.
          rm -rf "$work"
          mkdir -p "$work"
          entry='scripts/check-review-blockers.py'
          package='scripts/review_blockers'
          baseline_rel='scripts/check-review-blockers.baseline.json'
          if git cat-file -e "${BASE_SHA}:${entry}" 2>/dev/null; then
            # No fallback when the base has a scanner but no baseline: judging
            # with the pull request's number is the hole this step closes.
            if ! git cat-file -e "${BASE_SHA}:${baseline_rel}" 2>/dev/null; then
              echo "::error::check-review-blockers: the base revision ${BASE_SHA} carries a scanner but no baseline; refusing to judge with this pull request's number"
              exit 2
            fi
            paths=("$entry" "$baseline_rel")
            # The rules live in a package beside the entry; a base that predates
            # the split has only the self-contained entry file.
            if git cat-file -e "${BASE_SHA}:${package}/__init__.py" 2>/dev/null; then
              paths+=("$package")
            fi
            # One archive into a clean directory: the entry imports its package
            # from its own directory, and pipefail makes a failed archive fail
            # the step instead of leaving an empty tree behind.
            git archive "$BASE_SHA" -- "${paths[@]}" | tar -x -C "$work"
            scanner="${work}/${entry}"
            baseline="${work}/${baseline_rel}"
            echo "::notice::check-review-blockers: running the base revision's scanner and baseline (${BASE_SHA})"
          else
            scanner="${entry}"
            baseline="${baseline_rel}"
            echo "::warning::check-review-blockers: the base revision ${BASE_SHA} has no scanner yet; running this pull request's own copy and baseline (bootstrap; it ends as soon as the base branch carries the gate)"
          fi
          # HEAD is the merge commit, so its first parent is the base tip the
          # merge was computed from; a checkout that is not a merge commit has no
          # second parent and falls back to the payload base, loudly.
          if git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            diff_base='HEAD^1'
          else
            diff_base="${BASE_SHA}"
            echo "::warning::check-review-blockers: HEAD is not a merge commit; scanning against the payload base ${BASE_SHA}"
          fi
          if [[ "${REVIEW_DIFF}" == "on" ]]; then
            PYTHONDONTWRITEBYTECODE=1 python3 "$scanner" "${diff_base}" HEAD
          else
            echo "check-review-blockers: promotion to ${GITHUB_BASE_REF:-main}; U1 ratchet only, no diff scan"
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 "$scanner" --baseline "$baseline" --u1-ratchet HEAD
      # Web build (AC1): `apps/web` gains a build script in 09.1.1; until then
      # --if-present keeps this step a no-op instead of a failure.
      - name: 'Web build — activates with apps/web build script (09.1.1)'
        run: npm run build --workspaces --if-present

  policy:
    name: 'verify (policy)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # check-dor-security diffs against origin/develop (11.1.1-T2); a
          # shallow clone has no base ref and the stage fails closed.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # check-sources.sh calls `dotnet nuget list source`; no package work
          # happens here, so the NuGet cache stays off.
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # check-contract-conventions.sh runs `npx spectral lint` and check-ci-recipe
      # (lint-ci-recipe.mjs) imports `yaml` — devDeps required.
      - name: 'Install npm workspaces (locked)'
        run: npm ci --ignore-scripts
      - name: 'Layout, sources, ADR, links, contracts, env matrix, DoR, threat model, parity, pins, recipe lint, image pins — verify.sh stages'
        run: >-
          ./scripts/verify.sh
          --stage check-layout
          --stage check-sources
          --stage check-adr-matrix
          --stage check-adr
          --stage check-links
          --stage check-contract-conventions
          --stage check-env-matrix
          --stage check-dor-security
          --stage check-threat-model
          --stage check-ci-parity
          --stage check-action-pins
          --stage check-ci-recipe
          --stage image-pins

  # 10.2.1-T1 (AC1, AC5): the three service images build for the runner's platform
  # on the digest-pinned bases; the Migrator image brings a throwaway PostgreSQL to
  # head and the Api image reports ready against it.
  images:
    name: 'verify (images)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Build and check the service images — verify.sh stage'
        run: ./scripts/verify.sh --stage images

  # Non-blocking until the web milestone owns the suite (01.7.1-T1.3, 09):
  # apps/web has a Playwright spec, but the suite is still a scaffold.
  e2e:
    name: 'e2e (playwright, non-blocking until 09)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 'Install npm workspaces (locked)'
        run: npm ci --ignore-scripts
      - name: 'Build @evidgate/sdk (the web app imports its dist/)'
        run: npm run build -w packages/sdk
      - name: 'Install Playwright browsers'
        run: npx playwright install --with-deps chromium
      - name: 'Playwright e2e — apps/web'
        run: npm run e2e -w apps/web
      - name: 'Upload the Playwright report on failure'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  # 09.1.1-T4 hand-over (S68, STATUS "Shell e2e suite is not in CI"): the shell
  # suite runs against the FIXTURES build (apps/web/playwright.fixtures.config.ts),
  # which needs the dev-only fixture backend, so it cannot share the production
  # e2e job above. Non-blocking for the same reason as that job. The config
  # launches `channel: 'chrome'`, so the runner installs Google Chrome, not the
  # bundled Chromium.
  e2e-fixtures:
    name: 'e2e fixtures (playwright shell suite, non-blocking until 09)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 'Install npm workspaces (locked)'
        run: npm ci --ignore-scripts
      - name: 'Build @evidgate/sdk (the web app imports its dist/)'
        run: npm run build -w packages/sdk
      - name: 'Install Google Chrome for Playwright'
        run: npx playwright install --with-deps chrome
      - name: 'Playwright shell suite — apps/web fixtures build'
        run: npm run e2e:fixtures -w apps/web
      - name: 'Upload the Playwright report on failure'
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-fixtures
          path: apps/web/playwright-report-fixtures
          retention-days: 14

  # 01.7.1-T2/T4 (AC4, AC6, AC7): licence deny-list + vulnerability gates +
  # CycloneDX SBOMs. Every command below is a verify.sh stage so local and CI
  # can never diverge (check-ci-parity enforces it).
  supply-chain:
    name: 'verify (supply chain)'
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 'Install npm workspaces (locked)'
        run: npm ci --ignore-scripts
      - name: 'Licence gate + audit + SBOM — verify.sh stages in order'
        run: >-
          ./scripts/verify.sh
          --stage restore
          --stage licence-scan
          --stage audit-deps
          --stage sbom
      - name: 'Upload SBOMs'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/
          # §8: 14 days for PR evidence, 90 for main (release evidence).
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 14 }}
      - name: 'Upload licence report'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-report
          path: artifacts/licence-report.json
          retention-days: 14
