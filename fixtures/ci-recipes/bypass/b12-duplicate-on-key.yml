# expect: yaml-parse
# Synthetic fixture (11.2.1-T1.2): a duplicate `on:` key; last-wins parsers would see
# pull_request_target, first-wins ones would not.

name: tests
on: pull_request
permissions: {}
on: pull_request_target
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
