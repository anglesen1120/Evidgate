# expect: R5-no-long-lived-credential
# Synthetic fixture (11.2.1-T1.2): bracket index form of the secrets context.

name: tests
on:
  push:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets['NPM_TOKEN'] }}
