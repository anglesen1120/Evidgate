# expect: R3-token-permissions
# Synthetic fixture (11.2.1-T1.2): a merge key injects the job's elevated scope into the
# workflow-wide default, which is written after `jobs:` so the alias resolves.

name: tests
on:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions: &elevated
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
permissions:
  <<: *elevated
