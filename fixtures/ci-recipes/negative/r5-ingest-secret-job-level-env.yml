# expect: R5-no-long-lived-credential
# Synthetic fixture: the ingest-token secret in the job-level env reaches every step, not one.
name: upload
on:
  push:
    branches: [main]
permissions: {}
jobs:
  upload:
    if: "github.event_name == 'push'"
    runs-on: ubuntu-24.04
    environment: evidgate-upload
    permissions:
      contents: read
    env:
      EVIDGATE_INGEST_TOKEN: ${{ secrets.EVIDGATE_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm test
        shell: bash
