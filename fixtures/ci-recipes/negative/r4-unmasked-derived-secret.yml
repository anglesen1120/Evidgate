# expect: R4-add-mask
# Synthetic fixture (11.2.1-T1.2): a minted session value is written to $GITHUB_ENV without
# ::add-mask::, so later steps print it in clear text in the log.

name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Mint upload session
        run: |
          session="$(./scripts/mint-session.sh)"
          echo "UPLOAD_SESSION=$session" >> "$GITHUB_ENV"
      - run: npm test
