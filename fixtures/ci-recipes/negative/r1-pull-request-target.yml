# expect: R1-no-pull-request-target
# Synthetic fixture (11.2.1-T1.2): a fork PR triggers pull_request_target, which runs with the base
# repository's secrets and a write token next to the checked-out fork code.

name: tests
on:
  pull_request_target:
    branches: [main]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
