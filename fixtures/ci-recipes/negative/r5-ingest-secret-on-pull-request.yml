# expect: R5-no-long-lived-credential
# Synthetic fixture: the job holding the ingest-token secret can run for a pull_request.
name: upload
on:
  pull_request:
  push:
    branches: [main]
permissions: {}
jobs:
  upload:
    runs-on: ubuntu-24.04
    environment: evidgate-upload
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          EVIDGATE_INGEST_TOKEN: ${{ secrets.EVIDGATE_INGEST_TOKEN }}
        run: npx --yes --package @evidgate/cli@1.0.0 -- evidgate auth login
        shell: bash
