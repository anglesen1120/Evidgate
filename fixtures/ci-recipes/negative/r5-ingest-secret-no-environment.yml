# expect: R5-no-long-lived-credential
# Synthetic fixture: the ingest-token secret reaches a step of a job with no `environment:`.
name: upload
on:
  push:
    branches: [main]
permissions: {}
jobs:
  upload:
    if: "github.event_name == 'push'"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          EVIDGATE_INGEST_TOKEN: ${{ secrets.EVIDGATE_INGEST_TOKEN }}
        run: npx --yes --package @evidgate/cli@1.0.0 -- evidgate auth login
        shell: bash
