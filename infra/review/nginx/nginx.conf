# nginx for the review stack: the bundle at /usr/share/nginx/html served
# same-origin with the Api proxied under /v1/.
#
# This file replaces the unprivileged image's configuration (Dockerfile.web
# clears its entrypoint too) because nothing here is templated at start: the CSP
# snippet is generated at image build time from apps/web/scripts/csp.mjs, and the
# container runs with a read-only rootfs and /tmp as its only writable path.
#
# Routing reproduces apps/web/e2e/static-server.mjs, which is the reference the
# app is tested against: `/` redirects to the default locale (vi), each locale
# directory is served from its own <base href>, an extensionless path inside a
# locale falls back to that locale's index.html, and a file-shaped miss is a 404
# rather than the SPA page.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;

  # The health probe answers only to loopback, and `return` runs in the rewrite
  # phase where allow/deny never execute; the address test therefore lives in a
  # map, evaluated in that same phase. ::1 covers a container that listens on [::].
  map $remote_addr $review_health_allowed {
    default 0;
    '127.0.0.1' 1;
    '::1' 1;
  }

  # Cache-Control for the content-hashed assets. The long-lived immutable form is
  # for a successful body only: `add_header ... always` also decorates 401/404/5xx,
  # and a shared cache (the Cloudflare edge) would keep that error for a year and
  # serve it to every visitor. $status is read when the header is emitted, so the
  # final status (including the auth_basic 401 and try_files =404) decides.
  # A request that carried credentials gets `private`, so no shared cache keeps
  # the body of an authenticated response either.
  map "$status:$http_authorization" $review_asset_cache_control {
    default 'no-store';
    '~^(?:200|304):$' 'public, max-age=31536000, immutable';
    '~^(?:200|304):.' 'private, max-age=31536000, immutable';
  }

  # Cache-Control for the Api proxy: the Api's own value when it sends one (a 412
  # must not be stored, an artifact download may be), `no-store` when it sends
  # none or nginx answers itself (the auth_basic 401, a 502), so no shared cache
  # keeps a response nobody classified. $upstream_http_* joins repeated headers.
  map $upstream_http_cache_control $review_api_cache_control {
    default $upstream_http_cache_control;
    # Absent or empty. nginx skips regex keys for a zero-length value, so this
    # literal is what covers the common case.
    '' 'no-store';
    # Several empty fields are joined with ", " and carry no policy either.
    '~^[\s,]*$' 'no-store';
  }

  # sub_filter rewrites each index.html response (the CSP nonce), and the
  # sendfile path bypasses output filters, so the page would ship with the
  # placeholder still in it.
  sendfile off;

  # read_only rootfs: /tmp is the tmpfs compose mounts, so every path nginx
  # writes to lives there.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  # A compressed and a plain body share one URL, so a shared cache must key on
  # Accept-Encoding or it can hand a gzip body to a client that did not ask for it.
  gzip_vary on;

  # Kestrel's default request-body limit is 30 000 000 bytes, and the Api clears
  # it on the routes that count their own cap (a manifest body up to 32 MiB). The
  # proxy must not be the smaller of the two, or an upload fails here with a 413
  # the Api never sees; a deployment that raises the manifest cap above 32 MiB
  # must raise this value too.
  client_max_body_size 32m;

  # The Api is told the request arrived over TLS: the edge terminates HTTPS and
  # nginx speaks plain http to it, and only that trusted header keeps
  # Request.IsHttps true so the __Host-/Secure session cookie is written. The
  # value is the constant `https` and never a client-supplied header, so nothing
  # a caller sends can change it; the local smoke is served over
  # http://127.0.0.1, which browsers treat as a secure context and therefore
  # accept the Secure cookie on.

  server {
    listen 8080;
    server_name _;

    # The edge terminates TLS and a tunnel hides the listen port, so an absolute
    # Location built from nginx's own scheme and :8080 would send the browser to
    # http://host:8080. Relative Locations resolve against the public origin.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # The policy, HSTS, nosniff and no-referrer, plus the sub_filter that writes
    # this response's nonce into the document. Every location below that sets an
    # add_header of its own re-includes it: add_header does not merge with the
    # inherited set.
    include /etc/nginx/snippets/security-headers.conf;

    # Basic auth for every path in this server, including the /v1/ proxy: the
    # file is written by the container start script (see web-start.sh) and holds
    # either the realm and user file or a single `auth_basic off;`. Included at
    # server level so no location can be reached around it. The companion
    # proxy-auth.conf is included inside /v1/ alone: the header it may set is a
    # proxy directive, and it is written only while basic auth is on.
    include /tmp/evidgate/auth.conf;

    # Container healthcheck only: no auth, loopback only. The address rule is the
    # map guard above, because `return` runs in the rewrite phase and an
    # `allow`/`deny` pair here would never be consulted.
    location = /nginx-health {
      access_log off;
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      auth_basic off;
      if ($review_health_allowed = 0) {
        # A refusal means something reached the container from outside loopback,
        # which is worth a line even though the probe path is otherwise quiet.
        access_log /dev/stdout;
        return 403;
      }
      default_type text/plain;
      return 200 'ok';
    }

    # The Api's operator and probe surface is never exposed here.
    location ~ ^/internal(/|$) {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      return 404;
    }

    location /v1/ {
      include /etc/nginx/snippets/security-headers.conf;
      # The upstream header is hidden and re-added from the map, so exactly one
      # Cache-Control leaves, and it is `always` so an error is covered too.
      proxy_hide_header Cache-Control;
      add_header Cache-Control $review_api_cache_control always;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite, never append: $proxy_add_x_forwarded_for would let a caller
      # choose the address the Api sees. This value is the tunnel container's
      # address (its only peer on `edge`), so every caller shares one limiter key.
      proxy_set_header X-Forwarded-For $remote_addr;
      # Written by the start script: it empties Authorization only while basic
      # auth is on, so a browser's Basic credential is not read as an Api token.
      include /tmp/evidgate/proxy-auth.conf;
      # Evidence downloads stream; buffering them to disk would need a second
      # writable path and would delay the first byte.
      proxy_buffering off;
      # Uploads stream through as well, so an artifact body is never spooled to
      # /tmp first; client_max_body_size still caps what the Api may receive.
      proxy_request_buffering off;
      proxy_read_timeout 60s;
      # Resolved per request through compose's DNS so the web server starts (and
      # `nginx -t` passes) before the api container exists, and follows its restarts.
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $evidgate_api http://api:8080;
      proxy_pass $evidgate_api;
    }

    # A bare `/` and the slashless locale roots redirect into the locale. The
    # redirect is delegated to a named location because `return` runs in the
    # rewrite phase: written inline it answers 302 before basic auth, i.e. to a
    # stranger. try_files is precontent, so the access phase runs first.
    location = / {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files /__no_root_page__ @locale_root;
    }

    location = /vi {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files /__no_locale_alias__ @locale_vi;
    }

    location = /en {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files /__no_locale_alias__ @locale_en;
    }

    location @locale_root {
      return 302 /vi/;
    }

    location @locale_vi {
      return 302 /vi/;
    }

    location @locale_en {
      return 302 /en/;
    }

    # Content-hashed build output (outputHashing: all): the file name changes
    # with the content, so it can be cached forever. angular.json declares
    # `assets: []`, so nothing unhashed lands under a locale directory except the
    # document and the licence dump, which the rules below catch instead.
    location ~* ^/(en|vi)/.*\.(?:js|css|ico|svg|png|jpe?g|webp|gif|woff2?|ttf|eot)$ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control $review_asset_cache_control always;
      # The range filter runs after the header filter: a 206, and a 416 that
      # re-enters the filters, would carry the 200's immutable value (twice).
      # Refusing ranges keeps one header per response; assets are small.
      max_ranges 0;
      try_files $uri =404;
    }

    # The document carries a per-response nonce, so a stored copy would replay a
    # nonce the next header does not authorise; the licence dump changes with
    # every release and is not worth a long cache either.
    location ~* ^/(en|vi)/.*\.(?:html|txt|json|map)$ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files $uri =404;
    }

    # Any other file-shaped request inside a locale is a 404, never the SPA page.
    location ~* ^/(en|vi)/.*\.[A-Za-z0-9]+$ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files $uri =404;
    }

    # The bundle root holds no file of its own; a file-shaped request there is a
    # 404 rather than a redirect into a locale (static-server.mjs does the same).
    location ~* ^/[^/]+\.[A-Za-z0-9]+$ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      return 404;
    }

    location /vi/ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files $uri $uri/ /vi/index.html;
    }

    location /en/ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files $uri $uri/ /en/index.html;
    }

    # The bundle root holds no page of its own (one directory per locale), so an
    # un-prefixed path keeps its locale prefix by redirecting, query included.
    location / {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      try_files $uri @locale_default;
    }

    location @locale_default {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control 'no-store' always;
      return 302 /vi$request_uri;
    }
  }
}
