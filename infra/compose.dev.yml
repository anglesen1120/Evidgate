# Local development stack (01.8.1-T2.1, 00 §5.2 / CR-01-3): the two stateful
# services only. Api, Worker (`dotnet watch`) and web (`ng serve`) run on the
# host — see docs/dev-setup.md.
#
# Start it with `scripts/dev/up.sh`, never by hand: the script reads
# infra/seaweedfs/s3-config.json, exports EVIDGATE_SEAWEEDFS_S3_CONFIG and runs
# the database bootstrap. Images are digest-pinned (multi-arch image-index
# digests, read from registry-1.docker.io 2026-09-26) and shared with
# tests/Shared/ContainerImages.cs so tests and the dev stack cannot drift.
#
# No host path is bind-mounted anywhere in this file: on colima/virtiofs (this
# repo lives under /Volumes) a bind mount of a file under the repository appears
# inside the container as an unreadable directory, so state lives in the named
# volumes pg-data / s3-data and the SeaweedFS identity file is materialised from
# the environment instead (infra/README.md records the evidence).

name: evidgate-dev

services:
  postgres:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: evidgate-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EVIDGATE_DB_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      # The image's initdb defaults leave `host all all 127.0.0.1/32 trust`, i.e.
      # loopback connections would be accepted without a password and the
      # owner/app/operator split would not be enforced locally. `--auth-host`
      # rewrites those initdb lines to scram, so the Api/Worker/Migrator really
      # authenticate (unix-socket psql inside the container stays trust, as the
      # image intends, and db-init.sh uses that path).
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      # 00 §5.7: loopback only — nothing in the dev stack is reachable off-host.
      - '127.0.0.1:${EVIDGATE_DB_PORT:-5432}:5432'
    volumes:
      # postgres:18 keeps PGDATA=/var/lib/postgresql/18/docker and declares
      # /var/lib/postgresql as its volume; mounting .../data would not persist.
      - pg-data:/var/lib/postgresql
    healthcheck:
      # TCP, not the unix socket: the entrypoint's temporary initdb server
      # listens on the socket only, so a socket probe would report ready too early.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    stop_grace_period: 10s

  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    container_name: evidgate-dev-seaweedfs
    restart: unless-stopped
    environment:
      # Set by scripts/dev/up.sh from infra/seaweedfs/s3-config.json; `$$` is a
      # literal `$` for compose, so the variable is expanded by the shell inside
      # the container, never by compose.
      EVIDGATE_SEAWEEDFS_S3_CONFIG: ${EVIDGATE_SEAWEEDFS_S3_CONFIG:-}
    # The image's own /entrypoint.sh dispatcher is re-used after the identity
    # file is written, so the S3 gateway starts exactly as the parity fixture
    # (01.8.1-T1) starts it, with -s3.config at the path infra/seaweedfs/
    # documents and /data owned by the image's seaweed user.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$EVIDGATE_SEAWEEDFS_S3_CONFIG" ]; then
          echo "seaweedfs: EVIDGATE_SEAWEEDFS_S3_CONFIG is empty — start the stack with scripts/dev/up.sh" >&2
          exit 1
        fi
        printf '%s' "$$EVIDGATE_SEAWEEDFS_S3_CONFIG" > /etc/seaweedfs/s3-config.json
        exec /entrypoint.sh server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3-config.json
    ports:
      - '127.0.0.1:${EVIDGATE_S3_PORT:-8333}:8333'
    volumes:
      - s3-data:/data
    healthcheck:
      # The S3 gateway answers 403 on an unsigned GET; any HTTP status proves the
      # listener is up, a connection error exits curl non-zero (no sleeps anywhere).
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://127.0.0.1:8333/']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # --- profile `observability` (ADR-0012): off unless scripts/dev/up.sh
  # --observability (COMPOSE_PROFILES=observability) selects it. The collector is
  # the only thing the application talks to; the three stores sit behind it.
  # Every port is loopback-only and no store has a credential to commit: the
  # query UIs are unauthenticated, which is why they never leave 127.0.0.1.
  # Retention flags and mem_limit values are the ADR's dev-Mac defaults.

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    restart: unless-stopped
    mem_limit: 128m
    environment:
      # The whole collector config, exported by up.sh from
      # infra/observability/otel-collector.yaml (no bind mount, see above).
      EVIDGATE_OTEL_COLLECTOR_CONFIG: ${EVIDGATE_OTEL_COLLECTOR_CONFIG:-}
      # Go heap target below the 128m cgroup: the limiter bounds pipeline
      # buffering, this bounds the runtime's own heap before the cgroup does.
      GOMEMLIMIT: 96MiB
    command: ['--config=env:EVIDGATE_OTEL_COLLECTOR_CONFIG']
    ports:
      - '127.0.0.1:${EVIDGATE_OBS_OTLP_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${EVIDGATE_OBS_OTLP_HTTP_PORT:-4318}:4318'
    depends_on:
      - prometheus
      - victorialogs
      - victoriatraces

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    mem_limit: 256m
    # Retention comes from the config file: the command-line retention flags are
    # deprecated in this version. The image has a shell and the config is two lines,
    # so it is written at start instead of bind-mounted (see the header).
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf 'storage:\n  tsdb:\n    retention:\n      time: 90d\n      size: 2GiB\n' > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-otlp-receiver
    ports:
      - '127.0.0.1:${EVIDGATE_OBS_PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - obs_prometheus_data:/prometheus
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  victorialogs:
    profiles: [observability]
    image: victoriametrics/victoria-logs:v1.53.0@sha256:251121fa882af99b95ba0c230a4a2f412ea602d2698c64a96c58dc9842bb755d
    restart: unless-stopped
    mem_limit: 256m
    command:
      - '-storageDataPath=/victoria-logs-data'
      - '-retentionPeriod=30d'
      - '-retention.maxDiskSpaceUsageBytes=3GiB'
      - '-httpListenAddr=:9428'
    ports:
      - '127.0.0.1:${EVIDGATE_OBS_LOGS_PORT:-9428}:9428'
    volumes:
      - obs_victorialogs_data:/victoria-logs-data
    # No healthcheck: the image is scratch-based (no shell, no wget). The smoke
    # script polls /health from the host instead.

  victoriatraces:
    profiles: [observability]
    image: victoriametrics/victoria-traces:v0.12.1@sha256:609abddf298c9642496045296f30a3968b5a4b79b678373e2e7ef29c844f5578
    restart: unless-stopped
    mem_limit: 256m
    command:
      - '-storageDataPath=/victoria-traces-data'
      - '-retentionPeriod=7d'
      - '-retention.maxDiskSpaceUsageBytes=2GiB'
      - '-httpListenAddr=:10428'
    ports:
      - '127.0.0.1:${EVIDGATE_OBS_TRACES_PORT:-10428}:10428'
    volumes:
      - obs_victoriatraces_data:/victoria-traces-data
    # No healthcheck: the image is scratch-based (no shell, no wget). The smoke
    # script polls /health from the host instead.

volumes:
  # AC4: data survives `down` (volumes are kept) and `up.sh --reset` deletes both.
  pg-data:
  s3-data:
  # Profile `observability`: one volume per store, data directory only.
  obs_prometheus_data:
  obs_victorialogs_data:
  obs_victoriatraces_data:
