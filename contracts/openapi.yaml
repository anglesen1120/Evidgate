        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/manual-cases/{m}:
    get:
      operationId: getManualCase
      tags: [authoring]
      summary: One manual test case with its steps; ETag is its version (13.1.1-T2)
      description: >-
        13.1.1 §5 route 14. Returns the case with its steps and `ETag: "<version>"` (the member
        set of `ManualCaseDetailDto`). Unknown, another tenant's, another project's or
        soft-deleted case is 404 `not_found`; a credential scoped to a sibling project is 403
        `project_scope_mismatch`; `authoring:read` suffices. The `links` member, `covered` and
        the linked-case counts belong to 13.1.1-T4 and are absent here.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringManualCaseId'
      responses:
        '200':
          description: 'The case, its steps and `ETag: "<version>"`'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCaseDetailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateManualCase
      tags: [authoring]
      summary: Change a manual test case's content under If-Match (13.1.1-T2)
      description: >-
        13.1.1 §5 route 15 (`authoring:write`). Omitted members are unchanged. `code` and
        `checklist_item_id` are not members of this body at all — the code never changes and
        moving is route 19 — so either one is 422 `request_invalid` with `details[].path =
        /code` or `/checklist_item_id`. `steps`, when present, is validated against
        `contracts/schemas/authoring-steps.v1.json` exactly as on create. `If-Match` is the
        case's `version` (absent/malformed 422 with `details[].path = /If-Match`, stale 412
        `precondition_failed` with the current `version` in `error.details` and nothing written,
        AC19); a no-op answers 200 `changed: false` with no version or audit row (AC5). State
        moves are route 17. Unknown member 422, body over 64 KiB 413 `payload_too_large`,
        unknown or soft-deleted case 404 `not_found`, `retired` case 409 `invalid_transition`
        (terminal for edits, 13.1.1 §6), lock timeout 503 `unavailable` with `Retry-After`.
      x-permission: authoring:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringManualCaseId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManualCaseRequest'
      responses:
        '200':
          description: The case's version after the call and whether it changed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringChangeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      operationId: deleteManualCase
      tags: [authoring]
      summary: Soft-delete a manual test case (13.1.1-T2)
      description: >-
        13.1.1 §5 route 16 (`authoring:write`). Soft-deletes the case and appends one
        `SoftDelete` version row with the optional `reason` (1..500 code points). `If-Match` is
        the case's `version` (absent/malformed 422 with `details[].path = /If-Match`, stale 412
        `precondition_failed` with the current `version` in `error.details`, no write, AC19).
        Unknown or already soft-deleted 404 `not_found`, body over 64 KiB 413
        `payload_too_large`, missing `Idempotency-Key` 400 `request_invalid`, lock timeout 503
        `unavailable` with `Retry-After`. The answer is a bodiless 204.
      x-permission: authoring:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringManualCaseId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAuthoringRequest'
      responses:
        '204':
          description: Case soft-deleted; no body
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/manual-cases/{m}/state:
    post:
      operationId: setManualCaseState
      tags: [authoring]
      summary: Move a manual test case through its state machine (13.1.1-T2)
      description: >-
        13.1.1 §5 route 17 (`authoring:write`). `state` is `draft`, `approved` or `retired`, and
        the moves of 13.1.1 §6 are `draft → approved`, `draft → retired` and `approved →
        retired`; every other pair, including a move of a `retired` case, is 409
        `invalid_transition` and writes nothing. `retired` requires `reason` (1..500 code points;
        absent is 422 `request_invalid` with `details[].path = /reason`); the reason is optional
        on `draft → approved` (AC21). `If-Match` is the case's `version` (absent/malformed 422
        with `details[].path = /If-Match`, stale 412 `precondition_failed` with the current
        `version` in `error.details`, no write, AC19). A request that names the current state
        answers 200 with that state and `changed: false` in the version only — no version row
        and no audit row (AC5). Unknown or soft-deleted case 404 `not_found`, body over 64 KiB
        413 `payload_too_large`, missing `Idempotency-Key` 400 `request_invalid`, lock timeout
        503 `unavailable` with `Retry-After`. `code` never changes.
      x-permission: authoring:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringManualCaseId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetManualCaseStateRequest'
      responses:
        '200':
          description: The case's state and version after the call
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetManualCaseStateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/manual-cases/{m}/item:
    post:
      operationId: moveManualCase
      tags: [authoring]
      summary: Re-parent a manual test case to another checklist item (13.1.1-T2)
      description: >-
        13.1.1 §5 route 19 (`authoring:write`). Re-parents one case to a checklist item of the
        same project through `AuthoringVersionWriter.MoveManualTestCaseAsync`, which keeps
        `code`, bumps `version` and appends one `update` version row carrying the new
        `checklist_item_id` and the given `reason` (≤ 500 code points). The target must exist in
        the project and not be soft-deleted, else 422 `authoring_parent_invalid`
        (`details[].reason` `parent_not_found` / `parent_deleted`); a `retired` case or a
        `retired` target is 409 `invalid_transition`; a move onto the item that already holds
        the case writes nothing and answers the unchanged version. `If-Match` is the case's
        `version` (absent/malformed 422 with `details[].path = /If-Match`, stale 412
        `precondition_failed` with the current `version` in `error.details`, no write); of two
        concurrent moves one wins and the other is 412 (AC22). Unknown or soft-deleted case 404
        `not_found`, body over 64 KiB 413 `payload_too_large`, missing `Idempotency-Key` 400
        `request_invalid`, lock timeout 503 `unavailable` with `Retry-After` (the target item is
        locked before the case, so a nested call cannot invert the order into a `40P01`).
      x-permission: authoring:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringManualCaseId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveManualCaseRequest'
      responses:
        '200':
          description: The case's version and its new checklist item
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoveManualCaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-evidgate
      description: '`__Host-` httpOnly, Secure, SameSite=Lax browser session cookie (00 §9.1).'
    bearerToken:
      type: http
      scheme: bearer
      description: 'CLI/agent bearer tokens — `ci_producer`, ingest, personal (00 §9.1; T38: never cookie-authenticated).'
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC signature on inbound GitHub webhook deliveries (00 §9.3).
  parameters:
    BindingId:
      name: b
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestTokenId:
      name: t
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderPath:
      name: provider
      in: path
      required: true
      description: >-
        Login provider, matched exactly in lower case against the providers the deployment registers
        (02.3.1 §5). `google` (02.3.1-T1.2) and `github` (02.3.1-T1.3) are the two V1 providers. A route
        value no provider is registered under answers 404 `not_found`; a registered provider without a
        client credential answers 503 `unavailable`, never 404.
      schema:
        type: string
        enum: [google, github]
    LoginReturnUrl:
      name: returnUrl
      in: query
      required: false
      description: >-
        Post-login destination, allowlisted by `ReturnUrlPolicy` (02.3.1 §8): a same-origin path with
        exactly one leading `/`, no backslash or control character, at most 512 characters, re-checked
        through up to four percent-decoding passes. Any other value — `//host`, `/\host`, a scheme — is
        replaced by `/` and is not an error. The value travels only inside the protected pending-login
        cookie, never in a URL to the provider.
      schema:
        type: string
        maxLength: 512
    OidcCode:
      name: code
      in: query
      required: false
      description: >-
        Authorization code of the provider redirect. Required in practice: a missing, empty or longer
        than 2048-character value answers 401 `token_invalid`, the same typed refusal as a mismatch, so
        the route is no oracle for which check failed.
      schema:
        type: string
        maxLength: 2048
    OidcState:
      name: state
      in: query
      required: false
      description: >-
        The one-time `state` `start` generated and put in the pending-login cookie. Compared in constant
        time; a missing, mismatched or already consumed value answers 401 `token_invalid`.
      schema:
        type: string
    OidcError:
      name: error
      in: query
      required: false
      description: >-
        The provider's own error code when it refused the request (`access_denied` and the like). Its
        presence alone answers 401 `token_invalid`, and its value is never echoed — it can carry the code
        or a description.
      schema:
        type: string
    AuditExportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
    AuditActorType:
      name: actor_type
      in: query
      required: false
      schema:
        type: string
        enum: [user, ci_producer, agent, platform_operator, system]
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    AuditObjectType:
      name: object_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(created_at, id)` (00 §9.1).
      schema:
        type: string
    PolicyRevisionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(revision_no, id)` (07.1.1-T3, 00 §9.1).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    RunRefName:
      name: ref_name
      in: query
      required: false
      description: >-
        Exact `ref_name` of the run's recorded identity (05.2.2 §5, AC6): the
        branch of `refs/heads/<n>`, the tag of `refs/tags/<n>`, or GitHub's
        `<N>/merge` for a pull request. 1..255 code points with no control
        character; a present but invalid value is 422 `request_invalid` with
        `details[].path` = `ref_name`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RunPrNumber:
      name: pr_number
      in: query
      required: false
      description: >-
        Exact `pr_number` of the run's recorded identity (05.2.2 §5, AC6); an
        integer ≥ 1, a present but invalid value is 422 `request_invalid` with
        `details[].path` = `pr_number`.
      schema:
        type: integer
        format: int32
        minimum: 1
    RunHeadSha:
      name: head_sha
      in: query
      required: false
      description: >-
        Exact `head_sha` of the run's recorded identity (05.2.2 §5, AC6):
        GitHub's SHA-1 or SHA-256 commit id, lowercase. A present but invalid
        value is 422 `request_invalid` with `details[].path` = `head_sha`.
      schema:
        type: string
        pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
    RunTriggerEvent:
      name: trigger_event
      in: query
      required: false
      description: >-
        Exact `trigger_event` of the run's recorded identity (05.2.2 §5, AC6).
        A present but invalid value is 422 `request_invalid` with
        `details[].path` = `trigger_event`.
      schema:
        type: string
        enum: [push, pull_request, schedule, manual, dispatch]
    RunIsFork:
      name: is_fork
      in: query
      required: false
      description: >-
        Exact `is_fork` of the run's recorded identity (05.2.2 §5, AC6); the
        literal `true` or `false`. A present but invalid value is 422
        `request_invalid` with `details[].path` = `is_fork`.
      schema:
        type: boolean
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied, ≤ 128 chars, unique per `(org_id, project_id, operation)` ≥ 24 h (00 §7/§9.1).
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag for optimistic concurrency; stale → 412 (00 §9.1).
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: >-
        Optional optimistic-concurrency check: the caller's cached head revision
        id, quoted; stale or malformed → 412 with the current head revision id in
        `error.details`; absent means no check (00 §9.1, 07.1.1-T3).
      schema:
        type: string
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        Required whenever the caller is cookie-authenticated (00 §9.1, T38);
        bearer-only callers omit it. 403 `csrf_failed` on mismatch.
      schema:
        type: string
    OrgId:
      name: o
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: m
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: p
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: a
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentSlug:
      name: e
      in: path
      required: true
      schema:
        type: string
    SupportGrantId:
      name: g
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteId:
      name: s
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, missing, archived]
    CaseFrameworkFilter:
      name: framework
      in: query
      required: false
      schema:
        type: string
    CaseId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
      description: When true, nothing is written; the response previews the revision.
    AgainstRevision:
      name: against
      in: query
      required: true
      schema:
        type: string
        format: uuid
    SuiteRevisionId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: d
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: i
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: j
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaiverId:
      name: w
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuarantineEntryId:
      name: q
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthoringNodeId:
      name: n
      in: path
      required: true
      description: Feature-tree node id (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringChecklistItemId:
      name: i
      in: path
      required: true
      description: Checklist item id (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringManualCaseId:
      name: m
      in: path
      required: true
      description: Manual test case id (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringParentIdFilter:
      name: parent_id
      in: query
      required: false
      description: >-
        List the live children of this node instead of the roots (13.1.1 §5 route 1). An
        unknown, soft-deleted or other-project id is 404 `not_found`.
      schema:
        type: string
        format: uuid
    AuthoringNodeIdFilter:
      name: node_id
      in: query
      required: false
      description: Address one node (route 1) or narrow a list to this node's entries (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringItemIdFilter:
      name: item_id
      in: query
      required: false
      description: Narrow the manual-case list to one checklist item (13.1.1 §5 route 12).
      schema:
        type: string
        format: uuid
    AuthoringInclude:
      name: include
      in: query
      required: false
      description: >-
        Comma-separated tokens. `path` adds `path` (the addressed node's ancestors, root first);
        `counts` is always present and needs no token. Any other token is 422 `request_invalid`
        with `details[].path = /include`.
      schema:
        type: string
        maxLength: 64
    AuthoringItemStateFilter:
      name: state
      in: query
      required: false
      description: Checklist item state filter (13.1.1 §6).
      schema:
        type: string
        enum: [draft, active, retired]
    AuthoringCaseStateFilter:
      name: state
      in: query
      required: false
      description: Manual test case state filter (13.1.1 §6).
      schema:
        type: string
        enum: [draft, approved, retired]
    AuthoringPriorityFilter:
      name: priority
      in: query
      required: false
      description: Priority filter shared by checklist items and manual test cases (13.1.1).
      schema:
        type: string
        enum: [critical, high, medium, low]
    AuthoringQuery:
      name: q
      in: query
      required: false
      description: >-
        Case-insensitive title substring, at most 200 code points; `%`, `_` and `\` are escaped
        so the term is matched literally (13.1.1 §5 route 12, 13.1.1-T2).
      schema:
        type: string
        maxLength: 200
    AuthoringCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from `next_cursor`; the order is the one the route declares (`(position,
        id)` for tree and checklist pages, `(code, id)` for manual cases, 00 §9.1).
      schema:
        type: string
    IfMatchOrder:
      name: If-Match
      in: header
      required: true
      description: >-
        Order tag of the sibling set, `"order:sha256:<hex>"` — `AuthoringHashes.OrderHash` over
        the sorted `(id, version)` pairs of the parent's live siblings (13.1.1-T2) — never a
        row `version`. Absent or malformed is 422 `request_invalid` with `details[].path =
        /If-Match` (`required` / `invalid`); a stale tag is 412 `precondition_failed` with the
        current tag in `error.details`, and nothing is written.
      schema:
        type: string
  headers:
    XRequestId:
      description: Server request id; echoed in `error.request_id` (00 §9.1/§9.2).
      schema:
        type: string
    RetryAfter:
      description: Seconds (or HTTP-date) to wait before retrying (00 §9.2).
      schema:
        type: string
    ETag:
      description: The row's `version`, quoted; send it back in `If-Match` (00 §9.1).
      schema:
        type: string
    NoStore:
      description: >-
        `Cache-Control: no-store` — a browser-flow answer is never reusable (02.3.1 §5: the pending-login
        and session cookies of both login routes).
      schema:
        type: string
        enum: [no-store]
  responses:
    BadRequest:
      description: >-
        400 request_invalid — a malformed or missing request header, e.g. the `Idempotency-Key`
        every mutating authoring route requires (00 §9.1)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 401 unauthenticated (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TokenInvalid:
      description: >-
        401 `token_invalid` — the federated login could not be verified (02.3.1 AC8): the pending-login
        cookie is missing, expired or tampered with, the `state` does not match or was already used, the
        callback named another provider, the provider reported an `error`, the `code` is missing or
        oversized, or the provider rejected the exchange. One code and one message for every one of
        those causes, and no provider text, code, token, subject or email in the body.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '403 forbidden — includes token-scope mismatch and `csrf_failed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 not found — also for other-tenant ids (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: '409 conflict — e.g. `idempotency_conflict`, `run_closed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: 412 precondition failed — stale ETag; current revision id in `error.details` (00 §9.1/§9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: 413 too large (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 422 schema/manifest invalid — per-item causes in `error.details[]` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '429 — `rate_limited` (bursts) or `quota_exceeded` (tenant/project limit); always `Retry-After` (00 §9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 503 unavailable — always `Retry-After` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: 00 §9.2 error envelope; `details` never contains secrets.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  index:
                    type: integer
                  path:
                    type: string
                  reason:
                    type: string
    CursorList:
      type: object
      description: 00 §9.1 cursor list envelope; `next_cursor` is null when the page is last.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: [string, 'null']
    RunStateDto:
      type: object
      required: [run_id, state, current_evidence_revision_id, version, purpose, ref, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        current_evidence_revision_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The evidence revision the run's current verdict was frozen from;
            null while none exists (`run.current_evidence_revision_id`, 05.3.1;
            05.3.2 owns the write side).
        version:
          type: integer
          minimum: 0
        purpose:
          type: string
          enum: [regular, replay]
        ref:
          $ref: '#/components/schemas/RunRef'
        unverified_ref:
          type: boolean
          description: >-
            True when at least one stored identity value came from the request
            body instead of a verified CI claim (05.2.2-T1); false for a
            verified CI caller and for a run with no identity at all.
    RunSummary:
      type: object
      description: >-
        One row of `GET /v1/projects/{p}/runs` (05.2.2 §5). Since 05.2.2-T2 the
        list serves the run's state, `created_at`, the recorded identity `ref`
        and `unverified_ref`; `decision`, `parent_run_id`, `rerun_label` and
        `reprocess_label` remain optional here until 07 and 05.5.1/05.5.2 add
        them.
      required: [run_id, state, created_at, ref, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        created_at:
          type: string
          format: date-time
          description: Creation, UTC — the primary sort key of the list (AC6).
        ref:
          $ref: '#/components/schemas/RunRef'
        unverified_ref:
          type: boolean
          description: >-
            True when at least one stored identity value came from the request
            body instead of a verified CI claim (05.2.2-T1); false for a
            verified CI caller and for a run with no identity at all.
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        parent_run_id:
          type: [string, 'null']
          format: uuid
        rerun_label:
          type: [string, 'null']
        reprocess_label:
          type: [string, 'null']
    RunPage:
      type: object
      description: 00 §9.1 cursor page of `RunSummary`, keyset-ordered on `(created_at, id)` ascending (05.2.2-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunSummary' }
        next_cursor: { type: [string, 'null'] }
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [manifest_id]
      properties:
        manifest_id:
          type: string
          format: uuid
        release:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Optional release name; at M1 it resolves to 422
            `release_unresolvable` (05.6.1 owns the write-bind).
        purpose:
          type: string
          enum: [regular, replay]
          default: regular
          description: >-
            Optional run purpose; absent means `regular`. `replay` is refused
            422 `replay_grant_invalid` until 08.4.3 issues grants (05.2.1-T5);
            with `regular` it never changes the 201 shape.
        replay_grant_id:
          type: string
          format: uuid
          description: >-
            Optional grant id issued by 08.4.3; meaningful only with
            `purpose: replay`, where it must name a valid, unexpired grant
            bound to this project. With `regular` (or an absent `purpose`) it is
            422 `request_invalid` (`details[]` reason `invalid_value`, path
            `/replay_grant_id`; 05.2.1-T5).
        components:
          type: object
          description: Optional build identifiers for the run's components.
        ref:
          $ref: '#/components/schemas/RunRefRequest'
    RunCreated:
      type: object
      required: [run_id, state, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued]
        unverified_ref:
          type: boolean
          description: >-
            True when the stored identity block carries at least one
            body-supplied value (05.2.2-T1); false for a verified CI caller and
            for a run created without an identity.
    RunRefRequest:
      type: object
      additionalProperties: false
      description: >-
        Optional run identity supplied by the caller (00 §7/§8.1, 05.2.2-T1).
        A verified CI caller's OIDC claims always win and a conflicting member
        is ignored, never rejected (AC3); every value stored from here marks
        the run `unverified_ref = true`. An unknown member is 422
        `request_invalid` (`details[].path` `/ref/<member>`, reason
        `additional_properties`), like every other shape failure of this body.
      properties:
        kind:
          type: string
          enum: [branch, tag, pull_request]
          description: >-
            `pull_request` requires `pr_number`, checked on the values after
            the verified-claim merge → 422 `request_invalid`.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Branch or tag name; for a PR the GITHUB_REF_NAME form `<N>/merge`.
        pr_number:
          type: integer
          minimum: 1
        head_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
          description: 40 hex for a SHA-1 repo, 64 for a SHA-256 repo.
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        trigger_event:
          type: string
          enum: [push, pull_request, schedule, manual, dispatch]
        is_fork:
          type: boolean
          default: false
          description: >-
            Only a body value can set this: a verified CI caller is never a
            fork (02.4.1 refuses a fork exchange 403).
    RunRef:
      type: object
      additionalProperties: false
      description: >-
        The run's stored identity block (00 §7/§8.1, 05.2.2-T1). Every member is
        present, `null` where unknown; an existing run created before 05.2.2 has
        all members null and `is_fork` false. A verified `ci_producer` caller's
        `ref`/`sha` claims win over the request body; the remaining values are
        body-supplied and the run carries `unverified_ref = true`. `head_sha` is
        only ever the verified `sha` claim of a `branch` or `tag` ref: for a
        `pull_request` ref that claim is GitHub's test-merge commit and is not
        stored.
      required: [kind, name, pr_number, head_sha, base_sha, trigger_event, is_fork]
      properties:
        kind:
          type: [string, 'null']
          enum: [branch, tag, pull_request, null]
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        pr_number:
          type: [integer, 'null']
          minimum: 1
        head_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        base_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        trigger_event:
          type: [string, 'null']
          enum: [push, pull_request, schedule, manual, dispatch, null]
        is_fork:
          type: boolean
    Decision:
      type: object
      description: Evaluation decision or `pending` (00 §8.5/§9.3); `decision` values are upper case (00 §7).
      properties:
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        evaluation_revision:
          type: string
        reasons:
          type: array
          items:
            type: string
    EventBatch:
      type: object
      description: >-
        Inline mirror of `contracts/schemas/event-envelope.v1.json` (00 §9.4);
        the schema file is authoritative.
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: './schemas/event-envelope.v1.json#/$defs/event'
      x-max-bytes: 1048576
    BatchAckResult:
      type: object
      description: >-
        The 200 body of `POST /v1/runs/{r}/events` (00 §9.4): the batch row this
        call wrote, its counts and one ack per event in request order. A resend
        answers 200 with `accepted: 0` and every ack `duplicate`; no metering
        row is written for it (04.8.1 §4).
      required: [batch_id, accepted, duplicates, acks]
      properties:
        batch_id:
          type: string
          format: uuid
          description: The `event_batch` row written by this accepted batch.
        accepted:
          type: integer
          minimum: 0
          description: How many events were newly committed.
        duplicates:
          type: integer
          minimum: 0
          description: How many events were already on file with the identical canonical payload.
        acks:
          type: array
          items:
            $ref: '#/components/schemas/EventAck'
    EventAck:
      type: object
      description: One event's per-event acknowledgement (00 §9.4), in request order.
      required: [index, event_id, ack]
      properties:
        index:
          type: integer
          minimum: 0
          description: The 0-based position of the event in the request (`details[].index` uses the same numbering).
        event_id:
          type: string
          format: uuid
          description: The event's client-assigned id.
        ack:
          type: string
          enum: [accepted, duplicate]
          description: >-
            `accepted` when this batch committed the row, `duplicate` when it was
            already on file with the identical canonical payload.
    PermissionView:
      type: object
      description: >-
        One entry of the permission catalogue (00 §2). The catalogue holds no
        secrets: `sensitive` describes the permission, it is never a value.
      required: [code, resource, action, description, sensitive, reserved, tenant_assignable]
      properties:
        code:
          type: string
          pattern: '^[a-z_]+:[a-z_]+$'
          description: The `resource:action` string — the catalogue's identity.
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        sensitive:
          type: boolean
          description: True when the permission gates secret-adjacent data (AC5).
        reserved:
          type: boolean
          description: True when the string has no V1 consumer yet (AC2).
        tenant_assignable:
          type: boolean
          description: False for a code a member principal must never hold (T79).
    PermissionListResponse:
      type: object
      description: 00 §9.1 cursor page of `PermissionView`, ordered by `code`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionView'
        next_cursor:
          type: [string, 'null']
          description: The last code of the page when a further page exists, else null.
    RoleView:
      type: object
      description: One role — a built-in (`org_id` null) or the caller's own org row (02 §4.5).
      required: [id, code, name, is_builtin, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: [string, 'null']
          format: uuid
          description: Null for a built-in role, the owning org for a custom role.
        code:
          type: string
        name:
          type: string
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        version:
          type: integer
    RoleListResponse:
      type: object
      description: 00 §9.1 cursor page of `RoleView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CreateRoleRequest:
      type: object
      description: Body of `POST /v1/roles` (02.2.1 §5). V1 answers 403 until the custom-role flag is on.
      required: [code, name, permissions]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Role code; unique per org → 409 `role_code_taken`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: array
          description: Catalogue codes to grant; unknown → 422 `unknown_permission`, non-assignable → 422 `permission_not_assignable` (T79).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    UpdateRoleRequest:
      type: object
      description: Body of `PATCH /v1/roles/{r}` (02.2.1 §5). Both fields optional; a built-in role is 409 `builtin_role_immutable`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        add_permissions:
          type: array
          description: >-
            Catalogue codes granted in addition to the role's current set. Additive only:
            migration 0010 revokes `DELETE` on `role_permission` for the app role, so V1 cannot
            shrink a role's grant set (02.2.1 §3).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    OrganizationDto:
      type: object
      description: >-
        One organization (02.1.1 §4). `organization` is the T4 exception: its own `id` is
        the tenant key. Limit columns are null when no limit is set (02.1.1-T3).
      required:
        [
          id,
          name,
          slug,
          status,
          retention_default_days,
          allowed_email_domains,
          created_at,
          updated_at,
          version,
          max_projects,
          max_seats,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Globally unique (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        retention_default_days:
          type: [integer, 'null']
        allowed_email_domains:
          type: [array, 'null']
          maxItems: 64
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        max_projects:
          type: [integer, 'null']
          description: Projects that are not `deleted` the org may hold; null = no limit.
        max_seats:
          type: [integer, 'null']
          description: Active memberships the org may hold; null = no limit (enforced by plan 12).
    ProjectDto:
      type: object
      description: One project (02.1.1 §4); `unique (org_id, slug)`.
      required:
        [
          id,
          org_id,
          name,
          slug,
          status,
          default_environment_id,
          created_at,
          updated_at,
          version,
          retention_days,
          monthly_run_quota,
          case_prefix,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Unique within the org (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        default_environment_id:
          type: [string, 'null']
          format: uuid
          description: Null until 05.1.2-T1 adds the environment table.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        retention_days:
          type: [integer, 'null']
          description: Overrides the org's `retention_default_days`; null = inherit.
        monthly_run_quota:
          type: [integer, 'null']
          description: Runs per calendar month; null = no limit (enforced by plan 12).
        case_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,7}$'
          maxLength: 8
          description: >-
            Uppercase prefix of this project's manual test case codes, `<case_prefix>-<n>`
            (13.1.1 AC4, T2). The default is the stem rule of `0039_authoring_tree.sql`: the
            first four alphanumerics of the slug, upper-cased, `P`-prefixed when the stem would
            start with a digit, with a numeric suffix when the stem is already taken
            (`flashcards` → `FLAS`, `shop-web` → `SHOP`). Unique per organization.
    ProjectListResponse:
      type: object
      description: 00 §9.1 cursor page of `ProjectDto`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDto'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CaseDto:
      type: object
      description: A test case (03.1.1). Its identity (`annotation_id`, `first_seen_commit`) never changes.
      required:
        [
          id,
          org_id,
          project_id,
          annotation_id,
          name,
          framework,
          status,
          labels,
          first_seen_commit,
          created_at,
          updated_at,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
          description: The durable `evidgate.id`; the case's identity inside the project.
        name:
          type: string
          maxLength: 512
