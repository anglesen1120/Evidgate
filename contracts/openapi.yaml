          members_removed,
          required_changed,
          edges_added,
          edges_removed,
        ]
      properties:
        revision_id: { type: string, format: uuid }
        against_id: { type: string, format: uuid }
        members_added: { type: array, items: { $ref: '#/components/schemas/SuiteMemberKey' } }
        members_removed: { type: array, items: { $ref: '#/components/schemas/SuiteMemberKey' } }
        required_changed: { type: array, items: { $ref: '#/components/schemas/SuiteMemberKey' } }
        edges_added: { type: array, items: { $ref: '#/components/schemas/SuiteEdgeKey' } }
        edges_removed: { type: array, items: { $ref: '#/components/schemas/SuiteEdgeKey' } }
        shard_strategy: { oneOf: [{ $ref: '#/components/schemas/SuiteDelta' }, { type: 'null' }] }
        retry_policy: { oneOf: [{ $ref: '#/components/schemas/SuiteDelta' }, { type: 'null' }] }
        environment_requirements:
          { oneOf: [{ $ref: '#/components/schemas/SuiteDelta' }, { type: 'null' }] }
    CiBindingView:
