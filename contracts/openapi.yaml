      operationId: restoreAuthoringNode
      tags: [authoring]
      summary: Restore a soft-deleted feature node under If-Match (13.1.1-T3)
      description: >-
        13.1.1 §5 route 6 (`authoring:write`). Clears the node's `deleted_at`, re-appends the last
        live snapshot as one `restore` version (AC8) and answers the node's new `version`, which
        is the tag the next write must present (AC19). A position a live sibling now holds is
        resolved at `max + 1` of that sibling group; the sibling group's advisory lock is taken
        before the parent and the node, so a restore racing a create or a reorder cannot invert
        the lock order. `If-Match` is the soft-deleted row's `version` — a tombstone keeps its
        version, so the caller names the tag it read: absent or malformed is 422
