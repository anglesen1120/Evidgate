      operationId: listEvidenceRevisions
      tags: [runs]
      summary: Cursor list of a run's evidence revisions (newest first)
      description: >-
        Cursor list (00 §9.1) of one run's rows of `evidence_revision` (0049),
        newest first (`revision_no` descending). The table is append-only: a
        late-evidence re-freeze adds the next `revision_no` and never rewrites
        an existing row, so an older revision keeps the `completeness` and
        `missing[]` it was frozen with (00 §8.1). Items carry the row's own
        `revision_no`, `created_at`, `completeness` (`complete`/`incomplete`,
        00 §8.5), `missing[]` verbatim from the row (the closed 00 §8.5 reason
        list; a `complete` row is always empty) and `evaluation_id` — the id of
        the `evaluation` row (0059) evaluated from this revision whose `mode` is
        `live`, or `null` while none exists; a `shadow` evaluation is never
        served. The opaque `cursor` is not signed and is bound to the caller's
        own run and tenant by the query; a cursor this endpoint did not issue is
        422 `request_invalid` (`details[].path` = `cursor`), as is an integer
        `limit` outside 1–200 (`limit`) — `-1` and `0` take that answer, not the
        malformed one. A `limit` that is not the canonical spelling of an
        integer (`abc`, `1.5`, ` 5`, `+5`, `01`), an undecodable or truncated
        query string are 400 `request_invalid` before the handler runs, so a
        client can tell "not this number" from "this number is refused". An
        unknown run, another tenant's run
        and, for a project-scoped credential, a sibling project's run are the
        one 404 `not_found` body of `GET /v1/runs/{r}` — no existence oracle
        (00 §5.4); a run with no evidence revision answers 200 with
        `items: []`.
