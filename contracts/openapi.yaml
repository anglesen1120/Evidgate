        bring its sibling group past the 1000 live nodes a create and a move-in already refuse is
        422 `request_invalid` with `details[].path = /parent_id` and
        `details[].reason = children_limit_exceeded` — the row keeps its tombstone and the caller
        frees a slot first, so a group a reorder can still renumber never grows out of reach.
