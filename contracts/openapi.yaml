      x-version: v1
      parameters:
        - $ref: '#/components/parameters/HealingProjectQuery'
      responses:
        '200':
          description: The three scope rows, the resolved mode and the dependency observations
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealingSwitchResolutionView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: setHealingSwitch
      tags: [healing]
      summary: Set the healing switch (`enabled|shadow|disabled` only, TL T33)
      description: >-
        Sets the switch of the org (`scope: tenant`) or of one of its projects (`scope: project` with
        `project_id`); `healing:configure` is required and `Idempotency-Key` is mandatory — a replay of the
        same key and body answers the same stored switch, and a different body under the same key is `409
        idempotency_conflict` (00 §9.1). There is no `If-Match`: concurrency is the row's `version`, which
        the response carries. `scope: system` is `403 forbidden_scope` and is refused before any project
        lookup, so a tenant cannot probe ids through a system write; the platform row is written only by
        the operator ingress (`POST /internal/operator/healing/switch`). A `tenant` body carrying a
        `project_id` is `422` with `project_id: not_allowed`, a `project` body without one is `422
        project_id: required`, a `project_id` outside the credential's or the request's scope is `403
        project_scope_mismatch`, and an unknown, soft-deleted or other-tenant one is `404`. The mode
        vocabulary is `enabled`, `shadow`, `disabled`: anything else — `unavailable` included, because it
        is a dependency observation and not a configuration — is `422 invalid_switch_mode`, and `enabled`
        while the deployment runs with `Healing:Apply` off (the default in V1, ruling T33) is `422
        mode_not_available`, on this route and on the operator's system write alike. The body is
        `contracts/schemas/healing-switch-set.v1.json` (closed, 4 KiB → `413`); `reason` is 1–2000 Unicode code
        points when present — the unit the column's own `length(reason)` check uses, so a reason of 1001 emoji is
        1001 characters and fits. A change writes one `healing.switch_changed` outbox event carrying the
        row's version, so a retry adds none.
      x-permission: healing:configure
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/healing-switch-set.v1.json'
      responses:
        '200':
          description: The stored switch of that scope
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealingSwitchView'
        '401':
