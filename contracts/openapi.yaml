        today — no `evaluation` row exists until 07.2.2, so no decision is
        stored to narrow the page with and `pending` matches every run in it,
        while the `RunSummary.decision` member stays `null` in every item until
        the evaluator stores one (07.2.2, served by 07.5.2); any other value is
