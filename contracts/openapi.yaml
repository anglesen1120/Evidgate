      tags: [authoring]
      summary: Keyset page of the project's authoring versions, newest first (13.1.1-T3)
      description: >-
        13.1.1 §5 route 22 (`authoring:read`). One page of `authoring_version` rows in the fixed
        `(created_at desc, id desc)` order (AC9), optionally narrowed by `entity_kind`
        (`feature_node`, `checklist_item`, `manual_test_case`), by the exact `entity_id`, by
        `source` (`manual`, `ai`, `import`), by `actor` (the authoring membership that wrote the
        change) and by the half-open window `from` (inclusive) .. `to` (exclusive), both RFC 3339
        instants with an explicit offset, whose UTC offset is normalised (the stored instants are
        UTC). `from` later than `to` is 422 `request_invalid` with
