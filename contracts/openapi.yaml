      tags: [runs]
      summary: Cursor list of a run's attempts (raw and normalised status, retry chain)
      description: >-
        Cursor list (00 §9.1) of one run's rows of `case_attempt` (0032),
        ordered `(execution_key, attempt_no)` ascending, so the attempts of one
        planned execution are adjacent and in attempt order. There is no
        `retry_of` column: the retry chain is the pair `(execution_key,
        attempt_no)` — unique per run by
        `case_attempt_run_execution_attempt_key` — and `attempt_no` ≥ 2 is a
        retry of the previous attempt of the same `execution_key`. Items carry
        the producer's `raw_status` verbatim beside the server's
        `normalized_status` (00 §8.5 vocabulary), the row's own
        `started_at`/`finished_at`/`duration_ms` (`null` where unrecorded), the
        attempt's artifact count (its `artifact` rows in state `ready`) and
        `healing_candidate`, which is `null` until the candidate model exists
        (08.3.1; shadow rows 08.3.3). The opaque `cursor` is not signed and is
        bound to the caller's own run and tenant by the query; a cursor this
        endpoint did not issue is 422 `request_invalid`
        (`details[].path` = `cursor`), as is an out-of-range `limit`
        (`limit`). An unknown run, another tenant's run and, for a
        project-scoped credential, a sibling project's run are the one 404
        `not_found` body of `GET /v1/runs/{r}` — no existence oracle (00 §5.4);
        a run with no attempts answers 200 with `items: []`.
