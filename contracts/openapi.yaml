          items: { $ref: '#/components/schemas/SuiteMemberInput' }
        edges:
          type: array
          maxItems: 50000
          items: { $ref: '#/components/schemas/SuiteEdgeInput' }
        shard_strategy:
          type: object
          description: contracts/catalog/shard-strategy.v1.json; default {"kind":"none"}.
        retry_policy:
          type: object
          description: contracts/catalog/retry-policy.v1.json; default {"max_retries":0}.
