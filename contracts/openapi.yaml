      description: >-
        13.1.1 §5 route 1. Without `node_id` and `parent_id` the live roots (parent null) are
        returned in `(position, id)` order, so `next_cursor` pages the whole root set; with
        `parent_id` the live children of that node; with `node_id` the answer also carries
        `node` and `path` (its ancestors, root first) and `items` holds its live children
        (page 1 only). `include` accepts the tokens `path` and `counts` (counts are always
        returned, `path` is honoured with `parent_id` too); any other token is 422
        `request_invalid` with `details[].path = /include`. `child_count` counts live child
        nodes and `item_count` live checklist items (13.1.1 §5). Another tenant's project is
        404 `not_found`; a credential scoped to a sibling project of the same org is 403
        `project_scope_mismatch`; an unknown, soft-deleted or other-project `node_id`/`parent_id`
