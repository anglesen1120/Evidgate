            Changes this project's manual test case code prefix (13.1.1-T2, 02.1.1 §5). Unique
            per organization: another project already using it is 409 `case_prefix_taken`
            (`details[].path = /case_prefix`), and codes already allocated are never rewritten.
        retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
    MembershipView:
      type: object
      description: One membership of an org (02.1.2 §4) with the roles it currently holds.
      required: [id, org_id, invited_email, status, roles, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          format: uuid
          description: Null while the invite is `pending`; set when a login binds it (02.3.1-T2).
        invited_email:
          type: string
          description: The normalised invite address (trimmed, lowercased). Personal data (02.1.2 §8).
        status:
          type: string
          enum: [pending, active, removed, revoked, expired]
        roles:
          type: array
          description: The role set of 02.1.2 §6 — built-in catalogue roles plus the org's own.
          items:
            $ref: '#/components/schemas/RoleView'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
    MembershipListResponse:
      type: object
      description: 00 §9.1 cursor page of `MembershipView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    InviteMemberRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/memberships` (02.1.2 §5) — invite by address, optionally with initial roles.
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          description: The invited address; normalised (trimmed, lowercased) before it is stored or compared.
        roles:
          type: array
          description: Role ids the membership starts with; each must be built-in or the caller's own org role (else 409 `unknown_role`).
          items:
            type: string
            format: uuid
    UpdateMembershipRequest:
      type: object
      description: Body of `PATCH /v1/orgs/{o}/memberships/{m}` (02.1.2 §5). `If-Match` carries the row's `version`; stale → 412.
      required: [status]
      properties:
        status:
          type: string
          enum: [removed]
          description: >-
            Only `removed` — the admin disable path (AC3). Activating a pending invite is the
            invite-binding flow of 02.1.2-T2 (T75), never a client-set status.
    GrantRoleRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/memberships/{m}/roles` (02.1.2 §5) — grant one role to one membership.
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
          description: A built-in catalogue role or one of the caller's own org roles (else 409 `unknown_role`).
    WaiverDto:
      type: object
      description: >-
        One risk-acceptance waiver (07.3.1-T1, 00 §8.8). `approved_by` is null until a
        different approver approves it; `state` is returned as stored.
      required:
        [
          id,
          project_id,
          scope,
          target_id,
          reason,
          requested_by,
          approved_by,
          state,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        scope: { type: string, enum: [case, suite] }
        target_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        requested_by: { type: string, format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [requested, approved, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WaiverCreateRequest:
      type: object
      description: >-
        Body of `POST /v1/waivers` (07.3.1-T1 §5). `expires_at` must be strictly in the
        future; `reason` is 1..2000 characters.
      required: [project_id, scope, target_id, reason, expires_at]
      properties:
        project_id: { type: string, format: uuid }
        scope: { type: string, enum: [case, suite] }
        target_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expires_at: { type: string, format: date-time }
    WaiverPage:
      type: object
      description: 00 §9.1 cursor page of `WaiverDto`, keyset-ordered on `(created_at, id)` ascending.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WaiverDto' }
        next_cursor: { type: [string, 'null'] }
    QuarantineEntry:
      type: object
      description: >-
        One quarantine entry (07.3.1-T2, 00 §8.8): a case excluded from gating while its
        failure stays visible. `state` is returned as stored (`active`, `expired`, `removed`).
      required: [id, project_id, case_id, owner, reason, state, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        owner: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        state: { type: string, enum: [active, expired, removed] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuarantineEntryCreateRequest:
      type: object
      description: >-
        Body of `POST /v1/quarantine` (07.3.1-T2 §5). `expires_at` must be strictly in the
        future; `reason` is 1..2000 characters; `case_id` must be a case of `project_id` and
        `owner` a membership of the org.
      required: [project_id, case_id, owner, reason, expires_at]
      properties:
        project_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        owner: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expires_at: { type: string, format: date-time }
    QuarantineEntryPage:
      type: object
      description: 00 §9.1 cursor page of `QuarantineEntry`, keyset-ordered on `(created_at, id)` ascending.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuarantineEntry' }
        next_cursor: { type: [string, 'null'] }
    UploadUrlResponse:
      type: object
      description: >-
        200 body of `POST /v1/artifacts/upload-url` (06.1.2 §5, AC1). `object_key`
        is the `pending/<org_id>/<artifact_id>` staging key the client `PUT`s to;
        `required_headers` are the signed headers the client must send verbatim
        (`Content-Length` = the declared `bytes`, `x-amz-checksum-sha256` = the
        base64 of the declared digest); `expires_at` is at most 15 minutes out.
      required: [artifact_id, object_key, upload_url, required_headers, expires_at]
      properties:
        artifact_id: { type: string, format: uuid }
        object_key: { type: string }
        upload_url: { type: string, format: uri }
        required_headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
    CompleteResponse:
      type: object
      description: >-
        200 body of `POST /v1/artifacts/{a}/complete` (06.1.2 §5, AC3/AC4/AC5). `state` is
        `ready` when the staged object matched the declared size and checksum and the
        commit landed, or `rejected` when verification failed — a rejection is still a
        committed 200 carrying `failure_code` (one of `size_mismatch`,
        `checksum_mismatch`, `media_type_mismatch`, `too_large`, `object_missing`), never
        an error response. `bytes` is the size the store reported, or `null` when nothing
        was verified; `scan_state` is `pending` on a `ready` artifact (`pending`/`clean`/
        `flagged` are the 06.2.3 values) and `null` on a `rejected` one. The final object
        key is never returned.
      required: [artifact_id, state, bytes, scan_state, failure_code]
      properties:
        artifact_id: { type: string, format: uuid }
        state: { type: string, enum: [ready, rejected] }
        bytes: { type: [integer, 'null'] }
        scan_state: { type: [string, 'null'] }
        failure_code: { type: [string, 'null'] }
    NodeDto:
      type: object
      description: >-
        One feature-tree node (13.1.1 §4); 13.1.1-T2. `child_count` and `item_count` count live
        children and live checklist items and are always returned (§5 route 1).
      required: [node_id, parent_id, kind, title, position, version, child_count, item_count]
      properties:
        node_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [module, feature, category, sub_category] }
        title: { type: string, minLength: 1, maxLength: 200 }
        position:
          {
            type: integer,
            minimum: 0,
            description: 'Unique among the live siblings of one parent (AC2).',
          }
        version: { type: integer, minimum: 1, description: 'The `ETag` / `If-Match` value (AC19).' }
        child_count: { type: integer, minimum: 0 }
        item_count: { type: integer, minimum: 0 }
    NodePathEntry:
      $ref: '#/components/schemas/AuthoringNodePathEntry'
    AuthoringNodePathEntry:
      type: object
      description: One ancestor of a node in `path`, root first (13.1.1 §5 route 1).
      required: [node_id, kind, title]
      properties:
        node_id: { type: string, format: uuid }
        kind: { type: string, enum: [module, feature, category, sub_category] }
        title: { type: string, maxLength: 200 }
    AuthoringTreeResponse:
      type: object
      description: >-
        The 200 body of route 1: a page of nodes, plus the addressed `node` and its `path` when
        the call named `node_id` (13.1.1-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeDto'
        next_cursor: { type: [string, 'null'] }
        node: { oneOf: [{ $ref: '#/components/schemas/NodeDto' }, { type: 'null' }] }
        path:
          oneOf:
            [
              { type: array, items: { $ref: '#/components/schemas/NodePathEntry' } },
              { type: 'null' },
            ]
    CreateNodeRequest:
      type: object
      description: >-
        Body of route 2 (13.1.1-T2). `position` is omitted to append; the placement ladder is
        strict, so only a `module` may omit `parent_id`.
      additionalProperties: false
      required: [kind, title]
      properties:
        parent_id: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [module, feature, category, sub_category] }
        title: { type: string, minLength: 1, maxLength: 200 }
        position: { type: [integer, 'null'], minimum: 0 }
    CreateNodeResponse:
      type: object
      description: The 201 body of route 2 (13.1.1-T2).
      required: [node_id, version]
      properties:
        node_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    UpdateNodeRequest:
      type: object
      description: >-
        Body of route 3 (13.1.1-T2); an omitted member is unchanged and `parent_id: null` moves
        the node to the root level.
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        parent_id: { type: [string, 'null'], format: uuid }
        position: { type: [integer, 'null'], minimum: 0 }
    ReorderNodesRequest:
      type: object
      description: >-
        Body of route 4 (13.1.1-T2): the complete live sibling set of the node's parent, each id
        exactly once, the addressed node included, at most 1000 ids — the same cap a create or a
        move-in meets.
      additionalProperties: false
      required: [ordered_ids]
      properties:
        ordered_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    ReorderNodesResponse:
      type: object
      description: The 200 body of route 4 (13.1.1-T2); `changed` is false when the request reproduces the stored order.
      required: [changed]
      properties:
        changed: { type: boolean }
    DeleteAuthoringRequest:
      type: object
      description: >-
        The whole body of a delete route is optional (13.1.1-T2); the only member is the reason
        recorded on the `SoftDelete` version row. A reason is 1..500 code points — `maxLength`
        counts code points, so the schema, the column CHECK and the validator agree — and a
        whitespace-only reason is accepted, the rule every authoring reason follows.
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    AuthoringChangeResponse:
      type: object
      description: >-
        The 200 body of a PATCH or state route (13.1.1-T2): the version after the call and
        whether anything changed; a no-op answers the stored version with `changed: false`.
      required: [version, changed]
      properties:
        version: { type: integer, minimum: 1 }
        changed: { type: boolean }
    ChecklistItemDto:
      type: object
      description: One checklist item of the feature tree (13.1.1 §4); 13.1.1-T2.
      required: [item_id, node_id, title, description, priority, state, source, position, version]
      properties:
        item_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority: { type: string, enum: [critical, high, medium, low] }
        state: { type: string, enum: [draft, active, retired] }
        source: { type: string, enum: [manual, ai, import] }
        position: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    ChecklistItemListResponse:
      type: object
      description: 00 §9.1 keyset page of `ChecklistItemDto`, ordered `(position, id)` (13.1.1-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItemDto'
        next_cursor: { type: [string, 'null'] }
    CreateChecklistItemRequest:
      type: object
      description: >-
        Body of route 8 (13.1.1-T2). A manual create starts `active` (§6, CR-13-1) and `source`
        is `manual`; `position` is omitted to append.
      additionalProperties: false
      required: [node_id, title, priority]
      properties:
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority: { type: string, enum: [critical, high, medium, low] }
        position: { type: [integer, 'null'], minimum: 0 }
    CreateChecklistItemResponse:
      type: object
      description: The 201 body of route 8 (13.1.1-T2).
      required: [item_id, version, state]
      properties:
        item_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        state: { type: string, enum: [draft, active, retired] }
    UpdateChecklistItemRequest:
      type: object
      description: >-
        Body of route 9 (13.1.1-T2); an omitted member is unchanged and an explicit `null`
        description clears it. `reason` is required when the move retires the item.
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority: { type: [string, 'null'], enum: [critical, high, medium, low, null] }
        position: { type: [integer, 'null'], minimum: 0 }
        state: { type: [string, 'null'], enum: [draft, active, retired, null] }
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    DeleteChecklistItemRequest:
      type: object
      description: The optional body of route 10; the only member is the reason on the `SoftDelete` version row (13.1.1-T2).
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    ManualCaseStepDto:
      type: object
      description: >-
        One step of a manual test case, the item shape of
        `contracts/schemas/authoring-steps.v1.json` (13.1.1-T1.2), which stays the validated
        source: 1..100 steps, unknown members refused at the document level and inside a step.
      additionalProperties: false
      required: [no, action, expected]
      properties:
        no:
          {
            type: integer,
            minimum: 1,
            maximum: 1000,
            description: 'The number shown to the tester; array order is the execution order.',
          }
        action: { type: string, maxLength: 2000 }
        expected: { type: string, maxLength: 2000 }
        data: { type: [string, 'null'], maxLength: 2000 }
    ManualCaseListItemDto:
      type: object
      description: >-
        One row of the manual-case list (13.1.1-T2). The list projection carries no
        `description`, `precondition` or `steps`, and no coverage field: `linked_live_count`
        belongs to 13.1.1-T4.
      required: [case_id, code, checklist_item_id, node_id, title, priority, state, version]
      properties:
        case_id: { type: string, format: uuid }
        code:
          {
            type: string,
            pattern: '^[A-Z][A-Z0-9]{1,7}-[0-9]{3,}$',
            description: 'The allocated, immutable code `<PREFIX>-<n>` (AC4).',
          }
        checklist_item_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        priority: { type: string, enum: [critical, high, medium, low] }
        state: { type: string, enum: [draft, approved, retired] }
        version: { type: integer, minimum: 1 }
    ManualCaseListResponse:
      type: object
      description: 00 §9.1 keyset page of `ManualCaseListItemDto`, ordered `(code, id)` (13.1.1-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManualCaseListItemDto'
        next_cursor: { type: [string, 'null'] }
    ManualCaseDetailDto:
      type: object
      description: >-
        The 200 body of route 14: one manual test case with its steps (13.1.1-T2). The
        `links`/coverage members belong to 13.1.1-T4 and are absent here.
      required:
        [
          case_id,
          code,
          checklist_item_id,
          node_id,
          title,
          description,
          precondition,
          steps,
          priority,
          state,
          version,
          created_at,
          updated_at,
        ]
      properties:
        case_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9]{1,7}-[0-9]{3,}$' }
        checklist_item_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        precondition: { type: [string, 'null'], maxLength: 4000 }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ManualCaseStepDto'
        priority: { type: string, enum: [critical, high, medium, low] }
        state: { type: string, enum: [draft, approved, retired] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateManualCaseRequest:
      type: object
      description: >-
        Body of route 13 (13.1.1-T2). `steps` is validated against
        `contracts/schemas/authoring-steps.v1.json`; `code` is server-allocated and must not be
        sent.
      additionalProperties: false
      required: [checklist_item_id, title, steps, priority]
      properties:
        checklist_item_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        precondition: { type: [string, 'null'], maxLength: 4000 }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ManualCaseStepDto'
        priority: { type: string, enum: [critical, high, medium, low] }
    CreateManualCaseResponse:
      type: object
      description: "The 201 body of route 13: the new case's id, its allocated code and its first version (13.1.1-T2)."
      required: [case_id, code, version]
      properties:
        case_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9]{1,7}-[0-9]{3,}$' }
        version: { type: integer, minimum: 1 }
    UpdateManualCaseRequest:
      type: object
      description: >-
        Body of route 15 (13.1.1-T2). An absent member is unchanged, an explicit `null`
        description or precondition clears it, and `code` / `checklist_item_id` are not members
        at all (a move is route 19).
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        precondition: { type: [string, 'null'], maxLength: 4000 }
        steps:
          oneOf:
            [
              {
                type: array,
                minItems: 1,
                maxItems: 100,
                items: { $ref: '#/components/schemas/ManualCaseStepDto' },
              },
              { type: 'null' },
            ]
        priority: { type: [string, 'null'], enum: [critical, high, medium, low, null] }
    SetManualCaseStateRequest:
      type: object
      description: Body of route 17 (13.1.1-T2); `reason` is required when the target state is `retired`.
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [draft, approved, retired] }
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    SetManualCaseStateResponse:
      type: object
      description: 'The 200 body of route 17: the state the case is in now and its version (13.1.1-T2).'
      required: [state, version]
      properties:
        state: { type: string, enum: [draft, approved, retired] }
        version: { type: integer, minimum: 1 }
    MoveManualCaseRequest:
      type: object
      description: 'Body of route 19 (13.1.1-T2): the checklist item the case moves under.'
      additionalProperties: false
      required: [checklist_item_id]
      properties:
        checklist_item_id: { type: string, format: uuid }
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    MoveManualCaseResponse:
      type: object
      description: "The 200 body of route 19: the case's version and its new checklist item (13.1.1-T2)."
      required: [version, checklist_item_id]
      properties:
        version: { type: integer, minimum: 1 }
        checklist_item_id: { type: string, format: uuid }
security:
  - sessionCookie: []
  - bearerToken: []
