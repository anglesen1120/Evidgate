        in the future and `reason` 1..2000 characters, else 422 with `error.details[]` per
        field. The waiver starts `requested` with `requested_by` = the caller; a different
        `release_approver` approves it (`POST /v1/waivers/{w}/approve`). Idempotency-Key
        required.
