  /healing/switch:
    get:
      operationId: getHealingSwitch
      tags: [healing]
      summary: Resolved healing availability per scope (most restrictive wins)
      description: >-
        The healing kill switch in force (08.6.3-T1, 00 §8.7, rulings T33/T72). Three scopes may carry a
        row — the platform-wide `system` row the operator ingress writes, the org's `tenant` row and an
        optional `project` row — and each is returned as stored, `null` when that scope has none. The
        resolved value is the most restrictive stored mode (`disabled` > `shadow` > `enabled`), and a
        database with no row at any scope resolves to `shadow`: the V1 posture of healing that decides but
        never applies. `unavailable` exists in the vocabulary (00 §8.7) but this story never produces it —
        it is an observation of 08.6.3-T2's health probes, and both `dependency_health` fields are `null`
        until then (`null` means not observed, never healthy). A `project_id` outside the credential's or
        the request's scope is `403 project_scope_mismatch`; an unknown, soft-deleted or other-tenant one is
        `404` (also for another tenant's project). The `system` member is redacted for a tenant read: `mode`, `at`
        and `version` only, with `set_by` and `reason` null — the operator's identity and incident notes stay on the
        operator ingress. One SQL statement reads the three rows (AC9).
