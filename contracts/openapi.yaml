        issue is 422 with `details[].path` naming the parameter. The page is a keyset seek on the
        `(created_at, id)` pair of the last row, so `next_cursor` never skips or repeats a row.
        Another tenant's project and a project this caller cannot see are the same 404
        `not_found`; a credential scoped to a sibling project of the same org is 403
        `project_scope_mismatch`.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringVersionEntityKindFilter'
        - $ref: '#/components/parameters/AuthoringVersionEntityIdFilter'
        - $ref: '#/components/parameters/AuthoringVersionSourceFilter'
        - $ref: '#/components/parameters/AuthoringVersionActorFilter'
        - $ref: '#/components/parameters/AuthoringVersionFrom'
        - $ref: '#/components/parameters/AuthoringVersionTo'
        - $ref: '#/components/parameters/AuthoringVersionCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of authoring versions
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/versions/{v}:
    get:
      operationId: getAuthoringVersion
      tags: [authoring]
      summary: One authoring version with its stored content; ETag is its content hash (13.1.1-T3)
      description: >-
        13.1.1 §5 route 23 (`authoring:read`). The twelve row members of route 22 plus `content`,
        the stored document exactly as the writer hashed it — the content is never re-serialised
        through a typed model, so whatever the version holds is what the caller reads. The
        response's `ETag` is the row's `content_hash` in quotes (`"sha256:<hex>"`); a version is
        immutable, so the tag never changes and a client compares it after a re-read. An unknown
        version, another project's version of the same org, another tenant's version and a
        version of a soft-deleted project are all the same 404 `not_found` (the statement carries
        both the project and its liveness); a credential scoped to a sibling project is 403
        `project_scope_mismatch`.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringVersionId'
      responses:
        '200':
          description: 'One authoring version with its content and `ETag: "<content_hash>"`'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: >-
                The stored `content_hash` in quotes (`"sha256:<hex>"`); a version is immutable, so the
                tag never changes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringVersionDetailDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/versions/{v}/restore:
    post:
      operationId: restoreAuthoringVersion
      tags: [authoring]
      summary: Re-apply one stored version of the entity it describes (13.1.1-T3)
      description: >-
        13.1.1 §5 route 24 (`authoring:write`). Re-applies the stored snapshot of version `{v}` to
        the entity that version describes, as one new `restore` version, and answers the entity's
        new `version` (AC8). The route declares no `If-Match`: the version id already names the
        exact state to re-apply, so there is no tag to be stale against (AC19 applies to the
        entity routes 6/11/18). The version is resolved inside the caller's org and the URL's
        project, so another project's version, another tenant's version and a random id are one
        404 `not_found` (AC10), and a version whose entity row is gone is that same 404. A parent
        that is still soft-deleted is 422 `authoring_parent_invalid` with `details[].reason =
        `parent_deleted`. A snapshot that names a parent checklist item which is `retired` is 409
        `invalid_transition` and writes nothing, with the case-create guard's message "a retired
        checklist item takes no new content; restore it first". A snapshot of a
        feature node that would bring its sibling group past 1000 live nodes is 422
        `request_invalid` with `details[].path = /parent_id` and
        `details[].reason = children_limit_exceeded`, exactly as route 6 and the create refuse it,
        and nothing is written. No `If-Match` is bound, so no stale-tag `412` can arise: AC19 is
        routes 6, 11 and 18, this route declares no `If-Match` and never answers `412`. Missing
        `Idempotency-Key` is 400 `request_invalid`, and a replay answers the stored 200 with no
        second version or audit row (AC18). A lock timeout is 503 `unavailable` with
        `Retry-After`.
      x-permission: authoring:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: The entity's version after the restore
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthoringRestoreResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/import:
    post:
      operationId: importAuthoring
      tags: [authoring]
      summary: Import a feature tree from a CSV, XLSX or JSON file as one batch (13.1.1-T5)
      description: >-
        13.1.1 §5 route 25 (`authoring:write`). The request body is the file itself and the
        required `format` query names it: `text/csv` (also accepted as `text/csv; charset=utf-8`; UTF-8, RFC 4180, the header being the
        thirteen columns `kind,key,parent_key,item_key,node_kind,title,description,precondition,
        steps,priority,state,code,position`), `application/json` (the document of
        `contracts/schemas/authoring-import.v1.json`) or the XLSX media type (SpreadsheetML, read
        under the 06.3.1 archive caps). One flat row table — `kind` is `node`, `item` or `case` —
        carries the whole tree, and every format validates against that one schema. A body over
        5 MiB is 413 `payload_too_large` before a byte is parsed, a file over 5 000 data rows is
        413, an unknown or absent `format` is 422 `request_invalid` with `details[].path = /format`
        and reason `unsupported_format`, and a malformed `dry_run` is 422 with `/dry_run`. The
        whole file is validated before anything is written, and the refusals come in two classes.
        ROW-LEVEL entries carry `index` (the 1-based data row), a fixed member pointer (`/title`,
        `/steps`, `/code`, `/position`, …) and one of `unknown_parent`, `orphan_row`,
        `duplicate_key`, `code_conflict`, `value_invalid`, `steps_invalid` or `invalid_text`; a case
        `steps` document is checked against `authoring-steps.v1` first, so a document that is valid
        JSON but violates that contract is `index=N`, `path=/steps`, `reason=steps_invalid` in every
        format. FILE-LEVEL entries OMIT `index` and point at `/file` (the document is not
        well-formed, deeper than 32, carries a member name that is not valid UTF-16, or the upload
        is empty) or `/header` (a CSV header that is not exactly the thirteen contract columns) —
        both with `reason=unsupported_format`. A cell-level text refusal names its column (`/title`)
        with `reason=invalid_text`. At most 100 details are returned, and no cell value, step text,
        key text or catalog name is ever echoed. Any invalid row refuses the whole file and nothing is written;
        a valid file is applied in one transaction under one `batch_id`. A case row is matched by
        `code`: a code outside the project's `case_prefix` is `code_conflict`, a code that names a
        live case updates it, one that names a soft-deleted case restores it (`change_kind =
        restore`), and an empty code allocates a fresh number from one batch allocation per file; an
        explicit code number above 999 999 is `code_conflict` (a write-only caller cannot exhaust the
        project's counter). An empty `state` cell keeps an existing row's stored state (new rows start
        `draft` for a case and `active` for an item), a non-empty one must be a move the state routes
        allow (otherwise `value_invalid` at `/state`), a restored case is always `draft`, and a case
        under a retired item is refused. A
        `dry_run=true` answers the same report and writes nothing (no version row, no code
        allocation, no audit row); a file whose every row is unchanged writes nothing either and
        answers `batch_id: null`. `Idempotency-Key` is required: the same key with the same file
        replays the stored report without a second audit row, a different file under that key is 409
        `idempotency_conflict`. Another tenant's project is 404 `not_found`, a credential scoped to a
        sibling project 403 `project_scope_mismatch`, a lock timeout 503 `unavailable` with
        `Retry-After`.
      x-permission: authoring:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringFormat'
        - $ref: '#/components/parameters/AuthoringDryRun'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: './schemas/authoring-import.v1.json'
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The import report — one batch id, the per-outcome totals and one row per input row
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/authoring/export:
    get:
      operationId: exportAuthoring
      tags: [authoring]
      summary: Export a project's feature tree, or one node's subtree, as CSV, XLSX or JSON (13.1.1-T5)
      description: >-
        13.1.1 §5 route 25 (`authoring:read`, `viewer` included): the same flat row table the
        import reads, generated for this response and never persisted or cached (`Cache-Control:
        no-store`, `Content-Disposition: attachment` with a fixed ASCII name —
        `authoring-export.csv`, `.json` or `.xlsx`, never a project name or a posted value). Rows
        are emitted depth first: a node row, then that node's items in `(position, id)` order, each
        item's cases in `(code, id)` order, then the node's child nodes; keys are `n1…` for nodes,
        `i1…` for items and `c1…` for cases, numbered over the whole tree, so two exports of an
        unchanged tree are byte-identical and an export re-imports into an empty project as the same
        tree. `node_id` scopes the export to one node's subtree, `include` is a comma list of
        `nodes`, `items` and `cases` (default all three; an unknown token is 422 `request_invalid`
        with `details[].path = /include`), and only live rows are exported. A spreadsheet text cell
        that would start a formula (`=`, `+`, `-`, `@`, TAB, CR, LF) is written with one leading
        apostrophe; the import strips exactly that apostrophe back and stores literal text, so a
        round trip returns the authored value. At most 5 000 data rows and 5 MiB of emitted text —
        the import caps, so every export re-imports — are served: a larger scope is 413
        `payload_too_large` with one detail,
        `details[].path = /node_id` and `details[].reason = body_too_large`, never a truncated file. An unknown or soft-deleted `node_id`, or another tenant's project, is 404
        `not_found`; an absent or unknown `format` is 422 with `/format`, as on the import.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AuthoringFormat'
        - $ref: '#/components/parameters/AuthoringNodeIdFilter'
        - $ref: '#/components/parameters/AuthoringExportInclude'
      responses:
        '200':
          description: The export file in the requested format
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Content-Disposition:
              description: >-
                `attachment; filename="authoring-export.csv"` / `.json` / `.xlsx` — a fixed ASCII
                name, never a project or caller value.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: './schemas/authoring-import.v1.json'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /projects/{p}/ai-settings:
    get:
      operationId: getProjectAiSettings
      tags: [authoring]
      summary: The project's effective AI settings; ETag is the version number (13.2.1-T1)
      description: >-
        The guidance every manual test case and generated script is written from, as the project
        currently has it. A project that never saved answers the platform default template's
        document with `version_no` 0, `source` `default_template`, `settings_id` null and
        `ETag: "0"`; version 0 is never a stored row. After a save the answer is the head
        version's document with `source` `saved`. The document is the eight-field object of
        `contracts/schemas/ai-settings.v1.json`, the same shape the save accepts and the
        template catalogue serves. Another tenant's project and a project this caller cannot
        see are the same 404 `not_found`; a credential scoped to a sibling project of the same
        org is 403 `project_scope_mismatch`.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: >-
            The effective settings document with `ETag: "<version_no>"` (`"0"` before the first save)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: saveProjectAiSettings
      tags: [authoring]
      summary: Append one immutable AI settings version (13.2.1-T1)
      description: >-
        Appends exactly one `project_ai_settings` row and answers 201 with the new version; a
        body whose canonical document equals the effective head is a no-op that answers 200 with
        the existing version and `ETag`, and writes no row. `If-Match` is required and its tag is
        the version number in quotes, with `"0"` valid before the first save; a stale tag is 412
        `precondition_failed` with the current `version_no` in `error.details` and **nothing**
        written — the comparison happens before the no-op or insert decision. Under the
        per-project advisory lock, two concurrent saves cannot append the same `version_no`; a
        document equal to an older version is a new version, not a no-op, because the table is
        append-only and carries no unique constraint on `content_hash`. Every text member is
        NFC-normalised and end-trimmed before counting and hashing, lengths are Unicode code
        points (writing_style 250, coverage_strategy 1500, exclusion_rules 1500, step_detail 200
        are contractual; description 1000, environment_url 2048 and each criterion 250 are the
        shipped defaults), any text matching the shared secret shape is refused with reason
        `secret_value_detected`, and `environment_url` is validated by the same rule as an
        environment revision's `base_urls` (`invalid_url` when malformed, `secret_value_detected`
        when it carries credentials). `languages` is sorted ascending with no duplicates;
        `duplicate_value` names the repeated language. `template` is provenance only: the server
        checks that the pair exists and records it, never requiring the document to equal the
        template's content. `Idempotency-Key` is required; a replay with the same key and body
        replays the original answer and audits nothing, a different body is 409
        `idempotency_conflict`. Body over 32 KiB is 413.
      x-permission: project:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveAiSettingsRequest'
      responses:
        '200':
          description: The effective document already equals the request; the existing version is returned
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsView'
        '201':
          description: A new immutable version was appended
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/ai-settings/versions:
    get:
      operationId: listProjectAiSettingsVersions
      tags: [authoring]
      summary: Keyset page of the project's AI settings versions, newest first (13.2.1-T1)
      description: >-
        One page of version summaries in the fixed `version_no desc` order, at most
        200 items (`limit` defaults to 50). A summary carries `version_no`, `content_hash`, the
        template pair it was copied from, `author_membership_id`, `reason` and `created_at`;
        the document itself is read from `GET /v1/projects/{p}/ai-settings/versions/{version_no}`,
        so two versions can be diffed without paging full documents. A malformed `limit` or a
        cursor this endpoint did not issue is 422 `request_invalid` with `details[].path` naming
        the parameter. A project with no saved version answers an empty page, never the default
        template.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AiSettingsCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of AI settings version summaries
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsVersionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/ai-settings/versions/{version_no}:
    get:
      operationId: getProjectAiSettingsVersion
      tags: [authoring]
      summary: One AI settings version with its full document (13.2.1-T1)
      description: >-
        The version summary plus `settings`, the stored document exactly as the writer hashed
        it, so a pinned generation can be re-read byte-identically after later versions land. A
        version is immutable: the response's `ETag` is the row's `version_no` in quotes and never
        changes. An unknown version number, another project's version of the same org, another
        tenant's version and a version of a soft-deleted project are all the same 404 `not_found`.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/AiSettingsVersionNo'
      responses:
        '200':
          description: >-
            One AI settings version with its document and `ETag: "<version_no>"`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/ai-settings/templates:
    get:
      operationId: listProjectAiSettingsTemplates
      tags: [authoring]
      summary: The read-only platform AI settings templates (13.2.1-T1)
      description: >-
        The built-in, versioned templates in vi and en, at least one per locale and exactly one
        `is_default` per locale, served in one closed list with `next_cursor` null — the
        catalogue is small and paging it would only invite a caller to miss the default. A
        template is platform data: it has no write route and the app role holds `select` only,
        so a later revision is a new `version` row and can never change a saved settings row.
        Choosing a template pre-fills a draft; the save records `code` and `version` as
        provenance while the document travels in `settings`.
      x-permission: authoring:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The template catalogue
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSettingsTemplateListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-evidgate_session
      description: >-
        Opaque, server-side session reference (00 §9.1, 02.3.2-T1): a ≥128-bit random value stored only as
        HMAC-SHA256 + pepper version. Attributes: `HttpOnly; Secure; SameSite=Lax; Path=/`, no `Domain`
        (the `__Host-` prefix requires all four), `Max-Age` = the session's remaining absolute lifetime.
        Rotated on login and on privilege change. Every mutating request that authenticates with it MUST also
        send the antiforgery pair (`XSRF-TOKEN` cookie echoed in `X-XSRF-TOKEN`; 403 `csrf_failed` otherwise).
    bearerToken:
      type: http
      scheme: bearer
      description: 'CLI/agent bearer tokens — `ci_producer`, ingest, personal (00 §9.1; T38: never cookie-authenticated).'
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC signature on inbound GitHub webhook deliveries (00 §9.3).
  parameters:
    BindingId:
      name: b
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestTokenId:
      name: t
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderPath:
      name: provider
      in: path
      required: true
      description: >-
        Login provider, matched exactly in lower case against the providers the deployment registers
        (02.3.1 §5). `google` (02.3.1-T1.2) and `github` (02.3.1-T1.3) are the two V1 providers. A route
        value no provider is registered under answers 404 `not_found`; a registered provider without a
        client credential answers 503 `unavailable`, never 404.
      schema:
        type: string
        enum: [google, github]
    SessionId:
      name: s
      in: path
      required: true
      description: >-
        The `session.id` of a row the caller may revoke (02.3.2-T2.1). An id that is unknown, another account's,
        outside the org named in `X-Evidgate-Org`, or already revoked or expired answers the same 404
        `not_found`, so a caller learns nothing about other accounts' sessions. A value that is not a uuid — the
        documented `format` is what clients should send, and the literal `revoke-all` is one such value — answers
        that same 404 after the request was authenticated; the route never answers the binding 400, and never
        before the credential was judged.
      schema:
        type: string
        format: uuid
    OrgHeader:
      name: X-Evidgate-Org
      in: header
      required: false
      description: >-
        Names the org in which the caller claims `membership:write` (02.3.2-T2.1). Absent, only the session's
        owner may be revoked; present, the caller must hold an active membership in this org with
        `membership:write` AND the target session's user an active membership in the same org, otherwise the
        answer is the same 404 an unknown id gets. The org is never taken from the path or the body of a
        pre-tenant route.
      schema:
        type: string
        format: uuid
    HealingProjectQuery:
      name: project_id
      in: query
      required: false
      description: >-
        The project whose switch override applies (08.6.3-T1). Absent answers the org-level resolution; present,
        the project must be inside the credential's and the request's scope (403 `project_scope_mismatch`) and
        exist in the caller's org (404 otherwise, also for another tenant's project).
      schema:
        type: string
        format: uuid
    LoginReturnUrl:
      name: returnUrl
      in: query
      required: false
      description: >-
        Post-login destination, allowlisted by `ReturnUrlPolicy` (02.3.1 §8): a same-origin path with
        exactly one leading `/`, no backslash or control character, at most 512 characters, re-checked
        through up to four percent-decoding passes. Any other value — `//host`, `/\host`, a scheme — is
        replaced by `/` and is not an error. The value travels only inside the protected pending-login
        cookie, never in a URL to the provider.
      schema:
        type: string
        maxLength: 512
    OidcCode:
      name: code
      in: query
      required: false
      description: >-
        Authorization code of the provider redirect. Required in practice: a missing, empty or longer
        than 2048-character value answers 401 `token_invalid`, the same typed refusal as a mismatch, so
        the route is no oracle for which check failed.
      schema:
        type: string
        maxLength: 2048
    OidcState:
      name: state
      in: query
      required: false
      description: >-
        The one-time `state` `start` generated and put in the pending-login cookie. Compared in constant
        time; a missing, mismatched or already consumed value answers 401 `token_invalid`.
      schema:
        type: string
    OidcError:
      name: error
      in: query
      required: false
      description: >-
        The provider's own error code when it refused the request (`access_denied` and the like). Its
        presence alone answers 401 `token_invalid`, and its value is never echoed — it can carry the code
        or a description.
      schema:
        type: string
    AuditExportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
    AuditActorType:
      name: actor_type
      in: query
      required: false
      schema:
        type: string
        enum: [user, ci_producer, agent, platform_operator, system]
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    AuditObjectType:
      name: object_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    SecurityEventProjectFilter:
      name: project_id
      in: query
      required: false
      description: >-
        Exact `project_id` (11.5.1 AC3). An id that is unknown or belongs to another org answers an
        empty page, not 404; a present but non-uuid value is 422 `request_invalid` with
        `details[].path` = `project_id`.
      schema:
        type: string
        format: uuid
    SecurityEventType:
      name: type
      in: query
      required: false
      description: >-
        Exact `type` from the closed V1 set (`injection_attempt` arrives in V2, 11.4.1-T2); any
        other value is 422 `request_invalid` with `details[].path` = `type`.
      schema:
        type: string
        enum:
          [auth_failure, cross_tenant_probe, secret_scanner_alert, kill_switch_used, support_access]
    SecurityEventSeverity:
      name: severity
      in: query
      required: false
      description: >-
        Exact `severity` from the closed set; any other value is 422 `request_invalid` with
        `details[].path` = `severity`.
      schema:
        type: string
        enum: [info, warning, critical]
    SecurityEventFrom:
      name: from
      in: query
      required: false
      description: >-
        Inclusive lower bound on `created_at` (ISO 8601); a malformed value is 422 `request_invalid`
        with `details[].path` = `from`.
      schema:
        type: string
        format: date-time
    SecurityEventTo:
      name: to
      in: query
      required: false
      description: >-
        Exclusive upper bound on `created_at` (ISO 8601); a malformed value is 422 `request_invalid`
        with `details[].path` = `to`.
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(created_at, id)` (00 §9.1).
      schema:
        type: string
    PolicyRevisionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(revision_no, id)` (07.1.1-T3, 00 §9.1).
      schema:
        type: string
    AiSettingsCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `version_no desc` (13.2.1-T1, 00 §9.1).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    RunRefName:
      name: ref_name
      in: query
      required: false
      description: >-
        Exact `ref_name` of the run's recorded identity (05.2.2 §5, AC6): the
        branch of `refs/heads/<n>`, the tag of `refs/tags/<n>`, or GitHub's
        `<N>/merge` for a pull request. 1..255 code points with no control
        character; a present but invalid value is 422 `request_invalid` with
        `details[].path` = `ref_name`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RunPrNumber:
      name: pr_number
      in: query
      required: false
      description: >-
        Exact `pr_number` of the run's recorded identity (05.2.2 §5, AC6); an
        integer ≥ 1, a present but invalid value is 422 `request_invalid` with
        `details[].path` = `pr_number`.
      schema:
        type: integer
        format: int32
        minimum: 1
    RunHeadSha:
      name: head_sha
      in: query
      required: false
      description: >-
        Exact `head_sha` of the run's recorded identity (05.2.2 §5, AC6):
        GitHub's SHA-1 or SHA-256 commit id, lowercase. A present but invalid
        value is 422 `request_invalid` with `details[].path` = `head_sha`.
      schema:
        type: string
        pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
    RunTriggerEvent:
      name: trigger_event
      in: query
      required: false
      description: >-
        Exact `trigger_event` of the run's recorded identity (05.2.2 §5, AC6).
        A present but invalid value is 422 `request_invalid` with
        `details[].path` = `trigger_event`.
      schema:
        type: string
        enum: [push, pull_request, schedule, manual, dispatch]
    RunIsFork:
      name: is_fork
      in: query
      required: false
      description: >-
        Exact `is_fork` of the run's recorded identity (05.2.2 §5, AC6); the
        literal `true` or `false`. A present but invalid value is 422
        `request_invalid` with `details[].path` = `is_fork`.
      schema:
        type: boolean
    RunState:
      name: state
      in: query
      required: false
      description: >-
        Exact `run.state` (00 §8.1) — one of the seven run states (F43, S143).
        AND-combined with every other present filter. A present but
        out-of-vocabulary value is 422 `request_invalid` with `details[].path` =
        `state`; the filter is not index-served, so it scans the project's rows
        (05.2.2 note).
      schema:
        type: string
        enum: [created, queued, running, collecting, complete, incomplete, canceled]
    RunDecision:
      name: decision
      in: query
      required: false
      description: >-
        The run's evaluation decision (F43, S143). Only `pending` is accepted
        today, and that value stores nothing: no `evaluation` row exists until
        07.2.2 persists one, so there is no stored decision to narrow the page
        with and `pending` matches every run in it, while the
        `RunSummary.decision` member stays `null` in every item until the
        evaluator stores one (07.2.2 stores it, 07.5.2 serves the read). Any
        other value — including `PASS`, `FAIL` and `INCONCLUSIVE` — is 422
        `request_invalid` (`details[].path` = `decision`, reason
        `invalid_value`) rather than an empty page. Receiver: 07.2.2 (stored
        decision) with 07.5.2 (the read), which widens this enum.
      schema:
        type: string
        enum: [pending]
    RunRerunScope:
      name: rerun_scope
      in: query
      required: false
      description: >-
        Exact `run.rerun_scope` (0031; F43, S143): `full` or `failed_subset`. A
        plain run stores `null` and never matches. A present but invalid value
        is 422 `request_invalid` (`details[].path` = `rerun_scope`).
      schema:
        type: string
        enum: [full, failed_subset]
    RunParentRunId:
      name: parent_run_id
      in: query
      required: false
      description: >-
        Exact `run.parent_run_id` (0031; F43, S143) — the run a rerun was
        created from. A present but non-UUID value is 422 `request_invalid`
        (`details[].path` = `parent_run_id`).
      schema:
        type: string
        format: uuid
    RunAttemptCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from `next_cursor` of `GET /v1/runs/{r}/attempts`;
        ordering `(execution_key, attempt_no)` (00 §9.1, F52/S143). A value this
        endpoint did not issue is 422 `request_invalid`.
      schema:
        type: string
    RunEvidenceRevisionCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from `next_cursor` of
        `GET /v1/runs/{run_id}/evidence-revisions`; ordering `revision_no`
        descending (00 §9.1; a run's `revision_no` is unique, so the key is the
        revision number alone). A value this endpoint did not issue is 422
        `request_invalid`.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied, ≤ 128 chars, unique per `(org_id, project_id, operation)` ≥ 24 h (00 §7/§9.1).
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag for optimistic concurrency; stale → 412 (00 §9.1).
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: >-
        Optional optimistic-concurrency check: the caller's cached head revision
        id, quoted; stale or malformed → 412 with the current head revision id in
        `error.details`; absent means no check (00 §9.1, 07.1.1-T3).
      schema:
        type: string
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        Required whenever the caller is cookie-authenticated (00 §9.1, T38);
        bearer-only callers omit it. 403 `csrf_failed` on mismatch.
      schema:
        type: string
    OrgId:
      name: o
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: m
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: p
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceRevisionRunId:
      name: run_id
      in: path
      required: true
      description: >-
        The run's id, spelled out where the route's decision names `run_id`;
        the older run routes take the same id as `{r}` (`RunId`).
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: a
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentSlug:
      name: e
      in: path
      required: true
      schema:
        type: string
    SupportGrantId:
      name: g
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteId:
      name: s
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, missing, archived]
    CaseFrameworkFilter:
      name: framework
      in: query
      required: false
      schema:
        type: string
    CaseId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
      description: When true, nothing is written; the response previews the revision.
    AgainstRevision:
      name: against
      in: query
      required: true
      schema:
        type: string
        format: uuid
    SuiteRevisionId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: d
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: i
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: j
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaiverId:
      name: w
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuarantineEntryId:
      name: q
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthoringNodeId:
      name: n
      in: path
      required: true
      description: Feature-tree node id (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringChecklistItemId:
      name: i
      in: path
      required: true
      description: Checklist item id (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringManualCaseId:
      name: m
      in: path
      required: true
      description: Manual test case id (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringParentIdFilter:
      name: parent_id
      in: query
      required: false
      description: >-
        List the live children of this node instead of the roots (13.1.1 §5 route 1). An
        unknown, soft-deleted or other-project id is 404 `not_found`.
      schema:
        type: string
        format: uuid
    AuthoringNodeIdFilter:
      name: node_id
      in: query
      required: false
      description: Address one node (route 1) or narrow a list to this node's entries (13.1.1).
      schema:
        type: string
        format: uuid
    AuthoringItemIdFilter:
      name: item_id
      in: query
      required: false
      description: Narrow the manual-case list to one checklist item (13.1.1 §5 route 12).
      schema:
        type: string
        format: uuid
    AuthoringInclude:
      name: include
      in: query
      required: false
      description: >-
        Comma-separated tokens. `path` adds `path` (the addressed node's ancestors, root first);
        `counts` is always present and needs no token. Any other token is 422 `request_invalid`
        with `details[].path = /include`.
      schema:
        type: string
        maxLength: 64
    AuthoringFormat:
      name: format
      in: query
      required: true
      description: >-
        The file format of route 25: `csv`, `json` or `xlsx`. An absent or unknown value is 422
        `request_invalid` with `details[].path = /format` and reason `unsupported_format`
        (13.1.1-T5).
      schema:
        type: string
        enum: [csv, json, xlsx]
    AuthoringDryRun:
      name: dry_run
      in: query
      required: false
      description: >-
        `true` answers the import report without writing anything — no version row, no code
        allocation, no audit row (13.1.1 AC13).
      schema:
        type: boolean
        default: false
    AuthoringExportInclude:
      name: include
      in: query
      required: false
      description: >-
        Comma-separated tokens `nodes`, `items`, `cases`; absent or empty means all three. Any other
        token is 422 `request_invalid` with `details[].path = /include` (13.1.1 §5 route 25).
      schema:
        type: string
        maxLength: 64
    AuthoringItemStateFilter:
      name: state
      in: query
      required: false
      description: Checklist item state filter (13.1.1 §6).
      schema:
        type: string
        enum: [draft, active, retired]
    AuthoringCaseStateFilter:
      name: state
      in: query
      required: false
      description: Manual test case state filter (13.1.1 §6).
      schema:
        type: string
        enum: [draft, approved, retired]
    AuthoringPriorityFilter:
      name: priority
      in: query
      required: false
      description: Priority filter shared by checklist items and manual test cases (13.1.1).
      schema:
        type: string
        enum: [critical, high, medium, low]
    AuthoringCoveredFilter:
      name: covered
      in: query
      required: false
      description: >-
        Authoring coverage filter of route 12: `false` keeps the manual cases no live
        `manual_case_link` reaches (`linked_live_count = 0`), `true` their complement. "Live" means
        the linked catalog case is not `archived`. This is not 03.1.4's execution coverage. Anything
        but `true`/`false` is 422 `request_invalid` with `details[].path = /covered` and reason
        `value_invalid`.
      schema:
        type: boolean
    AuthoringCatalogCaseId:
      name: c
      in: path
      required: true
      description: Catalog test case id of the link (13.1.1 §5 route 21).
      schema:
        type: string
        format: uuid
    AuthoringQuery:
      name: q
      in: query
      required: false
      description: >-
        Case-insensitive title substring, at most 200 code points; `%`, `_` and `\` are escaped
        so the term is matched literally (13.1.1 §5 route 12, 13.1.1-T2).
      schema:
        type: string
        maxLength: 200
    AuthoringCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from `next_cursor`; the order is the one the route declares (`(position,
        id)` for tree and checklist pages, `(code, id)` for manual cases, 00 §9.1).
      schema:
        type: string
    AuthoringVersionId:
      name: v
      in: path
      required: true
      description: The `authoring_version` id (13.1.1 §5 routes 23 and 24).
      schema:
        type: string
        format: uuid
    AuthoringVersionEntityKindFilter:
      name: entity_kind
      in: query
      required: false
      description: >-
        Which entity the versions describe (13.1.1 §5 route 22): `feature_node`,
        `checklist_item` or `manual_test_case`. Any other value is 422 `request_invalid` with
        `details[].path = /entity_kind` and `reason = value_invalid`. Required whenever
        `entity_id` is sent: the entity key index starts `(org_id, project_id, entity_kind, entity_id, version_no)`,
        so an id on its own is 422 (see `entity_id`). `entity_kind` alone is valid.
      schema:
        type: string
        enum: [feature_node, checklist_item, manual_test_case]
    AuthoringVersionEntityIdFilter:
      name: entity_id
      in: query
      required: false
      description: >-
        The entity's id (13.1.1 §5 route 22); combined with `entity_kind` it is one entity's
        history. Sending it without `entity_kind` is 422 `request_invalid` with
        `details[].path = /entity_kind` and `reason = required_with_entity_id`. A malformed uuid
        is 422 `request_invalid` with `details[].path = /entity_id`.
      schema:
        type: string
        format: uuid
    AuthoringVersionSourceFilter:
      name: source
      in: query
      required: false
      description: >-
        Where the change came from (13.1.1 §5 route 22): `manual`, `ai` or `import`. Any other
        value is 422 `request_invalid` with `details[].path = /source` and
        `reason = value_invalid`.
      schema:
        type: string
        enum: [manual, ai, import]
    AuthoringVersionActorFilter:
      name: actor
      in: query
      required: false
      description: >-
        The authoring membership that wrote the change (13.1.1 §5 route 22). A malformed uuid is
        422 `request_invalid` with `details[].path = /actor`.
      schema:
        type: string
        format: uuid
    AuthoringVersionFrom:
      name: from
      in: query
      required: false
      description: >-
        Inclusive lower bound of the window (13.1.1 §5 route 22): an RFC 3339 instant with an
        explicit offset (`Z` or `±hh:mm`), normalised to UTC before it is bound (the stored
        instants are UTC). A bare date, a local time without an offset or
        `from` later than `to` is 422 `request_invalid` — `details[].path = /from` with
        `reason = value_invalid` or `invalid_range`.
      schema:
        type: string
        format: date-time
        maxLength: 40
    AuthoringVersionTo:
      name: to
      in: query
      required: false
      description: >-
        Exclusive upper bound of the window (13.1.1 §5 route 22), the same RFC 3339 rule as
        `from` and normalised to UTC the same way; a malformed value is 422 `request_invalid`
        with `details[].path = /to`.
      schema:
        type: string
        format: date-time
        maxLength: 40
    AuthoringVersionCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque cursor from `next_cursor` of the version timeline (13.1.1 §5 route 22); the keyset
        is the `(created_at, id)` pair of the page's last row, ordered
        `(created_at desc, id desc)`. A value this endpoint did not issue is 422
        `request_invalid` with `details[].path = /cursor` and `reason = malformed`.
      schema:
        type: string
    AiSettingsVersionNo:
      name: version_no
      in: path
      required: true
      description: >-
        A saved settings version number, 1 or greater. Version 0 is the virtual default-template
        state and is answered 404, never a row.
      schema:
        type: integer
        minimum: 1
    IfMatchOrder:
      name: If-Match
      in: header
      required: true
      description: >-
        Order tag of the sibling set, `"order:sha256:<hex>"` — `AuthoringHashes.OrderHash` over
        the sorted `(id, version)` pairs of the parent's live siblings (13.1.1-T2) — never a
        row `version`. Absent or malformed is 422 `request_invalid` with `details[].path =
        /If-Match` (`required` / `invalid`); a stale tag is 412 `precondition_failed` with the
        current tag in `error.details`, and nothing is written.
      schema:
        type: string
  headers:
    XRequestId:
      description: Server request id; echoed in `error.request_id` (00 §9.1/§9.2).
      schema:
        type: string
    RetryAfter:
      description: Seconds (or HTTP-date) to wait before retrying (00 §9.2).
      schema:
        type: string
    ETag:
      description: Endpoint-specific quoted validator — row version, revision id or number, content or revision hash; send it back in `If-Match` (00 §9.1).
      schema:
        type: string
    NoStore:
      description: >-
        `Cache-Control: no-store` — an answer that sets a cookie or carries a secret is never reusable
        (02.3.1 §5: the pending-login and session cookies of both login routes; the invite responses
        whose body carries `invite_token`).
      schema:
        type: string
        enum: [no-store]
  responses:
    BadRequest:
      description: >-
        400 request_invalid — a malformed or missing request header, e.g. the `Idempotency-Key`
        every mutating authoring route requires (00 §9.1)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: >-
        401 (00 §9.2). The `code` distinguishes the credential's state (02.3.2-T1, D2): `unauthenticated`
        (no credential, or a cookie that names no session), `session_expired` (past the idle or the absolute
        deadline — the client signs in again), `session_revoked` (the session was ended, rotated away or
        revoked; the client signs in again), and the bearer family (`token_invalid`, `token_expired`, …).
        A refused session answers its own code here, before any handler runs.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: >-
        403 forbidden — includes token-scope mismatch, `csrf_failed` (a cookie-authenticated mutation whose
        `X-XSRF-TOKEN` is missing or does not match the pair bound to that session; 00 §9.1/§9.2,
        02.3.2-T1) and `account_disabled` (a live session whose user is no longer active).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 not found — also for other-tenant ids (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: '409 conflict — e.g. `idempotency_conflict`, `run_closed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: 412 precondition failed — stale ETag; current revision id in `error.details` (00 §9.1/§9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: 413 too large (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 422 schema/manifest invalid — per-item causes in `error.details[]` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '429 — `rate_limited` (bursts) or `quota_exceeded` (tenant/project limit); always `Retry-After` (00 §9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 503 unavailable — always `Retry-After` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: 00 §9.2 error envelope; `details` never contains secrets.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  index:
                    type: integer
                  path:
                    type: string
                  reason:
                    type: string
    CursorList:
      type: object
      description: 00 §9.1 cursor list envelope; `next_cursor` is null when the page is last.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: [string, 'null']
    RunStateDto:
      type: object
      required:
        [
          run_id,
          state,
          current_evidence_revision_id,
          version,
          purpose,
          ref,
          unverified_ref,
          manifest_hash,
          suite_revision_id,
          policy_revision_id,
          environment,
          shard_count,
          declared_producers,
        ]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        current_evidence_revision_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The evidence revision the run's current verdict was frozen from;
            null while none exists (`run.current_evidence_revision_id`, 05.3.1;
            05.3.2 owns the write side).
        version:
          type: integer
          minimum: 0
        purpose:
          type: string
          enum: [regular, replay]
        ref:
          $ref: '#/components/schemas/RunRef'
        unverified_ref:
          type: boolean
          description: >-
            True when at least one stored identity value came from the request
            body instead of a verified CI claim (05.2.2-T1); false for a
            verified CI caller and for a run with no identity at all.
        manifest_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            The pinned manifest's `manifest_hash` (F44, S143), joined from
            `manifest` through the run's `manifest_id`. Not null for any stored
            run: `run.manifest_id` is not null and its FK targets `manifest`.
        suite_revision_id:
          type: string
          format: uuid
          description: >-
            The suite revision the run locked at creation — the run's own
            `suite_revision_id` column (0031), not a re-read of the manifest.
        policy_revision_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The policy revision the run pinned; `null` for a run created before
            a revision was activated (`run.policy_revision_id` is nullable,
            0031).
        environment:
          $ref: '#/components/schemas/RunEnvironmentRef'
        shard_count:
          type: integer
          minimum: 0
          description: >-
            How many producer slots the run registered — one per manifest shard
            (`count(*)` of the run's `producer_slot` rows, 0029/0031).
        declared_producers:
          type: array
          description: >-
            The run's producer slot ids in `shard_index` order, the values the
            manifest's shards declare (`producer_slot.producer_id`, written as
            `shard-<n>` at run creation, 0029). Empty only for a run whose slots
            were never registered.
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
    RunSummary:
      type: object
      description: >-
        One row of `GET /v1/projects/{p}/runs` (05.2.2 §5). Since 05.2.2-T2 the
        list serves the run's state, `created_at`, the recorded identity `ref`
        and `unverified_ref`; since F43 (S143) it also serves `completeness`
        (from the run's current evidence revision), `parent_run_id` and
        `rerun_scope`, while `decision`, `rerun_label` and `reprocess_label`
        stay `null` until 07.5.2 and 05.5.1/05.5.2 serve them — every value of
        the row comes from a stored column, never from a placeholder.
      required:
        [run_id, state, created_at, ref, unverified_ref, completeness, parent_run_id, rerun_scope]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        created_at:
          type: string
          format: date-time
          description: Creation, UTC — the primary sort key of the list (AC6).
        ref:
          $ref: '#/components/schemas/RunRef'
        unverified_ref:
          type: boolean
          description: >-
            True when at least one stored identity value came from the request
            body instead of a verified CI claim (05.2.2-T1); false for a
            verified CI caller and for a run with no identity at all.
        completeness:
          type: [string, 'null']
          enum: [complete, incomplete, null]
          description: >-
            The evidence completeness of the run's current evidence revision —
            `evidence_revision.completeness` of `run.current_evidence_revision_id`
            (0049; the `EvidenceBadge` verdict, 00 §8.5). `null` while the run
            has no evidence revision yet, i.e. still pending: it is never
            reported as `incomplete` without a stored row.
        parent_run_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The run this one was created from by a rerun (`run.parent_run_id`,
            0031); `null` for an original run. Served since F43 (S143).
        rerun_scope:
          type: [string, 'null']
          enum: [full, failed_subset, null]
          description: >-
            The rerun scope the run was created with (`run.rerun_scope`, 0031);
            `null` for an original run. The filterable form of the rerun label —
            `rerun_label` itself has no stored column yet.
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7. Every item is `null` today — no `evaluation` row exists until 07.2.2 stores one (07.5.2 serves the read).
        rerun_label:
          type: [string, 'null']
          description: >-
            Always `null` until 05.5.1/05.5.2 serve a label; the column-backed
            `parent_run_id` and `rerun_scope` are what a caller can rely on.
        reprocess_label:
          type: [string, 'null']
          description: Always `null` until the reprocess path of 04/05.5.2 serves a label.
    RunPage:
      type: object
      description: 00 §9.1 cursor page of `RunSummary`, keyset-ordered on `(created_at, id)` ascending (05.2.2-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunSummary' }
        next_cursor: { type: [string, 'null'] }
    RunEnvironmentRef:
      type: object
      additionalProperties: false
      description: >-
        The run's pinned environment revision (05.1.2), read by
        `GET /v1/runs/{r}` since F44 (S143): `environment_revision` joined
        through `run.environment_revision_id` (not null, FK
        `run_environment_revision_fk`, 0031) plus the environment's own key. No
        `secret_refs`, no `base_urls`, no `dependency_versions`: the run detail
        names the revision, it does not re-publish its content
        (`GET /v1/environment-revisions/{id}` does that).
      required: [revision_id, environment_id, environment_key, revision_no, revision_hash]
      properties:
        revision_id:
          type: string
          format: uuid
          description: '`environment_revision.id`.'
        environment_id:
          type: string
          format: uuid
          description: '`environment_revision.environment_id`.'
        environment_key:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'
          description: '`environment.environment_key` (0024).'
        revision_no:
          type: integer
          minimum: 1
          description: '`environment_revision.revision_no`, 1-based per environment.'
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: '`environment_revision.revision_hash` — the content hash pinned by the run.'
    RunAttemptSummary:
      type: object
      additionalProperties: false
      description: >-
        One row of `GET /v1/runs/{r}/attempts` (F52, S143), read from
        `case_attempt` (0032). The raw/normalised pair is kept verbatim: the
        producer's `raw_status` and the server's `normalized_status` are shown
        separately, and `blocked` is never reported as `passed` (00 §8.5, AC3).
        The retry chain is `(execution_key, attempt_no)` — there is no
        `retry_of` column — so `attempt_no` >= 2 is a retry of the previous
        attempt of the same `execution_key`.
      required:
        [
          attempt_id,
          execution_key,
          case_id,
          attempt_no,
          raw_status,
          normalized_status,
          started_at,
          finished_at,
          duration_ms,
          artifact_count,
          healing_candidate,
        ]
      properties:
        attempt_id:
          type: string
          format: uuid
          description: '`case_attempt.id` — the stable key of one attempt row.'
        execution_key:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: '`case_attempt.execution_key` — the planned execution (case revision + variant + target env).'
        case_id:
          type: string
          format: uuid
          description: '`case_attempt.case_id`.'
        attempt_no:
          type: integer
          minimum: 1
          description: >-
            `case_attempt.attempt_no`, 1-based within the execution; 2 or more
            is a retry of the previous attempt of the same `execution_key`.
        raw_status:
          type: string
          minLength: 0
          maxLength: 64
          description: '`case_attempt.raw_status` exactly as the producer sent it.'
        normalized_status:
          type: string
          enum: [passed, failed, skipped, timed_out, error, blocked]
          description: '`case_attempt.normalized_status` (00 §8.5 vocabulary).'
        started_at:
          type: [string, 'null']
          format: date-time
          description: '`case_attempt.started_at`; null when the producer sent no start.'
        finished_at:
          type: [string, 'null']
          format: date-time
          description: '`case_attempt.finished_at`; null when the producer sent no finish.'
        duration_ms:
          type: [integer, 'null']
          minimum: 0
          description: '`case_attempt.duration_ms`; null when unrecorded.'
        artifact_count:
          type: integer
          minimum: 0
          description: >-
            How many artifacts this attempt has: `count(*)` of the run's
            `artifact` rows matching `(execution_key, attempt_no)` in state
            `ready` (0028). A rejected, deleted or still-staged artifact is not
            counted.
        healing_candidate:
          oneOf:
            - $ref: '#/components/schemas/RunHealingCandidate'
            - type: 'null'
          description: >-
            The healing candidate attached to this attempt, or `null` — which is
            every row today: no candidate table exists until the 08.3.1
            candidate model (shadow rows with 08.3.3). Never a fabricated
            marker.
    RunHealingCandidate:
      type: object
      additionalProperties: false
      description: >-
        The candidate a healed attempt points at (08.3.1). Shape reserved by
        F52/S143 so the attempts read does not need a second change when the
        candidate model lands; it is always `null` on the wire today.
      required: [candidate_hash, mode]
      properties:
        candidate_hash:
          type: string
          minLength: 1
          maxLength: 200
          description: "The candidate's `sha256:` hash (00 §7, RFC 8785)."
        mode:
          type: string
          enum: [shadow, official]
          description: >-
            `shadow` for a V1 shadow-only candidate (08.3.3), `official` once an
            approval bound it (08.6.1).
    RunAttemptPage:
      type: object
      description: >-
        00 §9.1 cursor page of `RunAttemptSummary`, keyset-ordered on
        `(execution_key, attempt_no)` ascending (F52, S143).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunAttemptSummary' }
        next_cursor: { type: [string, 'null'] }
    EvidenceRevision:
      type: object
      additionalProperties: false
      description: >-
        One row of `GET /v1/runs/{r}/evidence-revisions`, read from
        `evidence_revision` (0049). The table is append-only — a late-evidence
        re-freeze inserts the next `revision_no` instead of rewriting a row — so
        every item is the verdict that revision was frozen with (00 §8.1), and
        `missing[]` is shown verbatim rather than summarised.
      required: [revision_no, created_at, completeness, missing, evaluation_id]
      properties:
        revision_no:
          type: integer
          minimum: 1
          description: >-
            `evidence_revision.revision_no`, 1-based and gap-free per run;
            highest is the newest revision.
        created_at:
          type: string
          format: date-time
          description: '`evidence_revision.created_at`, when that revision was frozen.'
        completeness:
          type: string
          enum: [complete, incomplete]
          description: >-
            `evidence_revision.completeness` (00 §8.5). `incomplete` at the
            collection deadline is never a PASS (00 §8.6).
        missing:
          type: array
          description: >-
            `evidence_revision.missing` verbatim: the closed 00 §8.5 reason list
            (`missing_shard`, `count_mismatch`, `artifact_missing`,
            `build_mismatch`, `unknown_status`, `setup_error`, `stale_epoch`,
            `missing_result`). Empty exactly when `completeness` is `complete`.
          items:
            type: string
            enum:
              - missing_shard
              - count_mismatch
              - artifact_missing
              - build_mismatch
              - unknown_status
              - setup_error
              - stale_epoch
              - missing_result
        evaluation_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The `evaluation.id` (0059) evaluated from this revision with `mode`
            = `live`, or `null` while the revision has no stored live
            evaluation. A `shadow` evaluation is never served: it is not the
            verdict the run reports.
    EvidenceRevisionPage:
      type: object
      description: >-
        00 §9.1 cursor page of `EvidenceRevision`, keyset-ordered on
        `revision_no` descending (newest revision first).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvidenceRevision' }
        next_cursor: { type: [string, 'null'] }
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [manifest_id]
      properties:
        manifest_id:
          type: string
          format: uuid
        release:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Optional release name; at M1 it resolves to 422
            `release_unresolvable` (05.6.1 owns the write-bind).
        purpose:
          type: string
          enum: [regular, replay]
          default: regular
          description: >-
            Optional run purpose; absent means `regular`. `replay` is refused
            422 `replay_grant_invalid` until 08.4.3 issues grants (05.2.1-T5);
            with `regular` it never changes the 201 shape.
        replay_grant_id:
          type: string
          format: uuid
          description: >-
            Optional grant id issued by 08.4.3; meaningful only with
            `purpose: replay`, where it must name a valid, unexpired grant
            bound to this project. With `regular` (or an absent `purpose`) it is
            422 `request_invalid` (`details[]` reason `invalid_value`, path
            `/replay_grant_id`; 05.2.1-T5).
        components:
          type: object
          description: Optional build identifiers for the run's components.
        ref:
          $ref: '#/components/schemas/RunRefRequest'
    RunCreated:
      type: object
      required: [run_id, state, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued]
        unverified_ref:
          type: boolean
          description: >-
            True when the stored identity block carries at least one
            body-supplied value (05.2.2-T1); false for a verified CI caller and
            for a run created without an identity.
    RunRefRequest:
      type: object
      additionalProperties: false
      description: >-
        Optional run identity supplied by the caller (00 §7/§8.1, 05.2.2-T1).
        A verified CI caller's OIDC claims always win and a conflicting member
        is ignored, never rejected (AC3); every value stored from here marks
        the run `unverified_ref = true`. An unknown member is 422
        `request_invalid` (`details[].path` `/ref/<member>`, reason
        `additional_properties`), like every other shape failure of this body.
      properties:
        kind:
          type: string
          enum: [branch, tag, pull_request]
          description: >-
            `pull_request` requires `pr_number`, checked on the values after
            the verified-claim merge → 422 `request_invalid`.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Branch or tag name; for a PR the GITHUB_REF_NAME form `<N>/merge`.
        pr_number:
          type: integer
          minimum: 1
        head_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
          description: 40 hex for a SHA-1 repo, 64 for a SHA-256 repo.
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        trigger_event:
          type: string
          enum: [push, pull_request, schedule, manual, dispatch]
        is_fork:
          type: boolean
          default: false
          description: >-
            Only a body value can set this: a verified CI caller is never a
            fork (02.4.1 refuses a fork exchange 403).
    RunRef:
      type: object
      additionalProperties: false
      description: >-
        The run's stored identity block (00 §7/§8.1, 05.2.2-T1). Every member is
        present, `null` where unknown; an existing run created before 05.2.2 has
        all members null and `is_fork` false. A verified `ci_producer` caller's
        `ref`/`sha` claims win over the request body; the remaining values are
        body-supplied and the run carries `unverified_ref = true`. `head_sha` is
        only ever the verified `sha` claim of a `branch` or `tag` ref: for a
        `pull_request` ref that claim is GitHub's test-merge commit and is not
        stored.
      required: [kind, name, pr_number, head_sha, base_sha, trigger_event, is_fork]
      properties:
        kind:
          type: [string, 'null']
          enum: [branch, tag, pull_request, null]
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        pr_number:
          type: [integer, 'null']
          minimum: 1
        head_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        base_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        trigger_event:
          type: [string, 'null']
          enum: [push, pull_request, schedule, manual, dispatch, null]
        is_fork:
          type: boolean
    ReleaseDecision:
      type: object
      description: >-
        Release decision body of `GET /releases/{id}/decision` (00 §8.5/§9.3). Not reconciled
        with the run body `Decision`; the release story owns its shape.
      properties:
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        evaluation_revision:
          type: string
        reasons:
          type: array
          items:
            type: string
    Decision:
      type: object
      description: >-
        Body of `GET /runs/{r}/decision`: one shape for an evaluated and a pending run. Every
        member is required; a pending run has `status: pending` and null in every other member
        except `url`. Evaluated members are copied from one immutable live `evaluation` row.
      required:
        - status
        - decision
        - evaluation_id
        - evidence_revision
        - completeness
        - outcome
        - missing
        - reasons
        - policy_hash
        - manifest_hash
        - evaluator_version
        - mode
        - url
      properties:
        status:
          type: string
          enum: [pending, evaluated]
          description: '`pending` when the run has no live evaluation row.'
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending, never a default; UPPER per 00 §7
        evaluation_id:
          type: [string, 'null']
          format: uuid
        evidence_revision:
          type: [integer, 'null']
          description: '`revision_no` of the frozen evidence revision that was evaluated.'
        completeness:
          type: [string, 'null']
          enum: [complete, incomplete, null]
        outcome:
          type: [string, 'null']
          enum: [all_passed, has_failures, no_results, null]
        missing:
          type: [array, 'null']
          description: Null while pending, never `[]`; closed eight-code list.
          items:
            type: string
            enum:
              - missing_shard
              - count_mismatch
              - artifact_missing
              - build_mismatch
              - unknown_status
              - setup_error
              - stale_epoch
              - missing_result
        reasons:
          type: [array, 'null']
          items:
            type: string
        policy_hash:
          type: [string, 'null']
        manifest_hash:
          type: [string, 'null']
        evaluator_version:
          type: [string, 'null']
        mode:
          type: [string, 'null']
          enum: [live, null]
          description: Only `live` rows are served; shadow rows never appear here.
        url:
          type: [string, 'null']
          format: uri
          description: Run page URL; null when the deployment has no public base URL.
      allOf:
        - if:
            properties:
              status:
                const: pending
          then:
            properties:
              decision: { type: 'null' }
              evaluation_id: { type: 'null' }
              evidence_revision: { type: 'null' }
              completeness: { type: 'null' }
              outcome: { type: 'null' }
              missing: { type: 'null' }
              reasons: { type: 'null' }
              policy_hash: { type: 'null' }
              manifest_hash: { type: 'null' }
              evaluator_version: { type: 'null' }
              mode: { type: 'null' }
          else:
            properties:
              decision: { type: string }
              evaluation_id: { type: string }
              evidence_revision: { type: integer }
              completeness: { type: string }
              outcome: { type: string }
              missing: { type: array, items: { type: string } }
              reasons: { type: array, items: { type: string } }
              policy_hash: { type: string }
              manifest_hash: { type: string }
              evaluator_version: { type: string }
              mode: { type: string }
    EventBatch:
      type: object
      description: >-
        Inline mirror of `contracts/schemas/event-envelope.v1.json` (00 §9.4);
        the schema file is authoritative.
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: './schemas/event-envelope.v1.json#/$defs/event'
      x-max-bytes: 1048576
    BatchAckResult:
      type: object
      description: >-
        The 200 body of `POST /v1/runs/{r}/events` (00 §9.4): the batch row this
        call wrote, its counts and one ack per event in request order. A resend
        answers 200 with `accepted: 0` and every ack `duplicate`; no metering
        row is written for it (04.8.1 §4).
      required: [batch_id, accepted, duplicates, acks]
      properties:
        batch_id:
          type: string
          format: uuid
          description: The `event_batch` row written by this accepted batch.
        accepted:
          type: integer
          minimum: 0
          description: How many events were newly committed.
        duplicates:
          type: integer
          minimum: 0
          description: How many events were already on file with the identical canonical payload.
        acks:
          type: array
          items:
            $ref: '#/components/schemas/EventAck'
    EventAck:
      type: object
      description: One event's per-event acknowledgement (00 §9.4), in request order.
      required: [index, event_id, ack]
      properties:
        index:
          type: integer
          minimum: 0
          description: The 0-based position of the event in the request (`details[].index` uses the same numbering).
        event_id:
          type: string
          format: uuid
          description: The event's client-assigned id.
        ack:
          type: string
          enum: [accepted, duplicate]
          description: >-
            `accepted` when this batch committed the row, `duplicate` when it was
            already on file with the identical canonical payload.
    PermissionView:
      type: object
      description: >-
        One entry of the permission catalogue (00 §2). The catalogue holds no
        secrets: `sensitive` describes the permission, it is never a value.
      required: [code, resource, action, description, sensitive, reserved, tenant_assignable]
      properties:
        code:
          type: string
          pattern: '^[a-z_]+:[a-z_]+$'
          description: The `resource:action` string — the catalogue's identity.
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        sensitive:
          type: boolean
          description: True when the permission gates secret-adjacent data (AC5).
        reserved:
          type: boolean
          description: True when the string has no V1 consumer yet (AC2).
        tenant_assignable:
          type: boolean
          description: False for a code a member principal must never hold (T79).
    PermissionListResponse:
      type: object
      description: 00 §9.1 cursor page of `PermissionView`, ordered by `code`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionView'
        next_cursor:
          type: [string, 'null']
          description: The last code of the page when a further page exists, else null.
    RoleView:
      type: object
      description: One role — a built-in (`org_id` null) or the caller's own org row (02 §4.5).
      required: [id, code, name, is_builtin, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: [string, 'null']
          format: uuid
          description: Null for a built-in role, the owning org for a custom role.
        code:
          type: string
        name:
          type: string
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        version:
          type: integer
    RoleListResponse:
      type: object
      description: 00 §9.1 cursor page of `RoleView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CreateRoleRequest:
      type: object
      description: Body of `POST /v1/roles` (02.2.1 §5). V1 answers 403 until the custom-role flag is on.
      required: [code, name, permissions]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Role code; unique per org → 409 `role_code_taken`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: array
          description: Catalogue codes to grant; unknown → 422 `unknown_permission`, non-assignable → 422 `permission_not_assignable` (T79).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    UpdateRoleRequest:
      type: object
      description: Body of `PATCH /v1/roles/{r}` (02.2.1 §5). Both fields optional; a built-in role is 409 `builtin_role_immutable`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        add_permissions:
          type: array
          description: >-
            Catalogue codes granted in addition to the role's current set. Additive only:
            migration 0010 revokes `DELETE` on `role_permission` for the app role, so V1 cannot
            shrink a role's grant set (02.2.1 §3).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    OrganizationDto:
      type: object
      description: >-
        One organization (02.1.1 §4). `organization` is the T4 exception: its own `id` is
        the tenant key. Limit columns are null when no limit is set (02.1.1-T3).
      required:
        [
          id,
          name,
          slug,
          status,
          retention_default_days,
          allowed_email_domains,
          created_at,
          updated_at,
          version,
          max_projects,
          max_seats,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Globally unique (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        retention_default_days:
          type: [integer, 'null']
        allowed_email_domains:
          type: [array, 'null']
          maxItems: 64
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        max_projects:
          type: [integer, 'null']
          description: Projects that are not `deleted` the org may hold; null = no limit.
        max_seats:
          type: [integer, 'null']
          description: Active memberships the org may hold; null = no limit (enforced by plan 12).
    ProjectDto:
      type: object
      description: One project (02.1.1 §4); `unique (org_id, slug)`.
      required:
        [
          id,
          org_id,
          name,
          slug,
          status,
          default_environment_id,
          created_at,
          updated_at,
          version,
          retention_days,
          monthly_run_quota,
          case_prefix,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Unique within the org (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        default_environment_id:
          type: [string, 'null']
          format: uuid
          description: Null until 05.1.2-T1 adds the environment table.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        retention_days:
          type: [integer, 'null']
          description: Overrides the org's `retention_default_days`; null = inherit.
        monthly_run_quota:
          type: [integer, 'null']
          description: Runs per calendar month; null = no limit (enforced by plan 12).
        case_prefix:
          type: string
          pattern: '^[A-Z][A-Z0-9]{1,7}$'
          maxLength: 8
          description: >-
            Uppercase prefix of this project's manual test case codes, `<case_prefix>-<n>`
            (13.1.1 AC4, T2). The default is the stem rule of `0039_authoring_tree.sql`: the
            first four alphanumerics of the slug, upper-cased, `P`-prefixed when the stem would
            start with a digit, with a numeric suffix when the stem is already taken
            (`flashcards` → `FLAS`, `shop-web` → `SHOP`). Unique per organization.
    ProjectListResponse:
      type: object
      description: 00 §9.1 cursor page of `ProjectDto`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDto'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CaseDto:
      type: object
      description: A test case (03.1.1). Its identity (`annotation_id`, `first_seen_commit`) never changes.
      required:
        [
          id,
          org_id,
          project_id,
          annotation_id,
          name,
          framework,
          status,
          labels,
          first_seen_commit,
          created_at,
          updated_at,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
          description: The durable `evidgate.id`; the case's identity inside the project.
        name:
          type: string
          maxLength: 512
        framework:
          type: string
          maxLength: 64
        language:
          type: [string, 'null']
        file_path:
          type: [string, 'null']
          description: Current repository path; moves with a rename.
        status:
          type: string
          enum: [active, missing, archived]
        owner_membership_id:
          type: [string, 'null']
          format: uuid
        labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
        first_seen_commit:
          type: string
        last_seen_commit:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
    CaseIdentitySourceDto:
      type: object
      required: [source, raw_key, commit_sha, created_at]
      properties:
        source:
          type: string
          enum: [annotation, sidecar, imported]
        raw_key:
          type: string
        commit_sha:
          type: string
        created_at:
          type: string
          format: date-time
    CaseRenameDto:
      type: object
      required: [from_path, to_path, commit_sha, detected_at]
      properties:
        from_path:
          type: string
        to_path:
          type: string
        commit_sha:
          type: string
        detected_at:
          type: string
          format: date-time
    CaseDetailDto:
      type: object
      description: A case plus its identity trail, so a duplicate-id mistake is diagnosable.
      required: [case, identity_sources, renames]
      properties:
        case:
          $ref: '#/components/schemas/CaseDto'
        identity_sources:
          type: array
          items:
            $ref: '#/components/schemas/CaseIdentitySourceDto'
        renames:
          type: array
          items:
            $ref: '#/components/schemas/CaseRenameDto'
    CaseListResponse:
      type: object
      description: 00 §9.1 cursor page of `CaseDto`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaseDto'
        next_cursor:
          type: [string, 'null']
    UpdateCaseRequest:
      type: object
      description: Omitted members are unchanged. Any other member is rejected (identity members with `case_field_immutable`).
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 512
        owner_membership_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, archived]
        labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
    CaseRevisionDto:
      type: object
      required:
        [
          id,
          case_id,
          revision_hash,
          commit_sha,
          file_path,
          framework,
          content_sha256,
          assertion_hash,
          created_at,
          assertions_extracted,
          assertions_reliable,
        ]
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        revision_hash:
          type: string
          description: '`sha256:` over the canonical content descriptor (00 §7).'
        commit_sha:
          type: string
        file_path:
          type: string
        framework:
          type: string
        language:
          type: [string, 'null']
        content_sha256:
          type: string
        assertion_hash:
          type: string
        created_at:
          type: string
          format: date-time
        assertions_extracted:
          type: boolean
          description: False when the framework is not understood; `assertion_hash` then changes with any edit.
        assertions_reliable:
          type: boolean
          description: False when the scan could not follow the file to its end; treat `assertion_hash` as "content changed".
    CaseRevisionListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaseRevisionDto'
        next_cursor:
          type: [string, 'null']
    ManifestAccepted:
      type: object
      required: [manifest_id, manifest_hash]
      properties:
        manifest_id: { type: string, format: uuid }
        manifest_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
    EnvironmentRevisionCreated:
      type: object
      required: [revision_id, revision_no, revision_hash, created]
      properties:
        revision_id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1 }
        revision_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        created:
          { type: boolean, description: 'False when identical content was already stored (200).' }
    EnvironmentRevisionDto:
      type: object
      required:
        [
          revision_id,
          environment_id,
          environment_key,
          project_id,
          revision_no,
          revision_hash,
          base_urls,
          dependency_versions,
          secret_refs,
          created_at,
        ]
      properties:
        revision_id: { type: string, format: uuid }
        environment_id: { type: string, format: uuid }
        environment_key: { type: string }
        project_id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1 }
        revision_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        base_urls:
          type: object
          additionalProperties: { type: string }
        dependency_versions:
          type: object
          additionalProperties: { type: string }
        secret_refs:
          type: array
          items: { type: string, pattern: '^secret:[A-Za-z0-9_.-]{1,64}$' }
        created_at: { type: string, format: date-time }
    PolicyRevisionDto:
      type: object
      description: One immutable policy revision (07.1.1-T3); `body` is the closed `policy-revision.v1` document.
      required: [id, project_id, revision_no, hash, state, body, created_by, created_at, version]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1 }
        hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        state: { type: string, enum: [draft, active, retired] }
        body: { $ref: './schemas/policy-revision.v1.json' }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    PolicyActivationDto:
      type: object
      description: >-
        The project's policy pointer after `POST /v1/projects/{p}/policy-activation` (07.1.1-T4); a run
        created afterwards pins `policy_revision_id`.
      required:
        [
          project_id,
          policy_revision_id,
          hash,
          mode,
          activated_by,
          activated_at,
          previous_policy_revision_id,
          changed,
        ]
      properties:
        project_id: { type: string, format: uuid }
        policy_revision_id: { type: string, format: uuid }
        hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        mode: { type: string, enum: [advisory, enforcing] }
        activated_by: { type: string, format: uuid }
        activated_at: { type: string, format: date-time }
        previous_policy_revision_id: { type: [string, 'null'], format: uuid }
        changed: { type: boolean }
    PolicyActivationStateDto:
      type: object
      description: >-
        The project's stored policy activation, read by
        `GET /v1/projects/{p}/policy-activation` (07.1.1 F18). Migration `0033`
        stores `policy_revision_id`, `mode`, `activated_by` and `activated_at`
        only — there is no `previous_policy_revision_id` and no `changed` on a
        read — and `hash` is the activated revision's hash, joined from
        `policy_revision` for the same project; this schema is therefore
        separate from `PolicyActivationDto`, which stays the `POST` route's
        answer, unchanged.
      required: [project_id, policy_revision_id, hash, mode, activated_by, activated_at]
      properties:
        project_id: { type: string, format: uuid }
        policy_revision_id: { type: string, format: uuid }
        hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        mode: { type: string, enum: [advisory, enforcing] }
        activated_by: { type: string, format: uuid }
        activated_at: { type: string, format: date-time }
    PolicyRevisionSummaryDto:
      type: object
      description: A policy revision without its body (07.1.1-T3 list rows).
      required: [id, revision_no, hash, state, created_by, created_at, version]
      properties:
        id: { type: string, format: uuid }
        revision_no: { type: integer, minimum: 1 }
        hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        state: { type: string, enum: [draft, active, retired] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    PolicyRevisionListResponse:
      type: object
      description: 00 §9.1 cursor page of `PolicyRevisionSummaryDto`, keyset-ordered on `(revision_no, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyRevisionSummaryDto' }
        next_cursor: { type: [string, 'null'] }
    JsonElement:
      description: >-
        Any JSON value. The served document names the .NET `JsonElement` this way; the members that use it (variant
        `params`, the three strategy documents) say what they hold in their own description.
    SuiteDto:
      type: object
      required: [id, org_id, project_id, name, slug, status, created_at, updated_at, version]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$' }
        status: { type: string, enum: [active, archived] }
        head_revision_id: { type: [string, 'null'], format: uuid }
        head_revision_no: { type: [integer, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        version: { type: integer }
    SuiteListResponse:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SuiteDto' }
        next_cursor: { type: [string, 'null'] }
    CreateSuiteRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 128 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$' }
    SuiteMemberInput:
      type: object
      required: [case_revision_id]
      additionalProperties: false
      properties:
        ref:
          {
            type: string,
            pattern: '^[A-Za-z0-9_.-]{1,64}$',
            description: 'Name used by edges; defaults to _<index>.',
          }
        case_revision_id: { type: string, format: uuid }
        params:
          type: [object, 'null']
