        effective `sensitivity` is `sensitive` when the row was minted sensitive, when the project's kind policy now
        classifies the kind sensitive (a policy can raise the classification of rows that already exist), or when the
        secret scan has not proved the artifact clean (`pending` is unscanned, `flagged` found a secret, an unknown
        state fails closed); reading never lowers a stored classification. An id of another tenant or another project
        is the one `404 artifact_not_found`: row level security makes it invisible, so it is indistinguishable from an
        unknown id. A read, so no `Idempotency-Key`.
