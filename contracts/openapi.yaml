openapi: 3.1.0
info:
  title: Evidgate API
  version: 1.0.0
  description: >-
    Evidgate public API (00 §9). REST + JSON under `/v1`. Conventions:
    every response carries `X-Request-Id` and echoes it in `error.request_id`;
    a W3C `traceparent` header is accepted on every operation. Cursor
    pagination is `?cursor=&limit=` (default 50, max 200), response
    `{ "items": [], "next_cursor": null }`, ordering `(created_at, id)`.
    Cookie-authenticated mutations require `X-XSRF-TOKEN` (00 §9.1, T38);
    bearer-only routes never carry it. Mutations that create resources or
    side effects require `Idempotency-Key` unless exempted in
    contracts/README.md. Optimistic concurrency uses `ETag`/`If-Match`
    (stale → 412). Error envelope is 00 §9.2 (`ErrorEnvelope`); 429/503
    carry `Retry-After`. Operational routes (`/internal/*`, `/metrics`) are
    intentionally absent — they never appear in this spec (00 §9.1).
  contact:
    name: Evidgate team
  license:
    name: Proprietary
servers:
  - url: /v1
    description: API version 1 (stub operations also document V2-tagged routes via `x-version`)
tags:
  - name: ci
    description: CI entry points (token exchange)
  - name: runs
    description: Runs, manifests, finalize and control actions
  - name: events
    description: Event batch ingest
  - name: artifacts
    description: Artifact upload and download
  - name: decisions
    description: Run and release decisions
  - name: environments
    description: Immutable environment revisions
  - name: policies
    description: Immutable policy revisions (07)
  - name: reports
    description: Raw-report comparisons
  - name: releases
    description: Releases and release-run binding
  - name: identity
    description: Orgs, projects, memberships (02)
  - name: ci-admin
    description: CI bindings and ingest tokens (02)
  - name: audit
    description: Tenant-visible audit log (02, 11)
  - name: support
    description: Support grants (02)
  - name: security
    description: Security events (11)
  - name: catalog
    description: Case catalog and suite versioning (03)
  - name: webhooks
    description: Inbound provider webhooks (03)
  - name: drafts
    description: Authoring drafts, dry run and pull request (03, V2)
  - name: healing
    description: Incidents, candidates, switch (08)
  - name: usage
    description: Usage summary and ledger (12)
  - name: jobs
    description: Runner job claim and heartbeat (V2, 04/05)
  - name: policy
    description: Waivers and quarantine lifecycles (07)
paths:
  /ci/token:
    post:
      operationId: exchangeCiToken
      tags: [ci]
      summary: Exchange a GitHub OIDC JWT or project ingest token for a `ci_producer` token (02.4)
      description: >-
        A pre-tenant route (00 §5.4.8, TL T1): there is no session, the credential is the
        request. Send a GitHub Actions OIDC token as `Authorization: Bearer …`, or an ingest
        token as `{"ingest_token": "egt_…"}`. The first exchange of a binding that is still
        `pending_verification` also carries `binding_challenge`. The reply is a short-lived
        (at most 60 minutes) `ci_producer` token scoped to exactly one project. Failures:
        401 `token_invalid` / `token_replayed` / `token_unknown` / `token_revoked` /
        `token_expired`; 403 `binding_mismatch` / `binding_pending` / `binding_disabled`;
        409 `binding_conflict`; 429 `rate_limited` (with `Retry-After`); 503 `unavailable`
        when the deployment has no signing key or the issuer's keys cannot be fetched.
        Idempotency-Key exempt: `jti` single-use is the arbiter (README).
      x-permission: none
      x-auth: github_oidc_jwt_or_ingest_token
      x-version: v1
      security:
        - bearerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiTokenRequest'
      responses:
        '200':
          description: Short-lived `ci_producer` token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/manifests:
    post:
      operationId: createManifest
      tags: [runs]
      summary: Upload and verify a run manifest
      description: >-
        Uploads + verifies the manifest and returns `manifest_id` and
        `manifest_hash` (00 §9.3). The request body is
        `contracts/manifest/manifest.v1.json` — the schema file is authoritative,
        the same file both validators load (server Corvus, CLI Ajv, T42). Body ≤
        256 KiB → `413`. Every refusal is 422 `manifest_invalid` whose `details[]`
        carry `index` (the planned execution, when there is one), `path` and
        `reason`: a schema keyword, `secret_in_variant_params`, `matrix_not_covered`,
        `unknown_case_revision`, `unknown_suite_revision`,
        `unknown_environment_revision` or `invalid_value`; no submitted value is
        echoed (a parameter is named by position, `#n`). `manifest_hash` is
        `sha256:` over the RFC 8785 canonical body; the same canonical content in
        the same project answers 201 with the stored `manifest_id` (05.1.1 AC6).
        `ETag` is the hash.
      x-permission: run:create
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './manifest/manifest.v1.json'
      responses:
        '201':
          description: Manifest accepted (or the stored manifest of the same canonical content)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Cursor list of runs with state, decision and rerun/reprocess labels
      description: >-
        Cursor list (00 §9.1) of a project's runs, ordered by `(created_at, id)`
        ascending, with state, decision and rerun/reprocess labels (09). Since
        05.2.2 it is narrowed by the run's recorded identity: `ref_name`,
        `pr_number`, `head_sha`, `trigger_event` and `is_fork`, all optional and
        AND-combined exact matches, and every row carries `created_at`, `ref` and
        `unverified_ref`. The opaque `cursor` is the last row's `(created_at, id)`
        of the previous page and is not signed — it is bound to the caller's own
        project and tenant by the query, so a well-formed cursor only moves the
        page position inside those rows; a cursor this endpoint did not issue is
        422 `request_invalid`. An unknown project (or another tenant's) is 404
        `not_found`, the same body as an unknown one.
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RunRefName'
        - $ref: '#/components/parameters/RunPrNumber'
        - $ref: '#/components/parameters/RunHeadSha'
        - $ref: '#/components/parameters/RunTriggerEvent'
        - $ref: '#/components/parameters/RunIsFork'
      responses:
        '200':
          description: Page of runs
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a run
      description: >-
        Locks manifest, policy, suite and environment; writes run + planned
        executions + outbox in one transaction (00 §9.3). `Idempotency-Key`
        required (00 §9.1): a retry with the same key and the same canonical
        body replays the original response, a different body is 409
        `idempotency_conflict` (AC3/AC4). A manifest that does not resolve (unknown, or
        another tenant's) is 404 `not_found`; an unresolved suite or
        environment revision is 422 `manifest_invalid` with `details[]`; a
        manifest whose planned executions collide on `execution_key` is 422
        `execution_key_conflict`; naming a `release` is 422
        `release_unresolvable` at M1 (the release tables land with 05.6.1). A
        `purpose` of `replay` is refused 422 `replay_grant_invalid` until
        08.4.3 issues grants (every replay request, even one naming a
        well-formed grant); a `replay` purpose together with a `release` is 422
        `replay_release_not_allowed`. A refusal writes no run, planned
        execution, producer slot, outbox or audit row, and its failure Result is
        never stored for idempotency (the key stays reusable). The optional
        `ref` object records the run's branch/tag/PR identity (05.2.2-T1): a
        verified `ci_producer` caller's OIDC `ref`/`sha` claims win and a
        conflicting member is ignored, never refused (AC3), while every value
        taken from the body marks the run `unverified_ref = true` in the 201
        body. The body block is shape-validated even where a claim later
        overrides it — an unknown member inside `ref`, a `kind` or
        `trigger_event` outside its enum, a `name` outside 1..255, a
        `head_sha`/`base_sha` outside `^[0-9a-f]{40}([0-9a-f]{24})?$`, a
        `pr_number` below 1 or a non-boolean `is_fork` is 422 `request_invalid`
        with `details[].path`, and `kind: pull_request` without `pr_number` is
        refused on the values that remain after the claim merge.
      x-permission: run:create
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunCreated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Run state + current evidence revision
      description: >-
        One run's state machine position (05.3.1 AC7): `state` (00 §8.1),
        `current_evidence_revision_id` (null until 05.3.2 freezes a revision),
        `version` (the optimistic-concurrency token a transition echoes in
        `If-Match`) and `purpose` (`regular`/`replay`, T67). The identity block
        `ref` (branch/tag/PR, 05.2.2-T1) is returned with all members present,
        `null` where unknown, plus `unverified_ref` (`true` when any stored
        identity value came from the request body rather than a verified CI
        claim). Another tenant's run —
        or, for a project-scoped credential, another project's — is 404, the same
        `not_found` body as an unknown id.
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run state, current evidence revision, version and purpose
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Request run cancellation (202; recorded, not "stopped")
      x-permission: run:cancel
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '202':
          description: Cancel request recorded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/events:
    post:
      operationId: postRunEvents
      tags: [events]
      summary: Atomic event batch (≤ 500 events, ≤ 1 MiB before decompression)
      description: >-
        Body validated against `contracts/schemas/event-envelope.v1.json`
        (00 §9.4). Atomic commit; per-event ack `accepted`/`duplicate`.
        Idempotency-Key exempt: per-event `event_id` dedupe is the arbiter
        (00 §9.4; README exemption list). A first-send batch whose first
        envelope is the sequence-1 `run.log` capability carrier
        (`ext.capability`, `ext.schema` = `<adapter-name>/<protocol-major>`)
        registers the adapter capability before the first event (04.7.1-T2.3):
        a schema failure is 422 `capability_invalid` (`details[].path`), an
        unsupported `protocol.major` is 422 `unsupported_protocol_major`
        (`details` names both majors), and a natural-key conflict with a stored
        row that differs in `engine_family`/`platforms`/`supports`/`mode` is
        409 `capability_conflict`; all `retryable: false`.
        Batch refusals: 422 `event_invalid` (schema, canonicalisation or
        per-event shape; `details[].index` names the event), 422
        `unknown_execution_key` (an `execution_key` is not a planned execution
        of the run; every failing index is listed), 422 `sequence_reused` (a
        `(run, producer, sequence)` slot is already stored), 422
        `unknown_producer` (the run has no such producer slot) and 403
        `producer_slot_taken` (the slot is bound to another token identity);
        409 `duplicate_different_payload` (an `event_id` is stored with a
        different canonical payload), 409 `run_closed` (the run is `complete`
        or `incomplete`) and 413 `batch_too_large`. `batch_too_large` is the
        one answer to every limit breach, refused before any write: more than
        500 events, a raw body over the route's 1 MiB transport cap (the cap
        counts the bytes as sent — for `Content-Encoding: gzip` the compressed
        bytes, before decompression), or a gzip body whose decoded size passes
        the expanded-size cap (8 MiB) or the expansion ratio (20:1, DECISIONS
        §8.1 D-A8; both are `EVIDGATE__INGESTION__*` options, 04.1.1-T3).
        `Content-Encoding: gzip` is decoded under those caps; any other or a
        stacked encoding is 422 `request_invalid` (detail path
        `Content-Encoding`, reason `unsupported`) and a malformed, multi-member
        or trailing-data gzip is 422 `request_invalid` (same path, reason
        `invalid_gzip`) — a body is never silently ignored or partly decoded.
        All `retryable: false`.
      x-permission: event:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Per-event acknowledgements
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAckResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/finalize:
    post:
      operationId: finalizeRun
      tags: [runs]
      summary: Finalize a shard (202, reconcile async)
      description: >-
        A CI shard declares it has sent everything for its producer slot:
        `producer_id`, `shard`, `last_sequence`, `count`, `manifest_hash`
        (00 §9.3) → 202 with no body; reconciliation is asynchronous. Only the
        identity bound to that slot may finalize it (T9): the first accepted
        write binds the slot to the caller's token identity, a different
        identity is 403 `producer_slot_taken` with nothing changed, and a
        producer id the run does not plan is 422 `unknown_producer`. `shard`
        must be the slot's own 1-based manifest shard and `manifest_hash` must
        be the hash of the run's own manifest; a mismatched hash is 422
        `manifest_invalid` and closes nothing, so a finalize is never taken as
        evidence against the wrong plan. The call is idempotent on the slot's
        close: a repeat answers the same 202 and changes nothing — no second
        state transition and no second reconcile trigger — and the first
        declaration's `last_sequence` and `count` stay authoritative even when
        a repeat declares different values. A project being deleted is 409
        `project_deleting`, a suspended project 403 `org_suspended`. The request
        body is capped at 8 KiB and is refused with 413 `payload_too_large`
        before it is parsed. `Idempotency-Key` is accepted as 00 §9.1 requires,
        but the arbiter of a duplicate is the slot's own closed marker, never
        the key.
      x-permission: event:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [producer_id, shard, last_sequence, count, manifest_hash]
              properties:
                producer_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'
                  description: >-
                    The shard's deterministic producer id (T54) - it must name
                    a slot the run planned.
                shard:
                  type: integer
                  minimum: 1
                  maximum: 256
                  description: >-
                    The 1-based manifest shard index; it must equal the bound
                    slot's own index (422 `request_invalid` otherwise).
                last_sequence:
                  type: integer
                  format: int64
                  minimum: 0
                  description: The highest producer sequence the shard declares it sent.
                count:
                  type: integer
                  format: int32
                  minimum: 0
                  description: How many events the shard declares it sent.
                manifest_hash:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                  description: >-
                    The hash of the run's own manifest; a mismatch is 422
                    `manifest_invalid` and closes nothing.
      responses:
        '202':
          description: Finalize accepted; reconcile async
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /artifacts/upload-url:
    post:
      operationId: createArtifactUploadUrl
      tags: [artifacts]
      summary: Request a presigned upload URL for an artifact
      description: >-
        Scope run/attempt, media type, size, checksum → server-chosen key +
        presigned URL (00 §9.3, 06.1.2 §5). The run must be visible to the
        caller's project and the project must not be deleting (404 `not_found`,
        409 `project_deleting`); `producer_id` must name a slot of that run, and
        the first accepted write binds the slot to the caller's token identity
        (403 `producer_slot_taken`, 422 `unknown_producer`; T9/T85);
        `execution_key` must be a planned execution of the run (422
        `unknown_execution_key`; T10/T17); the kind policy must allow the kind,
        the media type and the declared size (422 `kind_disabled` /
        `media_type_not_allowed`, 413 `payload_too_large`). The request body is
        capped at 8 KiB and is refused with 413 `payload_too_large` before it is
        parsed. When the project has no policy row for the kind, the static
        per-kind defaults (`contracts/evidence/artifact-kind-defaults.v1.json`,
        06.1.2-T3) apply for `trace`, `video`, `screenshot` and `raw_report`;
        the remaining four kinds stay 422 `kind_disabled`, and a project row can
        only lower the cap, never raise it. The returned `object_key` is
        the `pending/<org_id>/<artifact_id>` staging key, `required_headers`
        must be sent verbatim with the `PUT`, and the URL expires within 15
        minutes. The `Idempotency-Key` is a header, never a body member (T92).
      x-permission: artifact:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [run_id, producer_id, execution_key, attempt_no, kind, media_type, bytes, sha256]
              properties:
                run_id:
                  type: string
                  format: uuid
                producer_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                execution_key:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                attempt_no:
                  type: integer
                  minimum: 1
                kind:
                  type: string
                  enum:
                    [
                      trace,
                      video,
                      screenshot,
                      raw_report,
                      dom_snapshot,
                      a11y_snapshot,
                      patch,
                      ui_hierarchy,
                    ]
                media_type:
                  type: string
                  minLength: 1
                  maxLength: 255
                bytes:
                  type: integer
                  minimum: 1
                sha256:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
      responses:
        '200':
          description: Upload URL issued
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /artifacts/{a}/complete:
    post:
      operationId: completeArtifact
      tags: [artifacts]
      summary: Verify object/size/checksum → artifact `ready`
      description: >-
        Verifies the object the client `PUT` to the staging key and commits the outcome
        (06.1.2 §5, AC3/AC4/AC5/AC8). The route takes no request body: the artifact is
        named by `{a}` and the project comes from the credential, so a project-scoped
        principal (the CI producer token) is required — an org-scoped principal is refused
        403 `project_required` (T1 decision 10). T86
        order: (1) read the artifact row (state, declared bytes, checksum, kind, final key,
        project status) in a tenant read scope; (2) with NO transaction open, `HEAD` the
        staging key `pending/<org_id>/<artifact_id>`; when it is absent, `HEAD` the final
        key and, if its size and SHA-256 equal the declared ones, proceed to commit `ready`
        (retry path) — otherwise the outcome is `rejected` with `object_missing`; (3)
        verify the `HEAD` size equals the declared `bytes` and is within the kind policy
        `max_bytes`, and that the `HEAD` SHA-256 equals the declared one (a store that
        reports no checksum is not verified and fails closed as `checksum_mismatch`); (4)
        idempotently copy the staging object to the final key (skipped on the retry path);
        (5) in ONE tenant transaction, guard the state, write `state=ready`, `bytes`,
        `scan_state=pending` and the outbox rows `artifact_secret_scan` and
        `artifact_staging_delete`, and bump `version`; a mismatch instead writes
        `state=rejected` and `failure_code` with no outbox rows. Storage calls never run
        inside a DB transaction (00 §5.7 P5) and the staging object is deleted by the
        outbox task only after commit; a failed commit leaves the staging object for the
        24 h bucket lifecycle (T18) and the already-copied final object for the orphan
        sweeper (06.4.3) to remove. A verification mismatch is a COMMITTED 200 with
        `state: rejected` and a `failure_code`, never an error response; the final object
        key is never in the body. Replay: `complete` on a `ready` artifact returns the same
        body, on a `rejected` artifact the current state unchanged, and a same key with a
        different canonical payload is 409 `idempotency_conflict`. The `Idempotency-Key` is
        a header and is required (T92): a missing or over-long key is 400 `request_invalid`,
        refused before the artifact is read or the object store is touched. `failure_code` is
        one of `size_mismatch`, `checksum_mismatch`, `media_type_mismatch`, `too_large` or
        `object_missing`.
        Errors: 404 `artifact_not_found` (unknown, other-tenant or other-project artifact),
        409 `artifact_state_conflict` (a state that is neither `pending_upload`/`uploaded`
        nor a replayable `ready`/`rejected`), 409 `project_deleting` (project status
        `deleted`), 403 `forbidden` (missing `artifact:write`) or 403 `project_required`
        (an org-scoped credential that names no project). The parse-profile failure
        `artifact_invalid` (422, 06.3.1-T1) is registered here for discoverability but is
        not returned by this route: it comes from in-process parser callers (`IParsing`,
        reason ∈ `dtd_prohibited`, `depth_exceeded`, `size_exceeded`, `timeout`,
        `malformed`), and this route never parses the object — a sniff mismatch is the
        committed 200 `rejected` + `media_type_mismatch` above.
      x-permission: artifact:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Artifact verified (`ready`) or verification refused (`rejected`)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
