    SecurityEventItem:
      type: object
      description: >-
        One tenant-visible security event (11.5.1 AC3, migration `security_event`). `actor` is
        `{kind, id}` and `details` carries ids, hashes and counts only: never a raw payload, a
        secret or a reason text (11.1.1 baseline §4).
      required: [id, type, severity, actor, details, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: [string, 'null']
          format: uuid
          description: Null for an event that belongs to no project.
        type:
          type: string
          description: The five V1 types; `injection_attempt` arrives in V2 (11.4.1-T2).
          enum:
            [
              auth_failure,
              cross_tenant_probe,
              secret_scanner_alert,
              kill_switch_used,
              support_access,
            ]
        severity:
          type: string
          enum: [info, warning, critical]
        actor:
          type: object
          description: Who caused the event (`{kind, id}`, no secrets).
          properties:
            kind:
              type: string
            id:
              type: [string, 'null']
        details:
          type: object
          description: Ids, hashes and counts only; never a raw payload, a secret or a reason text.
        request_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    SecurityEventList:
      type: object
      description: 00 §9.1 cursor page of `SecurityEventItem`, newest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecurityEventItem'
        next_cursor:
          type: [string, 'null']
    OrganizationSummaryDto:
      type: object
      description: One organization in `GET /v1/orgs`.
      required: [id, slug, name, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
    OrganizationListResponse:
      type: object
      description: Body of `GET /v1/orgs`; bounded by the resolver, so no cursor.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummaryDto'
    CreateOrganizationRequest:
      type: object
      description: Body of `POST /v1/orgs` (02.1.1 §5).
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
    UpdateOrganizationRequest:
      type: object
      description: Body of `PATCH /v1/orgs/{o}` (02.1.1 §5); an omitted field is unchanged.
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
        retention_default_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        allowed_email_domains:
          type: [array, 'null']
          maxItems: 64
          items:
            type: string
            maxLength: 253
    CreateProjectRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/projects` (02.1.1 §5).
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
    UpdateProjectRequest:
      type: object
      description: Body of `PATCH /v1/projects/{p}` (02.1.1 §5); an omitted field is unchanged.
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
        case_prefix:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z0-9]{1,7}$'
          maxLength: 8
          description: >-
            Changes this project's manual test case code prefix (13.1.1-T2, 02.1.1 §5). Unique
            per organization: another project already using it is 409 `case_prefix_taken`
            (`details[].path = /case_prefix`), and codes already allocated are never rewritten.
        retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
    MembershipView:
      type: object
      description: One membership of an org (02.1.2 §4) with the roles it currently holds.
      required: [id, org_id, invited_email, status, roles, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          format: uuid
          description: Null while the invite is `pending`; set when a login binds it (02.3.1-T2).
        invited_email:
          type: string
          description: The normalised invite address (trimmed, lowercased). Personal data (02.1.2 §8).
        status:
          type: string
          enum: [pending, active, removed, revoked, expired]
        roles:
          type: array
          description: The role set of 02.1.2 §6 — built-in catalogue roles plus the org's own.
          items:
            $ref: '#/components/schemas/RoleView'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
    InviteIssuedView:
      type: object
      description: >-
        An invite as `POST /orgs/{o}/memberships` (201) and `POST …/{m}/resend` (202) answer it
        (02.1.2-T2 §5): every field of `MembershipView` plus the plaintext invite token, shown
        once. The token is stored only as an HMAC-SHA256 of its secret half beside the public
        prefix, so nothing can return it again — rotate it with `resend`. An `Idempotency-Key`
        replay answers the stored body with `invite_token` absent (`null`).
      required: [id, org_id, invited_email, status, roles, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          format: uuid
          description: Null while the invite is `pending`; set when a login binds it (02.3.1-T2).
        invited_email:
          type: string
          description: The normalised invite address (trimmed, lowercased). Personal data (02.1.2 §8).
        status:
          type: string
          enum: [pending, active, removed, revoked, expired]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        invite_token:
          type: [string, 'null']
          x-sensitive: true
          description: >-
            The invite link token (`evgi_<prefix>_<secret>`), returned once by the request that
            minted it and never stored in plaintext. Absent (`null`) on an `Idempotency-Key` replay.
    MembershipListResponse:
      type: object
      description: 00 §9.1 cursor page of `MembershipView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    InviteMemberRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/memberships` (02.1.2 §5) — invite by address, optionally with initial roles.
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          description: The invited address; normalised (trimmed, lowercased) before it is stored or compared.
        roles:
          type: array
          description: Role ids the membership starts with; each must be built-in or the caller's own org role (else 409 `unknown_role`).
          items:
            type: string
            format: uuid
    UpdateMembershipRequest:
      type: object
      description: Body of `PATCH /v1/orgs/{o}/memberships/{m}` (02.1.2 §5). `If-Match` carries the row's `version`; stale → 412.
      required: [status]
      properties:
        status:
          type: string
          enum: [removed]
          description: >-
            Only `removed` — the admin disable path (AC3). Activating a pending invite is the
            invite-binding flow of 02.1.2-T2 (T75), never a client-set status.
    GrantRoleRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/memberships/{m}/roles` (02.1.2 §5) — grant one role to one membership.
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
          description: A built-in catalogue role or one of the caller's own org roles (else 409 `unknown_role`).
    HealingSwitchView:
      type: object
      description: >-
        One stored switch scope (08.6.3-T1, 00 §8.7). `scope`, `org_id` and `project_id` are the row's identity and
        cannot be rewritten: a change re-stamps only the mode, the reason, who set it and when, and the database bumps
        `version` itself. The `system` member of a tenant's `GET` is redacted (SR-F2): it carries `mode`, `at` and
        `version` only, with `set_by` and `reason` null, because the platform operator's identity and incident notes
        are not the tenants' to read. The operator's own write response keeps both.
      required: [scope, project_id, mode, reason, set_by, at, version]
      properties:
        scope:
          type: string
          enum: [system, tenant, project]
        project_id:
          type: [string, 'null']
          format: uuid
          description: The project of a `project` row; null on a `system` or `tenant` row
        mode:
          type: string
          enum: [enabled, shadow, disabled]
        reason:
          type: [string, 'null']
          maxLength: 2000
          description: The free-text reason of the change; null on a redacted `system` row and when none was given
        set_by:
          type: [string, 'null']
          format: uuid
          description: >-
            The member (or platform operator) who set this scope; null on a redacted `system` row of a tenant's `GET`
        at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    DependencyHealth:
      type: object
      description: >-
        The healing subsystem's dependency observations (08.6.3 §5). Both fields are null until 08.6.3-T2 wires the
        health probes, and null means "not observed" — never "healthy".
      required: [llm, knowledge_store]
      properties:
        llm:
          type: [string, 'null']
          description: The model endpoint's observation; null until 08.6.3-T2 wires health probes
        knowledge_store:
          type: [string, 'null']
          description: The knowledge store's observation; null until 08.6.3-T2 wires health probes
    HealingSwitchResolutionView:
      type: object
      description: >-
        The healing switch in force (08.6.3-T1, AC2): each scope's stored row, the most restrictive mode of the scopes
        that carry one, and the dependency observations. A scope without a row is null and contributes nothing; with
        no row at any scope the resolution is `shadow`, the V1 posture of healing that never applies.
      required: [system, tenant, project, resolved, dependency_health]
      properties:
        system:
          description: The platform-wide row, or null when the operator never set one
          oneOf:
            - $ref: '#/components/schemas/HealingSwitchView'
            - type: 'null'
        tenant:
          description: The org's row, or null
          oneOf:
            - $ref: '#/components/schemas/HealingSwitchView'
            - type: 'null'
        project:
          description: The project's row when the query named one and it has a row, else null
          oneOf:
            - $ref: '#/components/schemas/HealingSwitchView'
            - type: 'null'
        resolved:
          type: string
          enum: [enabled, shadow, disabled, unavailable]
          description: The most restrictive stored mode; `shadow` when no scope has a row
        dependency_health:
          $ref: '#/components/schemas/DependencyHealth'
    WaiverDto:
      type: object
      description: >-
        One risk-acceptance waiver (07.3.1-T1, 00 §8.8). `approved_by` is null until a
        different approver approves it; `state` is returned as stored.
      required:
        [
          id,
          project_id,
          scope,
          target_id,
          reason,
          requested_by,
          approved_by,
          state,
          expires_at,
          created_at,
          updated_at,
        ]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        scope: { type: string, enum: [case, suite] }
        target_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        requested_by: { type: string, format: uuid }
        approved_by: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [requested, approved, expired, revoked] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WaiverCreateRequest:
      type: object
      description: >-
        Body of `POST /v1/waivers` (07.3.1-T1 §5). `expires_at` must be strictly in the
        future; `reason` is 1..2000 characters.
      required: [project_id, scope, target_id, reason, expires_at]
      properties:
        project_id: { type: string, format: uuid }
        scope: { type: string, enum: [case, suite] }
        target_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expires_at: { type: string, format: date-time }
    WaiverPage:
      type: object
      description: 00 §9.1 cursor page of `WaiverDto`, keyset-ordered on `(created_at, id)` ascending.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WaiverDto' }
        next_cursor: { type: [string, 'null'] }
    QuarantineEntry:
      type: object
      description: >-
        One quarantine entry (07.3.1-T2, 00 §8.8): a case excluded from gating while its
        failure stays visible. `state` is returned as stored (`active`, `expired`, `removed`).
      required: [id, project_id, case_id, owner, reason, state, expires_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        owner: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        state: { type: string, enum: [active, expired, removed] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    QuarantineEntryCreateRequest:
      type: object
      description: >-
        Body of `POST /v1/quarantine` (07.3.1-T2 §5). `expires_at` must be strictly in the
        future; `reason` is 1..2000 characters; `case_id` must be a case of `project_id` and
        `owner` a membership of the org.
      required: [project_id, case_id, owner, reason, expires_at]
      properties:
        project_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid }
        owner: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        expires_at: { type: string, format: date-time }
    QuarantineEntryPage:
      type: object
      description: 00 §9.1 cursor page of `QuarantineEntry`, keyset-ordered on `(created_at, id)` ascending.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/QuarantineEntry' }
        next_cursor: { type: [string, 'null'] }
    UploadUrlResponse:
      type: object
      description: >-
        200 body of `POST /v1/artifacts/upload-url` (06.1.2 §5, AC1). `object_key`
        is the `pending/<org_id>/<artifact_id>` staging key the client `PUT`s to;
        `required_headers` are the signed headers the client must send verbatim
        (`Content-Length` = the declared `bytes`, `x-amz-checksum-sha256` = the
        base64 of the declared digest); `expires_at` is at most 15 minutes out.
      required: [artifact_id, object_key, upload_url, required_headers, expires_at]
      properties:
        artifact_id: { type: string, format: uuid }
        object_key: { type: string }
        upload_url: { type: string, format: uri }
        required_headers:
          type: object
          additionalProperties: { type: string }
        expires_at: { type: string, format: date-time }
    CompleteResponse:
      type: object
      description: >-
        200 body of `POST /v1/artifacts/{a}/complete` (06.1.2 §5, AC3/AC4/AC5). `state` is
        `ready` when the staged object matched the declared size and checksum and the
        commit landed, or `rejected` when verification failed — a rejection is still a
        committed 200 carrying `failure_code` (one of `size_mismatch`,
        `checksum_mismatch`, `media_type_mismatch`, `too_large`, `object_missing`), never
        an error response. `bytes` is the size the store reported, or `null` when nothing
        was verified; `scan_state` is `pending` on a `ready` artifact (`pending`/`clean`/
        `flagged` are the 06.2.3 values) and `null` on a `rejected` one. The final object
        key is never returned.
      required: [artifact_id, state, bytes, scan_state, failure_code]
      properties:
        artifact_id: { type: string, format: uuid }
        state: { type: string, enum: [ready, rejected] }
        bytes: { type: [integer, 'null'] }
        scan_state: { type: [string, 'null'] }
        failure_code: { type: [string, 'null'] }
    RetentionPolicy:
      type: object
      description: >-
        A project's evidence retention windows (06 §4 `retention_policy`, 06.4.1-T1): the body and the `200`
        answer of `PUT /v1/projects/{p}/retention`, and the `200` answer of its `GET`. `artifact_days` bounds
        how long artifacts are kept, `metadata_days` how long their metadata rows outlive the bytes. Both are
        required and the body is closed. The accepted range comes from `RetentionLimits` at runtime
        (documented defaults: artifact 1..90, metadata 30..90, with `metadata_days` at least `artifact_days`)
        and the platform defaults for a project with no stored row are 14 and 90; a value outside that range is
        `422 retention_out_of_range` whose `error.details[]` names the field and the bound, so the numbers stay
        configuration and not JSON-Schema constants.
      additionalProperties: false
      required: [artifact_days, metadata_days]
      properties:
        artifact_days:
          type: integer
          description: Days an artifact is kept; validated against `RetentionLimits.MinArtifactDays`/`MaxArtifactDays`.
        metadata_days:
          type: integer
          description: >-
            Days the artifact's metadata rows are kept; validated against `RetentionLimits.MinMetadataDays`/
            `MaxMetadataDays` and never shorter than `artifact_days`.
    ArtifactMetadata:
      type: object
      description: >-
        The `200` answer of `GET /v1/artifacts/{a}`. `sensitivity` is the effective classification every content path
        enforces; `content_gated` is true when the caller holds `artifact:read` but not `artifact:read_sensitive`, and
        `object_key`, `checksum` and `bytes` are then absent from the document rather than null, so a redacted field
        can never be mistaken for a value.
      additionalProperties: false
      required:
        [
          artifact_id,
          project_id,
          run_id,
          kind,
          media_type,
          state,
          sensitivity,
          scan_state,
          content_gated,
          created_at,
        ]
      properties:
        artifact_id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        kind:
          type: string
          enum:
            [trace, video, screenshot, raw_report, dom_snapshot, a11y_snapshot, patch, ui_hierarchy]
        media_type: { type: string }
        state:
          type: string
          enum: [pending_upload, uploaded, ready, rejected, pending_delete, deleted]
        sensitivity:
          type: string
          enum: [normal, sensitive]
        scan_state:
          type: [string, 'null']
          enum: [pending, clean, flagged, null]
        bytes:
          type: [integer, 'null']
          description: The stored length; absent when `content_gated` is true.
        checksum:
          type: [string, 'null']
          description: The content address; absent when `content_gated` is true.
        object_key:
          type: [string, 'null']
          description: The server-chosen storage key; absent when `content_gated` is true.
        content_gated:
          type: boolean
          description: True when the content-bearing members were withheld from this caller.
        created_at: { type: string, format: date-time }
    ArtifactDownloadUrl:
      type: object
      description: >-
        The `200` answer of `GET /v1/artifacts/{a}/download-url`. `download_url` is a bearer credential: it is returned
        once and never logged or audited.
      additionalProperties: false
      required: [artifact_id, download_url, expires_at]
      properties:
        artifact_id: { type: string, format: uuid }
        download_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    ArtifactKindPolicy:
      type: object
      description: >-
        The request and the `200` answer of `PUT /v1/projects/{p}/artifact-kind-policy/{kind}`: the project's stored
        capture policy for one kind. Every member is required — the row's knobs are written as a whole. The answer adds
        `kind`, so a client can render what the server committed without a second read.
      additionalProperties: false
      required: [max_bytes, media_types, default_sensitivity, capture_enabled, reject_on_secret]
      properties:
        kind:
          type: string
          description: The kind the row belongs to; present on the answer only (the request names it in the path).
          enum:
            [trace, video, screenshot, raw_report, dom_snapshot, a11y_snapshot, patch, ui_hierarchy]
        max_bytes:
          type: integer
          minimum: 1
          description: The largest artifact of the kind the project accepts.
        media_types:
          type: array
          minItems: 1
          maxItems: 64
          items: { type: string }
        default_sensitivity:
          type: string
          enum: [normal, sensitive]
        capture_enabled: { type: boolean }
        reject_on_secret: { type: boolean }
    NodeDto:
      type: object
      description: >-
        One feature-tree node (13.1.1 §4); 13.1.1-T2. `child_count` and `item_count` count live
        children and live checklist items and are always returned (§5 route 1).
      required: [node_id, parent_id, kind, title, position, version, child_count, item_count]
      properties:
        node_id: { type: string, format: uuid }
        parent_id: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [module, feature, category, sub_category] }
        title: { type: string, minLength: 1, maxLength: 200 }
        position:
          {
            type: integer,
            minimum: 0,
            description: 'Unique among the live siblings of one parent (AC2).',
          }
        version: { type: integer, minimum: 1, description: 'The `ETag` / `If-Match` value (AC19).' }
        child_count: { type: integer, minimum: 0 }
        item_count: { type: integer, minimum: 0 }
    NodePathEntry:
      $ref: '#/components/schemas/AuthoringNodePathEntry'
    AuthoringNodePathEntry:
      type: object
      description: One ancestor of a node in `path`, root first (13.1.1 §5 route 1).
      required: [node_id, kind, title]
      properties:
        node_id: { type: string, format: uuid }
        kind: { type: string, enum: [module, feature, category, sub_category] }
        title: { type: string, maxLength: 200 }
    AuthoringTreeResponse:
      type: object
      description: >-
        The 200 body of route 1: a page of nodes, plus the addressed `node` and its `path` when
        the call named `node_id` (13.1.1-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NodeDto'
        next_cursor: { type: [string, 'null'] }
        node: { oneOf: [{ $ref: '#/components/schemas/NodeDto' }, { type: 'null' }] }
        path:
          oneOf:
            [
              { type: array, items: { $ref: '#/components/schemas/NodePathEntry' } },
              { type: 'null' },
            ]
    CreateNodeRequest:
      type: object
      description: >-
        Body of route 2 (13.1.1-T2). `position` is omitted to append; the placement ladder is
        strict, so only a `module` may omit `parent_id`.
      additionalProperties: false
      required: [kind, title]
      properties:
        parent_id: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [module, feature, category, sub_category] }
        title: { type: string, minLength: 1, maxLength: 200 }
        position: { type: [integer, 'null'], minimum: 0 }
    CreateNodeResponse:
      type: object
      description: The 201 body of route 2 (13.1.1-T2).
      required: [node_id, version]
      properties:
        node_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    UpdateNodeRequest:
      type: object
      description: >-
        Body of route 3 (13.1.1-T2); an omitted member is unchanged and `parent_id: null` moves
        the node to the root level.
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 200 }
        parent_id: { type: [string, 'null'], format: uuid }
        position: { type: [integer, 'null'], minimum: 0 }
    ReorderNodesRequest:
      type: object
      description: >-
        Body of route 4 (13.1.1-T2): the complete live sibling set of the node's parent, each id
        exactly once, the addressed node included, at most 1000 ids — the same cap a create or a
        move-in meets.
      additionalProperties: false
      required: [ordered_ids]
      properties:
        ordered_ids:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    ReorderNodesResponse:
      type: object
      description: The 200 body of route 4 (13.1.1-T2); `changed` is false when the request reproduces the stored order.
      required: [changed]
      properties:
        changed: { type: boolean }
    DeleteAuthoringRequest:
      type: object
      description: >-
        The whole body of a delete route is optional (13.1.1-T2); the only member is the reason
        recorded on the `SoftDelete` version row. A reason is 1..500 code points — `maxLength`
        counts code points, so the schema, the column CHECK and the validator agree — and a
        whitespace-only reason is accepted, the rule every authoring reason follows.
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    AuthoringChangeResponse:
      type: object
      description: >-
        The 200 body of a PATCH or state route (13.1.1-T2): the version after the call and
        whether anything changed; a no-op answers the stored version with `changed: false`.
      required: [version, changed]
      properties:
        version: { type: integer, minimum: 1 }
        changed: { type: boolean }
    ChecklistItemDto:
      type: object
      description: One checklist item of the feature tree (13.1.1 §4); 13.1.1-T2.
      required: [item_id, node_id, title, description, priority, state, source, position, version]
      properties:
        item_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority: { type: string, enum: [critical, high, medium, low] }
        state: { type: string, enum: [draft, active, retired] }
        source: { type: string, enum: [manual, ai, import] }
        position: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
    ChecklistItemListResponse:
      type: object
      description: 00 §9.1 keyset page of `ChecklistItemDto`, ordered `(position, id)` (13.1.1-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItemDto'
        next_cursor: { type: [string, 'null'] }
    CreateChecklistItemRequest:
      type: object
      description: >-
        Body of route 8 (13.1.1-T2). A manual create starts `active` (§6, CR-13-1) and `source`
        is `manual`; `position` is omitted to append.
      additionalProperties: false
      required: [node_id, title, priority]
      properties:
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority: { type: string, enum: [critical, high, medium, low] }
        position: { type: [integer, 'null'], minimum: 0 }
    CreateChecklistItemResponse:
      type: object
      description: The 201 body of route 8 (13.1.1-T2).
      required: [item_id, version, state]
      properties:
        item_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        state: { type: string, enum: [draft, active, retired] }
    UpdateChecklistItemRequest:
      type: object
      description: >-
        Body of route 9 (13.1.1-T2); an omitted member is unchanged and an explicit `null`
        description clears it. `reason` is required when the move retires the item.
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        priority: { type: [string, 'null'], enum: [critical, high, medium, low, null] }
        position: { type: [integer, 'null'], minimum: 0 }
        state: { type: [string, 'null'], enum: [draft, active, retired, null] }
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    DeleteChecklistItemRequest:
      type: object
      description: The optional body of route 10; the only member is the reason on the `SoftDelete` version row (13.1.1-T2).
      additionalProperties: false
      properties:
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    ManualCaseStepDto:
      type: object
      description: >-
        One step of a manual test case, the item shape of
        `contracts/schemas/authoring-steps.v1.json` (13.1.1-T1.2), which stays the validated
        source: 1..100 steps, unknown members refused at the document level and inside a step.
      additionalProperties: false
      required: [no, action, expected]
      properties:
        no:
          {
            type: integer,
            minimum: 1,
            maximum: 1000,
            description: 'The number shown to the tester; array order is the execution order.',
          }
        action: { type: string, maxLength: 2000 }
        expected: { type: string, maxLength: 2000 }
        data: { type: [string, 'null'], maxLength: 2000 }
    ManualCaseListItemDto:
      type: object
      description: >-
        One row of the manual-case list (13.1.1-T2 + 13.1.1-T4). The list projection carries no
        `description`, `precondition` or `steps`; the two coverage members are authoring coverage —
        the live catalog cases this manual case is linked to — and are not 03.1.4's execution
        coverage.
      required:
        [
          case_id,
          code,
          checklist_item_id,
          node_id,
          title,
          priority,
          state,
          version,
          linked_live_count,
          linked_case_ids,
        ]
      properties:
        case_id: { type: string, format: uuid }
        code:
          {
            type: string,
            pattern: '^[A-Z][A-Z0-9]{1,7}-[0-9]{3,}$',
            description: 'The allocated, immutable code `<PREFIX>-<n>` (AC4).',
          }
        checklist_item_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        priority: { type: string, enum: [critical, high, medium, low] }
        state: { type: string, enum: [draft, approved, retired] }
        version: { type: integer, minimum: 1 }
        linked_live_count:
          type: integer
          minimum: 0
          description: >-
            How many of the case's links reach a catalog case that is not `archived`; the number
            the `covered` filter tests (AC12).
        linked_case_ids:
          type: array
          description: The live catalog case ids behind `linked_live_count`, ascending.
          items: { type: string, format: uuid }
    ManualCaseListResponse:
      type: object
      description: 00 §9.1 keyset page of `ManualCaseListItemDto`, ordered `(code, id)` (13.1.1-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManualCaseListItemDto'
        next_cursor: { type: [string, 'null'] }
    ManualCaseDetailDto:
      type: object
      description: >-
        The 200 body of route 14: one manual test case with its steps (13.1.1-T2). The
        `links`/coverage members belong to 13.1.1-T4 and are absent here.
      required:
        [
          case_id,
          code,
          checklist_item_id,
          node_id,
          title,
          description,
          precondition,
          steps,
          priority,
          state,
          version,
          created_at,
          updated_at,
        ]
      properties:
        case_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9]{1,7}-[0-9]{3,}$' }
        checklist_item_id: { type: string, format: uuid }
        node_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        precondition: { type: [string, 'null'], maxLength: 4000 }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ManualCaseStepDto'
        priority: { type: string, enum: [critical, high, medium, low] }
        state: { type: string, enum: [draft, approved, retired] }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateManualCaseRequest:
      type: object
      description: >-
        Body of route 13 (13.1.1-T2). `steps` is validated against
        `contracts/schemas/authoring-steps.v1.json`; `code` is server-allocated and must not be
        sent.
      additionalProperties: false
      required: [checklist_item_id, title, steps, priority]
      properties:
        checklist_item_id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        precondition: { type: [string, 'null'], maxLength: 4000 }
        steps:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ManualCaseStepDto'
        priority: { type: string, enum: [critical, high, medium, low] }
    CreateManualCaseResponse:
      type: object
      description: "The 201 body of route 13: the new case's id, its allocated code and its first version (13.1.1-T2)."
      required: [case_id, code, version]
      properties:
        case_id: { type: string, format: uuid }
        code: { type: string, pattern: '^[A-Z][A-Z0-9]{1,7}-[0-9]{3,}$' }
        version: { type: integer, minimum: 1 }
    UpdateManualCaseRequest:
      type: object
      description: >-
        Body of route 15 (13.1.1-T2). An absent member is unchanged, an explicit `null`
        description or precondition clears it, and `code` / `checklist_item_id` are not members
        at all (a move is route 19).
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], minLength: 1, maxLength: 500 }
        description: { type: [string, 'null'], maxLength: 4000 }
        precondition: { type: [string, 'null'], maxLength: 4000 }
        steps:
          oneOf:
            [
              {
                type: array,
                minItems: 1,
                maxItems: 100,
                items: { $ref: '#/components/schemas/ManualCaseStepDto' },
              },
              { type: 'null' },
            ]
        priority: { type: [string, 'null'], enum: [critical, high, medium, low, null] }
    SetManualCaseStateRequest:
      type: object
      description: Body of route 17 (13.1.1-T2); `reason` is required when the target state is `retired`.
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [draft, approved, retired] }
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    SetManualCaseStateResponse:
      type: object
      description: 'The 200 body of route 17: the state the case is in now and its version (13.1.1-T2).'
      required: [state, version]
      properties:
        state: { type: string, enum: [draft, approved, retired] }
        version: { type: integer, minimum: 1 }
    MoveManualCaseRequest:
      type: object
      description: 'Body of route 19 (13.1.1-T2): the checklist item the case moves under.'
      additionalProperties: false
      required: [checklist_item_id]
      properties:
        checklist_item_id: { type: string, format: uuid }
        reason: { type: [string, 'null'], minLength: 1, maxLength: 500 }
    MoveManualCaseResponse:
      type: object
      description: "The 200 body of route 19: the case's version and its new checklist item (13.1.1-T2)."
      required: [version, checklist_item_id]
      properties:
        version: { type: integer, minimum: 1 }
        checklist_item_id: { type: string, format: uuid }
    LinkManualCaseRequest:
      type: object
      description: >-
        Body of route 20 (13.1.1-T4): the catalog case this manual case is asserted to be proven by.
        The case must be live and in the same project; an archived one is 422 `request_invalid` with
        `details[].path = /test_case_id` and `reason = case_archived`, an unknown or other-project
        one the same 422 with `reason = case_not_found`.
      additionalProperties: false
      required: [test_case_id]
      properties:
        test_case_id: { type: string, format: uuid }
    LinkManualCaseResponse:
      type: object
      description: >-
        The answer of route 20 in both outcomes (13.1.1-T4): 201 with the new `link_id` when the link
        was created (`changed: true`), 200 with `link_id: null` and `changed: false` when the case
        already held it — a repeat writes nothing and appends no audit row.
      required: [link_id, changed]
      properties:
        link_id: { type: [string, 'null'], format: uuid }
        changed: { type: boolean }
    InviteTokenRequest:
      type: object
      description: >-
        Body of `POST /v1/auth/invite-token` (02.3.1-T2 Q1): the token the invite link carried,
        presented once and staged in the `__Host-evidgate_invite` cookie. The member is treated as
        required — an absent or non-string value is 422 `request_invalid` with
        `details[].path` = `invite_token` — so a client always sends it. A member this schema does
        not declare is ignored, not refused: the route binds with a snake_case
        `JsonSerializerOptions` and no strict-member check, exactly like `CiTokenRequest`.
      required: [invite_token]
      properties:
        invite_token:
          type: string
          maxLength: 80
          pattern: '^evgi_[A-Za-z0-9]{12}_[A-Za-z0-9_-]{43}$'
          description: >-
            `evgi_<12-char prefix>_<43-char base64url secret>`, exactly as minted by `POST
            /v1/orgs/{o}/memberships` or its `resend` route (`InviteTokenFormat`). Only the shape is
            checked here: whether the token exists, has expired or belongs to another org is decided
            by the binder at login, and is never answered by this route.
    DevSessionRequest:
      type: object
      description: >-
        Body of `POST /dev/session` (S187), the development-only sign-in: the deployment's dev-login
        secret and nothing else. There is deliberately no user id, email or org member — the session
        always belongs to the seeded dev account — so this route can never sign a caller in as
        anyone else. An absent or `null` `secret` is treated as a wrong one (401 `token_invalid`,
        the same answer a mismatch gets, so the route is not an oracle); a non-string value is 422
        `request_invalid` with `details[].path` = `secret`.
      required: [secret]
      properties:
        secret:
          type: string
          maxLength: 512
          description: >-
            The value of `EVIDGATE__DEVLOGIN__SECRET` for this deployment. Compared in constant time
            against SHA-256 digests of both sides; never logged, echoed or stored.
    LinkStartRequest:
      type: object
      description: >-
        Body of `POST /v1/auth/link/{provider}` (02.3.1-T2 Q4), optional: an empty or absent body
        lands on the app root after the link. A member this schema does not declare is ignored, not
        refused: the route binds with a snake_case `JsonSerializerOptions` and no strict-member check,
        exactly like `CiTokenRequest`.
      properties:
        return_url:
          type: [string, 'null']
          maxLength: 512
          description: >-
            Where the app should land after the link, as a same-origin path, allowlisted by
            `ReturnUrlPolicy` exactly like `GET /v1/auth/oidc/{provider}/start`'s `returnUrl`: one
            leading `/`, no backslash or control character, at most 512 characters, re-checked
            through up to four percent-decoding passes. Any other value is replaced by `/` and is not
            an error.
    LinkStartResponse:
      type: object
      description: >-
        The 200 body of `POST /v1/auth/link/{provider}`: the provider's authorization URL, built by
        the same helper as the sign-in route (state, nonce and PKCE S256 challenge included).
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
          format: uri
          description: >-
            Absolute `https` authorization URL of the provider the browser is sent to next. It is
            public by construction: it carries no token, subject or email.
    LinkPendingResponse:
      type: object
      description: >-
        The 200 body of `GET /v1/auth/link/pending` (02.3.1-T2 Q4): the identity this browser staged
        and has not confirmed — the caller's own, taken from `__Host-evidgate_link`.
      required: [provider, email, expires_at]
      properties:
        provider:
          type: string
          enum: [google, github]
          description: The provider that verified the identity.
        email:
          type: string
          format: email
          description: >-
            The address that provider verified and returned for this identity. Personal data, which
            is why every response of the route carries `Cache-Control: no-store`.
        display_name:
          type: [string, 'null']
          description: The provider's profile name, or null when it returned none.
        expires_at:
          type: string
          format: date-time
          description: >-
            When the staged link stops being confirmable: ten minutes after the callback staged it
            (a constant of the contract, not a configuration key).
    LinkConfirmResponse:
      type: object
      description: >-
        The 200 body of `POST /v1/auth/link/confirm` (02.3.1-T2 Q4): the provider the identity was
        attached by, and what happened to it.
      required: [provider, outcome]
      properties:
        provider:
          type: string
          enum: [google, github]
        outcome:
          type: string
          enum: [linked, already_linked, moved]
          description: >-
            `linked` — a new identity row; `already_linked` — this account already held it (the
            answer a retry after a failed audit converges on); `moved` — it was taken from an
            account that is no longer in use, and `auth.link_move` records where from.
    SessionView:
      type: object
      description: >-
        One live session of the caller (02.3.2-T2.1), body of `GET /v1/auth/sessions`. Owner-visible personal data
        only: the row's id is the handle `DELETE /v1/auth/sessions/{s}` takes, and no cookie value, HMAC, pepper
        version or other secret is ever a member.
      required: [id, current, created_at, last_seen_at, expires_at, absolute_expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: The session row's id (the handle of the revoke route).
        current:
          type: boolean
          description: True for the session that answered the list request.
        created_at:
          type: string
          format: date-time
          description: When the session was minted (login or rotation).
        last_seen_at:
          type: string
          format: date-time
          description: >-
            The last activity the slide wrote. Because the slide is throttled to one update per 60 seconds, this
            can trail the true last request by up to a minute (AC2 trade-off).
        expires_at:
          type: string
          format: date-time
          description: The idle deadline; activity slides it but never past `absolute_expires_at`.
        absolute_expires_at:
          type: string
          format: date-time
          description: The hard deadline no activity extends.
        ip:
          type: [string, 'null']
          description: >-
            The client address the session was minted from, as PostgreSQL's `inet` renders it; `null` when the
            deployment did not record one.
        user_agent:
          type: [string, 'null']
          maxLength: 512
          description: The bounded (≤ 512 characters) user-agent string the session was minted with, or `null`.
    SessionListResponse:
      type: object
      description: >-
        Body of `GET /v1/auth/sessions` (02.3.2-T2.1): the caller's live sessions, newest first. Bounded by the
        account itself, so there is no cursor (the `GET /v1/orgs` form rather than a `CursorList`).
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionView'
    RevokeAllSessionsRequest:
      type: object
      description: >-
        Optional body of `POST /v1/auth/sessions/revoke-all` (02.3.2-T2.1). An absent or empty body is the
        default: `keep_current: true`.
      properties:
        keep_current:
          type: boolean
          default: true
          description: >-
            `true` (default) revokes every other session and keeps the caller's; `false` revokes the current row
            too and the answer expires the session and antiforgery cookies, exactly like `POST /v1/auth/logout`.
    UserProfileDto:
      type: object
      description: >-
        The signed-in account's own profile (02.3.1-T3), as `GET /v1/me` and both answers of `PATCH /v1/me`
        carry it. Only the account's own values are ever in it: the row is resolved from the session, so no
        field here can describe another user. The row's `version` is NOT a member — it travels as the response's
        `ETag` and comes back as `If-Match`, so a client cannot believe it wrote with a version it never read.
      required: [id, email, display_name, preferred_locale]
      properties:
        id:
          type: string
          format: uuid
          description: The account's user id — the row itself, never a value the caller sent.
        email:
          type: string
          format: email
          description: The provider-verified address on the account, as the provider gave it.
        display_name:
          type: [string, 'null']
          description: The provider profile name, or `null` when the provider supplied none.
        preferred_locale:
          type: [string, 'null']
          enum: [vi, en, null]
          description: >-
            The chosen language, or `null` until the account has chosen one. The only member `PATCH /v1/me`
            writes; the column's check constraint carries the same two values.
    UpdateUserProfileRequest:
      type: object
      description: >-
        Body of `PATCH /v1/me` (02.3.1-T3). Exactly one member: any other name is 422 `field_not_patchable` with
        the member (at most 64 characters of it) named in `error.details`, even when a valid locale travels
        beside it; the same name sent twice is 422 `request_invalid` with `duplicate`, judged before any value;
        and an empty, non-JSON or non-object body — or a body that is not `application/json` — is 422
        `request_invalid` with the body itself in `error.details`.
      required: [preferred_locale]
      additionalProperties: false
      properties:
        preferred_locale:
          type: string
          enum: [vi, en]
          description: The language to store. Anything else is 422 `locale_invalid`.
    AuthoringVersionListItemDto:
      type: object
      description: >-
        One row of the version timeline (13.1.1 §5 route 22, AC9): the entity, the change kind, the
        source, the content digest and who wrote it. The list projection carries no `content`.
      required:
        [
          version_id,
          entity_kind,
          entity_id,
          version_no,
          batch_id,
          change_kind,
          source,
          content_hash,
          author,
          reason,
          ai_run_id,
          created_at,
        ]
      properties:
        version_id: { type: string, format: uuid }
        entity_kind:
          {
            type: string,
            enum: [feature_node, checklist_item, manual_test_case],
            description: 'The entity the version describes (13.1.1 §4).',
          }
        entity_id: { type: string, format: uuid }
        version_no:
          {
            type: integer,
            minimum: 1,
            description: "The entity's version number at the time of the change (AC5/AC8).",
          }
        batch_id:
          {
            type: string,
            format: uuid,
            description: 'The change this row belongs to; one batch is one version in the UI.',
          }
        change_kind: { type: string, enum: [create, update, delete, restore, import] }
        source: { type: string, enum: [manual, ai, import] }
        content_hash:
          {
            type: string,
            pattern: '^sha256:[0-9a-f]{64}$',
            description: 'The digest of the stored content, also the ETag of route 23.',
          }
        author:
          {
            type: [string, 'null'],
            format: uuid,
            description: 'The authoring membership that wrote the change, or null (an import or an AI run).',
          }
        reason: { type: [string, 'null'], maxLength: 500 }
        ai_run_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    AuthoringVersionListResponse:
      type: object
      description: >-
        00 §9.1 keyset page of `AuthoringVersionListItemDto`, ordered `(created_at desc, id desc)`
        (13.1.1 §5 route 22).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuthoringVersionListItemDto'
        next_cursor: { type: [string, 'null'] }
    AuthoringVersionDetailDto:
      type: object
      description: >-
        The 200 body of route 23 (13.1.1-T3): the twelve row members of route 22 plus `content`, the
        stored document verbatim. The response's `ETag` is `content_hash` in quotes.
      required:
        [
          version_id,
          entity_kind,
          entity_id,
          version_no,
          batch_id,
          change_kind,
          source,
          content_hash,
          author,
          reason,
          ai_run_id,
          created_at,
          content,
        ]
      properties:
        version_id: { type: string, format: uuid }
        entity_kind: { type: string, enum: [feature_node, checklist_item, manual_test_case] }
        entity_id: { type: string, format: uuid }
        version_no: { type: integer, minimum: 1 }
        batch_id: { type: string, format: uuid }
        change_kind: { type: string, enum: [create, update, delete, restore, import] }
        source: { type: string, enum: [manual, ai, import] }
        content_hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        author: { type: [string, 'null'], format: uuid }
        reason: { type: [string, 'null'], maxLength: 500 }
        ai_run_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        content:
          type: object
          additionalProperties: true
          description: >-
            The stored snapshot exactly as the writer hashed it — one of the three entity content
            shapes of 13.1.1 §4 — never re-serialised through a typed model.
    AuthoringRestoreResponse:
      type: object
      description: >-
        The 200 body of the four restore routes (13.1.1 §5 routes 6, 11, 18 and 24): the entity's
        `version` after the call, which is the tag the next write must present (AC8/AC19).
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    ImportResponse:
      type: object
      description: >-
        The 200 body of the import route (13.1.1 §5 route 25, AC13/AC15): one `batch_id` for every
        `authoring_version` row the file wrote, the per-outcome totals and one row report per input
        row in file order. `batch_id` is null on a dry run and on a file whose every row is
        unchanged; no cell text travels back.
      required: [batch_id, counts, rows]
      properties:
        batch_id: { type: [string, 'null'], format: uuid }
        counts:
          $ref: '#/components/schemas/ImportCountsDto'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowDto'
    ImportCountsDto:
      type: object
      description: The per-outcome totals of one import (13.1.1 AC13/AC15).
      required: [created, updated, restored, unchanged]
      properties:
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        restored: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
    ImportRowDto:
      type: object
      description: >-
        One row of the import report: the row's 1-based position, its file-local key, its kind and
        its outcome — never its text (S3).
      required: [index, key, kind, outcome, code]
      properties:
        index: { type: integer, minimum: 1 }
        key: { type: string, minLength: 1, maxLength: 64 }
        kind: { type: string, enum: [node, item, case] }
        outcome: { type: string, enum: [create, update, restore, unchanged] }
        code: { type: [string, 'null'] }
    AiSettingsTemplateRef:
      type: object
      description: >-
        Provenance of the copy a settings document started from (13.2.1-T1): the template's
        `code` and `version`. A soft pair on purpose — templates are immutable platform rows, so
        a code plus version never changes meaning, and a later revision cannot rewrite a saved
        settings row.
      additionalProperties: false
      required: [code, version]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
        version:
          type: integer
          minimum: 1
    AiSettingsDocument:
      description: >-
        The guidance document of one project. The external JSON Schema remains the single source of the wire shape and
        of the runtime validation; the second branch only names the `priority_criteria` member's own schema, which the
        served document carries as a separate component (01.3.2-T3.2 AC4), and adds no constraint the external file
        does not already state.
      allOf:
        - $ref: './schemas/ai-settings.v1.json'
        - type: object
          properties:
            priority_criteria:
              $ref: '#/components/schemas/AiSettingsPriorityCriteria'
    AiSettingsPriorityCriteria:
      description: >-
        One criterion per checklist priority level, so the same word means the same thing in every item of the
        project. This component is an alias, not a second definition: it points at the member of
        `contracts/schemas/ai-settings.v1.json`, which stays the single source of the wire shape, of the limits and of
        the runtime validation. The name exists because the served document carries the nested member type as its own
        schema, and every served schema name must exist here (01.3.2-T3.2 AC4).
      $ref: './schemas/ai-settings.v1.json#/properties/priority_criteria'
    AiSettingsView:
      type: object
      description: >-
        The 200/201 body of the settings read and save routes (13.2.1-T1): the effective document
        with its version, origin and provenance. Before the first save the answer is the platform
        default template's document with `version_no` 0, `source` `default_template`,
        `settings_id` and `created_at` null, and `ETag: "0"`; version 0 is never a stored row.
      additionalProperties: false
      required:
        [
          version_no,
          source,
          settings_id,
          content_hash,
          settings,
          template,
          author,
          reason,
          created_at,
        ]
      properties:
        version_no:
          type: integer
          minimum: 0
          description: The stored head version, or 0 when the default template is being served.
        source:
          type: string
          enum: [saved, default_template]
        settings_id:
          type: [string, 'null']
          format: uuid
          description: The `project_ai_settings` row id, null for the virtual default-template state.
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: '`sha256:` over the RFC 8785 canonical settings document.'
        settings:
          $ref: '#/components/schemas/AiSettingsDocument'
        template:
          anyOf:
            - $ref: '#/components/schemas/AiSettingsTemplateRef'
            - type: 'null'
        author:
          type: [string, 'null']
          format: uuid
          description: The membership that saved the head version, null for the default-template state.
        reason:
          type: [string, 'null']
          maxLength: 500
        created_at:
          type: [string, 'null']
          format: date-time
    SaveAiSettingsRequest:
      type: object
      description: >-
        Body of the settings save (13.2.1-T1). `settings` is the whole document and is validated
        against `contracts/schemas/ai-settings.v1.json`; `template` records provenance only and
        never has to match the document (an edited copy is the normal case); `reason` is shown in
        the version timeline and never carries the field text into an audit row.
      additionalProperties: false
      required: [settings]
      properties:
        settings:
          $ref: '#/components/schemas/AiSettingsDocument'
        template:
          $ref: '#/components/schemas/AiSettingsTemplateRef'
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AiSettingsVersionSummary:
      type: object
      description: >-
        One row of the settings version timeline (13.2.1-T1): the version, its content digest,
        the template pair it was copied from, who saved it and why. The document is read
        separately from the version detail route, so the list stays small enough to page.
      additionalProperties: false
      required: [version_no, content_hash, template, author_membership_id, reason, created_at]
      properties:
        version_no:
          type: integer
          minimum: 1
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        template:
          anyOf:
            - $ref: '#/components/schemas/AiSettingsTemplateRef'
            - type: 'null'
        author_membership_id:
          type: string
          format: uuid
        reason:
          type: [string, 'null']
          maxLength: 500
        created_at:
          type: string
          format: date-time
    AiSettingsVersionListResponse:
      type: object
      description: >-
        00 §9.1 keyset page of `AiSettingsVersionSummary`, ordered `version_no desc` on
        `project_ai_settings_head_idx` (13.2.1-T1). The order is the chain's own key, so the
        versions of one project read highest first and the cursor is the version number the
        page stopped at. A project with no saved version answers an empty page, never the
        default template.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiSettingsVersionSummary'
        next_cursor:
          type: [string, 'null']
    AiSettingsVersion:
      type: object
      description: >-
        The 200 body of the settings version detail route (13.2.1-T1): the timeline row plus
        `settings`, the stored document exactly as the writer hashed it. The response's `ETag` is
        `version_no` in quotes and never changes, because a version is immutable.
      additionalProperties: false
      required:
        [
          version_no,
          settings_id,
          content_hash,
          template,
          author_membership_id,
          reason,
          created_at,
          settings,
        ]
      properties:
        version_no:
          type: integer
          minimum: 1
        settings_id:
          type: string
          format: uuid
          description: The `project_ai_settings` row id, so a pinned generation's reference is complete.
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        template:
          anyOf:
            - $ref: '#/components/schemas/AiSettingsTemplateRef'
            - type: 'null'
        author_membership_id:
          type: string
          format: uuid
        reason:
          type: [string, 'null']
          maxLength: 500
        created_at:
          type: string
          format: date-time
        settings:
          $ref: '#/components/schemas/AiSettingsDocument'
    AiSettingsTemplateView:
      type: object
      description: >-
        One built-in template (13.2.1-T1): the locale of its own guidance copy — independent of
        the document's `languages`, which is the output language of generated cases — and the
        document it pre-fills. `content_hash` is the hash the default settings reference carries
        when this template is the platform default.
      additionalProperties: false
      required: [code, version, locale, name, is_default, content_hash, settings]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_-]{1,31}$'
        version:
          type: integer
          minimum: 1
        locale:
          type: string
          enum: [vi, en]
        name:
          type: string
          minLength: 1
          maxLength: 120
        is_default:
          type: boolean
          description: Exactly one template per locale is the locale's default; the server's own default is the `en` one.
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        settings:
          $ref: '#/components/schemas/AiSettingsDocument'
    AiSettingsTemplateListResponse:
      type: object
      description: >-
        The template catalogue (13.2.1-T1): at least one template per locale, exactly one
        `is_default` per locale, and `next_cursor` always null because the list is closed.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AiSettingsTemplateView'
        next_cursor:
          type: 'null'

security:
  - sessionCookie: []
  - bearerToken: []
