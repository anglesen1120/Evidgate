components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-evidgate
      description: '`__Host-` httpOnly, Secure, SameSite=Lax browser session cookie (00 §9.1).'
    bearerToken:
      type: http
      scheme: bearer
      description: 'CLI/agent bearer tokens — `ci_producer`, ingest, personal (00 §9.1; T38: never cookie-authenticated).'
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC signature on inbound GitHub webhook deliveries (00 §9.3).
  parameters:
    AuditExportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
    AuditActorType:
      name: actor_type
      in: query
      required: false
      schema:
        type: string
        enum: [user, ci_producer, agent, platform_operator, system]
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    AuditObjectType:
      name: object_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(created_at, id)` (00 §9.1).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied, ≤ 128 chars, unique per `(org_id, project_id, operation)` ≥ 24 h (00 §7/§9.1).
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag for optimistic concurrency; stale → 412 (00 §9.1).
      schema:
        type: string
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        Required whenever the caller is cookie-authenticated (00 §9.1, T38);
        bearer-only callers omit it. 403 `csrf_failed` on mismatch.
      schema:
        type: string
    OrgId:
      name: o
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: m
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: p
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: a
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentSlug:
      name: e
      in: path
      required: true
      schema:
        type: string
    SupportGrantId:
      name: g
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteId:
      name: s
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteRevisionId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: d
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: i
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: j
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Server request id; echoed in `error.request_id` (00 §9.1/§9.2).
      schema:
        type: string
    RetryAfter:
      description: Seconds (or HTTP-date) to wait before retrying (00 §9.2).
      schema:
        type: string
    ETag:
      description: The row's `version`, quoted; send it back in `If-Match` (00 §9.1).
      schema:
        type: string
  responses:
    Unauthorized:
      description: 401 unauthenticated (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '403 forbidden — includes token-scope mismatch and `csrf_failed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 not found — also for other-tenant ids (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: '409 conflict — e.g. `idempotency_conflict`, `run_closed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: 412 precondition failed — stale ETag; current revision id in `error.details` (00 §9.1/§9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: 413 too large (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 422 schema/manifest invalid — per-item causes in `error.details[]` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '429 — `rate_limited` (bursts) or `quota_exceeded` (tenant/project limit); always `Retry-After` (00 §9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 503 unavailable — always `Retry-After` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: 00 §9.2 error envelope; `details` never contains secrets.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  index:
                    type: integer
                  path:
                    type: string
                  reason:
                    type: string
    CursorList:
      type: object
      description: 00 §9.1 cursor list envelope; `next_cursor` is null when the page is last.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: [string, 'null']
    RunSummary:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        parent_run_id:
          type: [string, 'null']
          format: uuid
        rerun_label:
          type: [string, 'null']
        reprocess_label:
          type: [string, 'null']
    Decision:
      type: object
      description: Evaluation decision or `pending` (00 §8.5/§9.3); `decision` values are upper case (00 §7).
      properties:
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        evaluation_revision:
          type: string
        reasons:
          type: array
          items:
            type: string
    EventBatch:
      type: object
      description: >-
        Inline mirror of `contracts/schemas/event-envelope.v1.json` (00 §9.4);
        the schema file is authoritative.
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: './schemas/event-envelope.v1.json#/$defs/event'
      x-max-bytes: 1048576
    PermissionView:
      type: object
      description: >-
        One entry of the permission catalogue (00 §2). The catalogue holds no
        secrets: `sensitive` describes the permission, it is never a value.
      required: [code, resource, action, description, sensitive, reserved, tenant_assignable]
      properties:
        code:
          type: string
          pattern: '^[a-z_]+:[a-z_]+$'
          description: The `resource:action` string — the catalogue's identity.
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        sensitive:
          type: boolean
          description: True when the permission gates secret-adjacent data (AC5).
        reserved:
          type: boolean
          description: True when the string has no V1 consumer yet (AC2).
        tenant_assignable:
          type: boolean
          description: False for a code a member principal must never hold (T79).
    PermissionListResponse:
      type: object
      description: 00 §9.1 cursor page of `PermissionView`, ordered by `code`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionView'
        next_cursor:
          type: [string, 'null']
          description: The last code of the page when a further page exists, else null.
    RoleView:
      type: object
      description: One role — a built-in (`org_id` null) or the caller's own org row (02 §4.5).
      required: [id, code, name, is_builtin, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: [string, 'null']
          format: uuid
          description: Null for a built-in role, the owning org for a custom role.
        code:
          type: string
        name:
          type: string
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        version:
          type: integer
    RoleListResponse:
      type: object
      description: 00 §9.1 cursor page of `RoleView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CreateRoleRequest:
      type: object
      description: Body of `POST /v1/roles` (02.2.1 §5). V1 answers 403 until the custom-role flag is on.
      required: [code, name, permissions]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Role code; unique per org → 409 `role_code_taken`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: array
          description: Catalogue codes to grant; unknown → 422 `unknown_permission`, non-assignable → 422 `permission_not_assignable` (T79).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    UpdateRoleRequest:
      type: object
      description: Body of `PATCH /v1/roles/{r}` (02.2.1 §5). Both fields optional; a built-in role is 409 `builtin_role_immutable`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        add_permissions:
          type: array
          description: >-
            Catalogue codes granted in addition to the role's current set. Additive only:
            migration 0010 revokes `DELETE` on `role_permission` for the app role, so V1 cannot
            shrink a role's grant set (02.2.1 §3).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    OrganizationDto:
      type: object
      description: >-
        One organization (02.1.1 §4). `organization` is the T4 exception: its own `id` is
        the tenant key. Limit columns are null when no limit is set (02.1.1-T3).
      required:
        [
          id,
          name,
          slug,
          status,
          retention_default_days,
          allowed_email_domains,
          created_at,
          updated_at,
          version,
          max_projects,
          max_seats,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Globally unique (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        retention_default_days:
          type: [integer, 'null']
        allowed_email_domains:
          type: [array, 'null']
          maxItems: 64
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        max_projects:
          type: [integer, 'null']
          description: Projects that are not `deleted` the org may hold; null = no limit.
        max_seats:
          type: [integer, 'null']
          description: Active memberships the org may hold; null = no limit (enforced by plan 12).
    ProjectDto:
      type: object
      description: One project (02.1.1 §4); `unique (org_id, slug)`.
      required:
        [
          id,
          org_id,
          name,
          slug,
          status,
          default_environment_id,
          created_at,
          updated_at,
          version,
          retention_days,
          monthly_run_quota,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Unique within the org (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        default_environment_id:
          type: [string, 'null']
          format: uuid
          description: Null until 05.1.2-T1 adds the environment table.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        retention_days:
          type: [integer, 'null']
          description: Overrides the org's `retention_default_days`; null = inherit.
        monthly_run_quota:
          type: [integer, 'null']
          description: Runs per calendar month; null = no limit (enforced by plan 12).
    ProjectListResponse:
      type: object
      description: 00 §9.1 cursor page of `ProjectDto`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDto'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    AuditEntryDto:
      type: object
      description: One audit event with its place in the org's hash chain; hashes are lowercase hex.
      required: [id, seq, actor_type, actor_id, action, prev_hash, entry_hash, created_at]
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        actor_type:
          type: string
          enum: [user, ci_producer, agent, platform_operator, system]
        actor_id:
          type: string
        action:
          type: string
        object_type:
          type: [string, 'null']
        object_id:
          type: [string, 'null']
        before_hash:
          type: [string, 'null']
        after_hash:
          type: [string, 'null']
        request_id:
          type: [string, 'null']
        trace_id:
          type: [string, 'null']
        metadata:
          type: [object, 'null']
          additionalProperties:
            type: string
        prev_hash:
          type: string
        entry_hash:
          type: string
        created_at:
          type: string
          format: date-time
    AuditListResponse:
      type: object
      description: 00 §9.1 cursor page of `AuditEntryDto`, newest first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntryDto'
        next_cursor:
          type: [string, 'null']
    OrganizationSummaryDto:
      type: object
      description: One organization in `GET /v1/orgs`.
      required: [id, slug, name, status]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, suspended]
    OrganizationListResponse:
      type: object
      description: Body of `GET /v1/orgs`; bounded by the resolver, so no cursor.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationSummaryDto'
    CreateOrganizationRequest:
      type: object
      description: Body of `POST /v1/orgs` (02.1.1 §5).
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
    UpdateOrganizationRequest:
      type: object
      description: Body of `PATCH /v1/orgs/{o}` (02.1.1 §5); an omitted field is unchanged.
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
        retention_default_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
        allowed_email_domains:
          type: [array, 'null']
          maxItems: 64
          items:
            type: string
            maxLength: 253
    CreateProjectRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/projects` (02.1.1 §5).
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
    UpdateProjectRequest:
      type: object
      description: Body of `PATCH /v1/projects/{p}` (02.1.1 §5); an omitted field is unchanged.
      properties:
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
        retention_days:
          type: [integer, 'null']
          minimum: 1
          maximum: 3650
    MembershipView:
      type: object
      description: One membership of an org (02.1.2 §4) with the roles it currently holds.
      required: [id, org_id, invited_email, status, roles, created_at, updated_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        user_id:
          type: [string, 'null']
          format: uuid
          description: Null while the invite is `pending`; set when a login binds it (02.3.1-T2).
        invited_email:
          type: string
          description: The normalised invite address (trimmed, lowercased). Personal data (02.1.2 §8).
        status:
          type: string
          enum: [pending, active, removed, revoked, expired]
        roles:
          type: array
          description: The role set of 02.1.2 §6 — built-in catalogue roles plus the org's own.
          items:
            $ref: '#/components/schemas/RoleView'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
    MembershipListResponse:
      type: object
      description: 00 §9.1 cursor page of `MembershipView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MembershipView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    InviteMemberRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/memberships` (02.1.2 §5) — invite by address, optionally with initial roles.
      required: [email]
      properties:
        email:
          type: string
          maxLength: 320
          description: The invited address; normalised (trimmed, lowercased) before it is stored or compared.
        roles:
          type: array
          description: Role ids the membership starts with; each must be built-in or the caller's own org role (else 409 `unknown_role`).
          items:
            type: string
            format: uuid
    UpdateMembershipRequest:
      type: object
      description: Body of `PATCH /v1/orgs/{o}/memberships/{m}` (02.1.2 §5). `If-Match` carries the row's `version`; stale → 412.
      required: [status]
      properties:
        status:
          type: string
          enum: [removed]
          description: >-
            Only `removed` — the admin disable path (AC3). Activating a pending invite is the
            invite-binding flow of 02.1.2-T2 (T75), never a client-set status.
    GrantRoleRequest:
      type: object
      description: Body of `POST /v1/orgs/{o}/memberships/{m}/roles` (02.1.2 §5) — grant one role to one membership.
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
          description: A built-in catalogue role or one of the caller's own org roles (else 409 `unknown_role`).
security:
  - sessionCookie: []
  - bearerToken: []
