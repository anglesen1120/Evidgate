        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Run state + current evidence revision
      description: >-
        One run's state machine position (05.3.1 AC7): `state` (00 §8.1),
        `current_evidence_revision_id` (null until 05.3.2 freezes a revision),
        `version` (the optimistic-concurrency token a transition echoes in
        `If-Match`) and `purpose` (`regular`/`replay`, T67). The identity block
        `ref` (branch/tag/PR, 05.2.2-T1) is returned with all members present,
        `null` where unknown, plus `unverified_ref` (`true` when any stored
        identity value came from the request body rather than a verified CI
        claim). Since F44 (S143) the same body pins the manifest and its
        release inputs, every member required: `manifest_hash` (joined from
        `manifest` through `run.manifest_id`), `suite_revision_id` and
        `policy_revision_id` (`policy_revision_id` is `null` until a revision
        is pinned), `environment` (the pinned environment revision's identity,
        joined from `environment_revision` + `environment` through
        `run.environment_revision_id`), and `shard_count` plus
        `declared_producers` (the run's `producer_slot` rows in `shard_index`
        order, `shard-<n>`). Evidence `completeness`/`missing[]` are a later,
        separate read (09.3.1-T3 with 07.5.2). Another tenant's run —
        or, for a project-scoped credential, another project's — is 404, the same
        `not_found` body as an unknown id.
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run state, current evidence revision, version, purpose and manifest identity
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunStateDto'
        '401':
