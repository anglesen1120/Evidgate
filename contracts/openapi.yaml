          activated_at,
          previous_policy_revision_id,
          changed,
        ]
      properties:
        project_id: { type: string, format: uuid }
        policy_revision_id: { type: string, format: uuid }
        hash: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
        mode: { type: string, enum: [advisory, enforcing] }
        activated_by: { type: string, format: uuid }
