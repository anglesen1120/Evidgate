  /healing/candidates/{c}/reject:
    post:
      operationId: rejectHealingCandidate
      tags: [healing]
      summary: Reject a healing candidate (V2); reason required; audited (08)
      x-permission: healing:approve
      x-version: v2
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
