openapi: 3.1.0
info:
  title: Evidgate API
  version: 1.0.0
  description: >-
    Evidgate public API (00 §9). REST + JSON under `/v1`. Conventions:
    every response carries `X-Request-Id` and echoes it in `error.request_id`;
    a W3C `traceparent` header is accepted on every operation. Cursor
    pagination is `?cursor=&limit=` (default 50, max 200), response
    `{ "items": [], "next_cursor": null }`, ordering `(created_at, id)`.
    Cookie-authenticated mutations require `X-XSRF-TOKEN` (00 §9.1, T38);
    bearer-only routes never carry it. Mutations that create resources or
    side effects require `Idempotency-Key` unless exempted in
    contracts/README.md. Optimistic concurrency uses `ETag`/`If-Match`
    (stale → 412). Error envelope is 00 §9.2 (`ErrorEnvelope`); 429/503
    carry `Retry-After`. Operational routes (`/internal/*`, `/metrics`) are
    intentionally absent — they never appear in this spec (00 §9.1).
  contact:
    name: Evidgate team
  license:
    name: Proprietary
servers:
  - url: /v1
    description: API version 1 (stub operations also document V2-tagged routes via `x-version`)
tags:
  - name: ci
    description: CI entry points (token exchange)
  - name: runs
    description: Runs, manifests, finalize and control actions
  - name: events
    description: Event batch ingest
  - name: artifacts
    description: Artifact upload and download
  - name: decisions
    description: Run and release decisions
  - name: environments
    description: Immutable environment revisions
  - name: reports
    description: Raw-report comparisons
  - name: releases
    description: Releases and release-run binding
  - name: identity
    description: Orgs, projects, memberships (02)
  - name: ci-admin
    description: CI bindings and ingest tokens (02)
  - name: audit
    description: Tenant-visible audit log (02, 11)
  - name: support
    description: Support grants (02)
  - name: security
    description: Security events (11)
  - name: catalog
    description: Case catalog and suite versioning (03)
  - name: webhooks
    description: Inbound provider webhooks (03)
  - name: drafts
    description: Authoring drafts, dry run and pull request (03, V2)
  - name: healing
    description: Incidents, candidates, switch (08)
  - name: usage
    description: Usage summary and ledger (12)
  - name: jobs
    description: Runner job claim and heartbeat (V2, 04/05)
paths:
  /ci/token:
    post:
      operationId: exchangeCiToken
      tags: [ci]
      summary: Exchange a GitHub OIDC JWT or project ingest token for a `ci_producer` token
      description: >-
        Issues a short-lived `ci_producer` token scoped to one project (00 §9.3, 02).
        Not a permission-checked route: `x-permission: none`; the credential is the
        presented token (`x-auth`). Idempotency-Key exempt (stateless exchange, README).
      x-permission: none
      x-auth: github_oidc_jwt_or_ingest_token
      x-version: v1
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential, project_id]
              properties:
                credential:
                  type: string
                  description: GitHub OIDC JWT or project ingest token
                project_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Short-lived `ci_producer` token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/manifests:
    post:
      operationId: createManifest
      tags: [runs]
      summary: Upload and verify a run manifest
      description: >-
        Uploads + verifies the manifest and returns `manifest_id` and
        `manifest_hash` (00 §9.3).
      x-permission: run:create
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestUpload'
      responses:
        '201':
          description: Manifest accepted
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [manifest_id, manifest_hash]
                properties:
                  manifest_id:
                    type: string
                    format: uuid
                  manifest_hash:
                    type: string
                    pattern: '^sha256:[0-9a-f]{64}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Cursor list of runs with state, decision and rerun/reprocess labels
      description: Cursor list (00 §9.1) with state, decision and rerun/reprocess labels (09).
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of runs
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorList'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: createRun
      tags: [runs]
      summary: Create a run
      description: >-
        Locks manifest, policy, suite and environment; writes run + planned
        executions + outbox in one transaction (00 §9.3). `Idempotency-Key`
        required (00 §9.1).
      x-permission: run:create
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest_id]
              properties:
                manifest_id:
                  type: string
                  format: uuid
                release_id:
                  type: string
                  format: uuid
                  description: Optional release binding (05)
      responses:
        '201':
          description: Run created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}:
    get:
      operationId: getRun
      tags: [runs]
      summary: Run state + current evidence revision
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run detail
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunSummary'
                  - type: object
                    properties:
                      evidence_revision:
                        type: string
                        format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/cancel:
    post:
      operationId: cancelRun
      tags: [runs]
      summary: Request run cancellation (202; recorded, not "stopped")
      x-permission: run:cancel
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '202':
          description: Cancel request recorded
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/events:
    post:
      operationId: postRunEvents
      tags: [events]
      summary: Atomic event batch (≤ 500 events, ≤ 1 MiB before decompression)
      description: >-
        Body validated against `contracts/schemas/event-envelope.v1.json`
        (00 §9.4). Atomic commit; per-event ack `accepted`/`duplicate`.
        Idempotency-Key exempt: per-event `event_id` dedupe is the arbiter
        (00 §9.4; README exemption list).
      x-permission: event:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventBatch'
      responses:
        '200':
          description: Per-event acknowledgements
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [acks]
                properties:
                  acks:
                    type: array
                    items:
                      type: object
                      required: [index, status]
                      properties:
                        index:
                          type: integer
                        status:
                          type: string
                          enum: [accepted, duplicate]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/finalize:
    post:
      operationId: finalizeRun
      tags: [runs]
      summary: Finalize a shard (202, reconcile async)
      description: >-
        `producer`, `shard`, `last_sequence`, `count`, `manifest_hash`
        (00 §9.3) → 202; reconciliation is asynchronous.
      x-permission: event:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [producer_id, shard, last_sequence, count, manifest_hash]
              properties:
                producer_id:
                  type: string
                shard:
                  type: integer
                last_sequence:
                  type: integer
                count:
                  type: integer
                manifest_hash:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
      responses:
        '202':
          description: Finalize accepted; reconcile async
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /artifacts/upload-url:
    post:
      operationId: createArtifactUploadUrl
      tags: [artifacts]
      summary: Request a presigned upload URL for an artifact
      description: >-
        Scope run/attempt, media type, size, checksum → server-chosen key +
        presigned URL (00 §9.3).
      x-permission: artifact:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, kind, media_type, size_bytes, checksum]
              properties:
                run_id:
                  type: string
                  format: uuid
                attempt_id:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum:
                    [
                      trace,
                      video,
                      screenshot,
                      raw_report,
                      dom_snapshot,
                      a11y_snapshot,
                      patch,
                      ui_hierarchy,
                    ]
                media_type:
                  type: string
                size_bytes:
                  type: integer
                  minimum: 0
                checksum:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
      responses:
        '201':
          description: Upload URL issued
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, upload_url]
                properties:
                  artifact_id:
                    type: string
                    format: uuid
                  upload_url:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /artifacts/{a}/complete:
    post:
      operationId: completeArtifact
      tags: [artifacts]
      summary: Verify object/size/checksum → artifact `ready`
      x-permission: artifact:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Artifact verified and `ready`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/decision:
    get:
      operationId: getRunDecision
      tags: [decisions]
      summary: Exact evaluation revision + reasons, or `pending`
      x-permission: decision:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Evaluation decision or `pending`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Decision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/rerun:
    post:
      operationId: rerunRun
      tags: [runs]
      summary: Create a rerun with `rerun_scope` + selection (parent_run_id set)
      x-permission: run:create
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rerun_scope]
              properties:
                rerun_scope:
                  type: string
                selection:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Rerun created (`parent_run_id` set)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/environments/{e}/revisions:
    post:
      operationId: createEnvironmentRevision
      tags: [environments]
      summary: Create an immutable, secret-free, hashed environment revision
      description: Immutable, secret-free, hashed; referenced revision → 409 on change (05.1.2-T1).
      x-permission: environment:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/EnvironmentSlug'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Environment revision payload (05); secret-free, hashed server-side.
      responses:
        '201':
          description: Revision created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [revision_id, revision_hash]
                properties:
                  revision_id:
                    type: string
                    format: uuid
                  revision_hash:
                    type: string
                    pattern: '^sha256:[0-9a-f]{64}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /environment-revisions/{id}:
    get:
      operationId: getEnvironmentRevision
      tags: [environments]
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/EnvironmentRevisionId'
      responses:
        '200':
          description: Environment revision (secret-free)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [revision_id, revision_hash]
                properties:
                  revision_id:
                    type: string
                    format: uuid
                  revision_hash:
                    type: string
                    pattern: '^sha256:[0-9a-f]{64}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/reports/{report_id}/comparison:
    get:
      operationId: getReportComparison
      tags: [reports]
      summary: Parsed events per case vs declared counts/ids, with discrepancy reasons
      description: >-
        Raw report bytes are never returned; only the `raw_report` artifact id
        for `download-url` (`artifact:read` + sensitivity gate) (04.4.1-T6).
      x-permission: run:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/ReportId'
      responses:
        '200':
          description: Per-case comparison with discrepancy reasons
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [raw_report_id, cases]
                properties:
                  raw_report_id:
                    type: string
                    format: uuid
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        discrepancy_reasons:
                          type: array
                          items:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /runs/{r}/reprocess:
    post:
      operationId: reprocessRun
      tags: [runs]
      summary: Reprocess a raw report → 202, new evidence revision labelled `reprocessed`
      description: '`raw_report_id` + `parser_version` → 202; never `rerun` (04).'
      x-permission: run:create
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_report_id, parser_version]
              properties:
                raw_report_id:
                  type: string
                  format: uuid
                parser_version:
                  type: string
      responses:
        '202':
          description: Reprocess accepted; new evidence revision labelled `reprocessed`
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/releases:
    post:
      operationId: createRelease
      tags: [releases]
      summary: Create a release (components → build digests)
      x-permission: run:create
