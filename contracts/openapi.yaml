        is the pipeline's decision and `artifact:read_sensitive` is asked separately for a row served as sensitive: a
        caller without it gets `403 sensitivity_forbidden` and no URL. Both halves are audited — a denial writes one
        row (the artifact's id, the actor, the request id and the outcome) in its own committed unit of work, so it
        survives the rollback a failing command would cause, and the issuance of a sensitive artifact writes a row
        too; the URL itself is a bearer credential and is never audited, logged or echoed in an error. Only an
        artifact in the `ready` state has bytes at its final key, so any other state is `409 artifact_state_conflict`
