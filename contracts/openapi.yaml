openapi: 3.1.0
info:
  title: Evidgate API
  version: 1.0.0
  description: >-
    Evidgate public API (00 §9). REST + JSON under `/v1`. Conventions:
    every response carries `X-Request-Id` and echoes it in `error.request_id`;
    a W3C `traceparent` header is accepted on every operation. Cursor
    pagination is `?cursor=&limit=` (default 50, max 200), response
    `{ "items": [], "next_cursor": null }`, ordering `(created_at, id)`.
    Cookie-authenticated mutations require `X-XSRF-TOKEN` (00 §9.1, T38);
    bearer-only routes never carry it. Mutations that create resources or
    side effects require `Idempotency-Key` unless exempted in
    contracts/README.md. Optimistic concurrency uses `ETag`/`If-Match`
    (stale → 412). Error envelope is 00 §9.2 (`ErrorEnvelope`); 429/503
    carry `Retry-After`. Operational routes (`/internal/*`, `/metrics`) are
    intentionally absent — they never appear in this spec (00 §9.1).
  contact:
    name: Evidgate team
  license:
    name: Proprietary
servers:
  - url: /v1
    description: API version 1 (stub operations also document V2-tagged routes via `x-version`)
tags:
  - name: ci
    description: CI entry points (token exchange)
  - name: runs
    description: Runs, manifests, finalize and control actions
  - name: events
    description: Event batch ingest
  - name: artifacts
    description: Artifact upload and download
  - name: evidence
    description: Retention policy of a project's evidence (06)
  - name: decisions
    description: Run and release decisions
  - name: environments
    description: Immutable environment revisions
  - name: policies
    description: Immutable policy revisions (07)
  - name: reports
    description: Raw-report comparisons
  - name: releases
    description: Releases and release-run binding
  - name: identity
    description: Orgs, projects, memberships (02)
  - name: ci-admin
    description: CI bindings and ingest tokens (02)
  - name: audit
    description: Tenant-visible audit log (02, 11)
  - name: support
    description: Support grants (02)
  - name: security
    description: Security events (11)
  - name: catalog
    description: Case catalog and suite versioning (03)
  - name: webhooks
    description: Inbound provider webhooks (03)
  - name: drafts
    description: Authoring drafts, dry run and pull request (03, V2)
  - name: healing
    description: Incidents, candidates, switch (08)
  - name: usage
    description: Usage summary and ledger (12)
  - name: jobs
    description: Runner job claim and heartbeat (V2, 04/05)
  - name: policy
    description: Waivers and quarantine lifecycles (07)
  - name: authoring
    description: Feature tree, checklist items and manual test cases (13.1.1)
paths:
  /ci/token:
    post:
      operationId: exchangeCiToken
      tags: [ci]
      summary: Exchange a GitHub OIDC JWT or project ingest token for a `ci_producer` token (02.4)
      description: >-
        A pre-tenant route (00 §5.4.8, TL T1): there is no session, the credential is the
        request. Send a GitHub Actions OIDC token as `Authorization: Bearer …`, or an ingest
        token as `{"ingest_token": "egt_…"}`. The first exchange of a binding that is still
        `pending_verification` also carries `binding_challenge`. The reply is a short-lived
        (at most 60 minutes) `ci_producer` token scoped to exactly one project. Failures:
        401 `token_invalid` / `token_replayed` / `token_unknown` / `token_revoked` /
        `token_expired`; 403 `binding_mismatch` / `binding_pending` / `binding_disabled`;
        409 `binding_conflict`; 429 `rate_limited` (with `Retry-After`); 503 `unavailable`
        when the deployment has no signing key or the issuer's keys cannot be fetched.
        Idempotency-Key exempt: `jti` single-use is the arbiter (README).
      x-permission: none
      x-auth: github_oidc_jwt_or_ingest_token
      x-version: v1
      security:
        - bearerToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CiTokenRequest'
      responses:
        '200':
          description: Short-lived `ci_producer` token
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CiTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/oidc/{provider}/start:
    get:
      operationId: startFederatedLogin
      tags: [identity]
      summary: >-
        Start a federated login: write the pending-login cookie and redirect the browser to the provider
        (02.3.1)
      description: >-
        Pre-tenant browser route (00 §5.4.8, 02 §4.2): no session, no bearer token and no tenant, so
        `x-permission: none` / `x-auth: anonymous` and never `X-XSRF-TOKEN`. Generates a 256-bit `state`,
        a nonce and a PKCE S256 verifier, writes them integrity-protected (ASP.NET Core Data Protection
        under a fixed purpose) into the `__Host-evidgate_login` cookie — `Secure`, `Path=/`, no `Domain`,
        `HttpOnly`, `SameSite=Lax`, `Max-Age` = `EVIDGATE__LOGIN__STATELIFETIMESECONDS` (600 s default) —
        and answers 302 whose `Location` is the provider's authorization URL (`response_type=code`,
        `code_challenge_method=S256`, the nonce and the provider's scopes). `returnUrl` is the post-login
        destination and is allowlisted (see the parameter); a refused value lands on `/` and is not an
        error. Every response of this route carries `Cache-Control: no-store`. 404 `not_found` means no
        provider is registered under the route value at all (`google` registers in 02.3.1-T1.2, `github`
        in 02.3.1-T1.3). A registered provider whose client credential is missing is NOT a 404: it answers
        503 `unavailable` with `Retry-After`, because registration is composition and the credential is
        runtime configuration. The same 503 covers a deployment with no
        `EVIDGATE__LOGIN__PUBLICBASEURL` — one answer for both causes, so the route is no oracle for the
        deployment's configuration (02.3.1 AC8); the credential keys are
        `EVIDGATE__OIDC__GOOGLE__CLIENTID` + `…CLIENTSECRET` and `EVIDGATE__OAUTH__GITHUB__CLIENTID` +
        `…CLIENTSECRET`. No password field exists anywhere in this flow (AC7):
        the only login credential the platform accepts is the provider's.
      x-permission: none
      x-auth: anonymous
      x-version: v1
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
        - $ref: '#/components/parameters/LoginReturnUrl'
      responses:
        '302':
          description: >-
            The browser is sent to the provider's authorization endpoint, and the pending-login cookie
            carries `state`, the nonce and the PKCE verifier for one attempt.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: Absolute https authorization URL of the provider (`accounts.google.com` for Google).
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: >-
                `__Host-evidgate_login=<protected payload>; Path=/; Secure; HttpOnly; SameSite=Lax;
                Max-Age=600` (the lifetime is `EVIDGATE__LOGIN__STATELIFETIMESECONDS`). The value is
                encrypted and integrity-protected; a client can neither read the verifier nor alter a field.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/oidc/{provider}/callback:
    get:
      operationId: completeFederatedLogin
      tags: [identity]
      summary: >-
        Provider callback: verify the one-time state, exchange the code with PKCE and complete the login
        (02.3.1)
      description: >-
        Pre-tenant browser route (00 §5.4.8, 02 §4.2), the second half of `start`: no session, no bearer
        token, no tenant (`x-permission: none`, `x-auth: anonymous`). First, before any other work,
        deletes **both** browser cookies on **every** outcome — the 404, 429 and 503 ones included: the
        pending-login cookie `__Host-evidgate_login` and the staged-invite cookie
        `__Host-evidgate_invite` that `POST /auth/invite-token` wrote, so one staging buys exactly one
        callback whether that callback succeeds, is refused or never reads the token. It then compares
        `state` with the one the cookie carried in constant time, records it as consumed before calling
        the provider (so a replay is refused even when the first attempt failed) and exchanges the code
        with the stored PKCE verifier. A provider `error` value, a missing or oversized `code` (over 2048
        characters), a state mismatch, a pending cookie of another provider and a provider rejection all
        answer the same 401 `token_invalid`; no provider text, code, token, nonce, verifier, email or
        subject is echoed or logged. 404 `not_found` and 503 `unavailable` with `Retry-After` mean what
        they mean on `start`, and a provider timeout, transport failure, 5xx, 429 or unusable JWKS is 503
        rather than 401 (02.3.1 AC8). Every response carries `Cache-Control: no-store`.
        <br><br>
        The **purpose** inside the signed state cookie decides which completion — and only that one —
        finishes the attempt (02.3.1-T2 Q4). A state of purpose `login`, the shape `start` writes: the
        completion (02.3.1-T1.4) upserts the `user`/`user_identity` on `(provider, subject)`, refuses a
        disabled account with 403 `account_disabled`, **binds the pending invite** the browser staged
        before the round-trip (the token travels only inside that encrypted cookie and reaches the binder
        through the request object — never a URL, a `Location`, a log line, a metric, an error body or the
        `session` row; a staged token that does not parse, has expired, or names no pending membership
        simply binds nothing and never blocks the login), requires an active membership
        (`evidgate_resolve.member_orgs`), writes the `auth.login` audit row into the chain of **every**
        active organization before any session exists — fail-closed: a login that cannot be audited issues
        nothing and answers 503 `unavailable` — then inserts the platform-scoped `session` row, sets the
        `__Host-evidgate_session` cookie and answers the 302. A verified account that no active
        organization admits is 403 `no_membership` with no session and no cookie (AC3) — the rows the
        upsert wrote stay, so a later invite binds to them. A state of purpose `link`, the shape
        `POST /auth/link/{provider}` writes: the verified identity is **not** signed in and no server-side
        state is written — the callback only proves the browser still holds the session of the account the
        link was started for, answering 401 `unauthenticated` when it does not (an absent, expired or
        revoked session, or another account's), and 503 `unavailable` with `Retry-After` when the
        deployment composes no link seam or the session lookup faults — and answers a **session-less 302**
        whose `Set-Cookie` stages the identity in `__Host-evidgate_link` for `POST /auth/link/confirm` to
        write. There is no 200 body at any point: the browser flow ends in a redirect, and a
        verified-but-refused identity is never reported as signed in. No `Idempotency-Key` (see
        `contracts/README.md`): the route is a `GET` whose one-time `state` makes a replay a 401.
      x-permission: none
      x-auth: anonymous
      x-version: v1
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
        - $ref: '#/components/parameters/OidcCode'
        - $ref: '#/components/parameters/OidcState'
        - $ref: '#/components/parameters/OidcError'
      responses:
        '302':
          description: >-
            The attempt completed, in one of two shapes decided by the state cookie's purpose. Purpose
            `login`: the `session` row is written, the browser is sent to the allowlisted `returnUrl` (or
            `/`) and the `__Host-evidgate_session` cookie is set. Purpose `link`: nothing is signed in, no
            `session` row exists and no session cookie is set — the browser is sent to the same allowlisted
            target and the verified identity waits in the `__Host-evidgate_link` cookie for
            `POST /auth/link/confirm`. Both shapes delete the `__Host-evidgate_login` and
            `__Host-evidgate_invite` cookies on this response, as on every other.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: >-
                The allowlisted app path (`returnUrl`) or `/`, percent-encoded where the path carries a
                non-ASCII or unsafe character; never another origin.
              schema:
                type: string
            Set-Cookie:
              description: >-
                Purpose `login`:
                `__Host-evidgate_session=<opaque value>; Path=/; Secure; HttpOnly; SameSite=Lax;
                Expires=<the session's sliding deadline>` (00 §8.9; the value is stored server-side only
                as an HMAC and never shown again). Purpose `link`:
                `__Host-evidgate_link=<protected payload>; Path=/; Secure; HttpOnly; SameSite=Lax;
                Max-Age=<the staged-link lifetime>`, the encrypted staging of the verified identity and the
                account it is being added to, which one confirmation spends. No `Domain` attribute on
                either, as the `__Host-` prefix demands.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: >-
            401 `token_invalid` — the federated login could not be verified (02.3.1 AC8): the pending-login
            cookie is missing, of another provider, expired or tampered with, the `state` does not match or
            was already used, the provider reported an `error`, the `code` is missing or oversized, or the
            provider rejected the exchange, or (purpose `link`) the verified identity cannot be stored
            (subject over 255 or address over 320 characters). Or 401 `unauthenticated` — a state of purpose `link` whose
            callback did not come from the session of the account the link was started for: no session
            cookie, one for another account, or one that expired or was revoked during the provider
            round-trip (02.3.1-T2 Q4); nothing is staged then, so the link has to be started again. Each
            cause keeps its own code and no provider text, code, token, subject or email is in the body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            Purpose `login` only, both `retryable: false`, both without a `session` row or a session
            cookie: 403 `no_membership` — the identity is verified but the account holds no membership in
            an active organization (02.3.1 AC3); or 403 `account_disabled` — the account's `user.status`
            is `disabled` (02.3.1 §6). A refusal from the invite bind, or from the audit write that must
            precede the session, is not a 403: the bind's seat limit does not stop the login, and an audit
            that cannot commit is 503 `unavailable`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            503 `unavailable`, always with `Retry-After` — the same answer as on `start`
            (`EVIDGATE__LOGIN__RETRYAFTERSECONDS`) for a provider that is configured at composition but has
            no usable client credential or JWKS, for a deployment with no
            `EVIDGATE__LOGIN__PUBLICBASEURL`, and for a provider timeout, transport failure or 5xx
            (02.3.1 AC8); plus the completion's own infrastructure faults: a database outage, an audit chain
            that could not be appended (fail-closed, 02.3.1-T2.2), and — on a state of purpose `link` — a
            deployment that composes no link seam, a missing session pepper or a session lookup fault. The
            callback it answers is already spent (both cookies deleted, `state` consumed), so the header
            says when the browser may sign in or start the link again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/invite-token:
    post:
      operationId: stageInviteToken
      tags: [identity]
      summary: >-
        Stage an invite token in a short-lived `__Host-` cookie for the next federated login
        (02.3.1-T2)
      description: >-
        Pre-tenant browser route (00 §5.4.8), the companion of `start` for an invited member
        (02.3.1-T2 Q1): the landing page received `evgi_<prefix>_<secret>` in its invite link and
        posts it here once, in the request **body**, so the federated login that follows binds the
        pending membership to the provider-verified address. No session, no bearer token and no
        tenant exist yet, so `x-permission: none` / `x-auth: anonymous`, `security: []` and never
        `X-XSRF-TOKEN`. The token is a bearer secret: it is validated for **shape only**
        (`InviteTokenFormat.TryParse`) — whether it exists, has expired or belongs to another org is
        the binder's business at login and is never answered here, because answering it would turn
        the route into an oracle for invite prefixes — and it leaves the server only inside the
        encrypted `__Host-evidgate_invite` cookie. The answer is a bodiless 204; the value is never
        logged, counted, echoed, put in a `Location` or copied into a `returnUrl`, and the login
        callback deletes the cookie on every outcome, so one staging buys one login attempt. A
        malformed, absent or non-string `invite_token` is 422 `request_invalid` with
        `details[].path` = `invite_token` (`body` for a body that is not JSON, is not a JSON object, or is
        not `application/json`), and no cookie is written. The body is bounded before it is parsed: a
        declared or streamed length over 4096 bytes is 413 `payload_too_large`, and an empty body or one
        whose media type is not `application/json` is 422 `request_invalid` — the media type is a security
        boundary, because a cross-site `enctype=text/plain` form post is the one encoding that can reach a
        response's `Set-Cookie` without a CORS preflight and a browser cannot label a form post
        `application/json`. Every response carries `Cache-Control: no-store`, and the route is
        throttled per client address from the CI exchange limiter's budget
        (`EVIDGATE__CI__EXCHANGEBURSTLIMIT`) under its own key prefix at one unit — the cost of a
        `start` — so one client cannot fill every browser's cookie jar. No `Idempotency-Key` (see
        `contracts/README.md`): nothing is created, and repeating the request stages the same token
        again.
      x-permission: none
      x-auth: anonymous
      x-version: v1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteTokenRequest'
      responses:
        '204':
          description: >-
            The token is staged: no body, and the browser holds it only in the encrypted
            `__Host-evidgate_invite` cookie that the next `start`/`callback` pair carries.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: >-
                `__Host-evidgate_invite=<protected payload>; Path=/; Secure; HttpOnly;
                SameSite=Lax; Max-Age=600`. The value is encrypted and integrity-protected with
                ASP.NET Core Data Protection under its own purpose (the key ring of the
                pending-login cookie), so a client can neither read the token nor alter a field; the
                ten-minute lifetime is a constant of the contract, never a configuration key. Every
                `__Host-` rule applies: `Secure`, `Path=/` and no `Domain`, plus `HttpOnly` and
                `SameSite=Lax`, so no other origin can shadow the cookie and a cross-site request
                does not carry it.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
  /dev/session:
    post:
      operationId: createDevSession
      tags: [identity]
      summary: >-
        Development only: sign in as the seeded dev user with the deployment's dev-login secret (S187)
      description: >-
        The one route that mints a session from a shared secret, and the only one that is not mapped
        in a deployment at all. It exists when — and only when — three conditions hold: the host
        environment is `Development`, `EVIDGATE__DEVLOGIN__ENABLED` is true, and
        `EVIDGATE__DEVLOGIN__SECRET` is set (`DevSessionGate`). Otherwise the path is not registered,
        so the answer is the host's ordinary 404 and no anonymous caller can probe the credential;
        the flag alone is never enough, because a deployed host is refused by the environment.
        `x-dev-only: true` marks the operation for the SDK: it is generated so a development build
        can call it, and it is absent from every deployed host.
        Pre-tenant (00 §5.4.8): `x-permission: none` / `x-auth: anonymous`, `security: []`, and never
        `X-XSRF-TOKEN` — the route SETS a cookie rather than authenticating with one, so there is no
        session for a token to be bound to. The body carries the secret and nothing else: the
        session always belongs to the seeded dev account (`KnownDevUser.UserId`, the id `seed-dev`
        writes), never to an account the caller names, and no identity row is written. Both sides
        are reduced to SHA-256 digests and compared with `CryptographicOperations.FixedTimeEquals`,
        so neither the timing nor the branch depends on the presented value or its length; over HTTPS,
        a wrong, absent or blank secret is the same 401 `token_invalid` the login callback answers, with
        no session row and no cookie, and the value is never logged, echoed, counted or put in an
        exception message. The session is issued through the login's own machinery: the
        `auth.login` row of every active org is written before the session row exists (a sign-in
        that cannot be audited issues nothing and answers 503 `unavailable`), an account with no
        active membership is 403 `no_membership`, and the resulting row is an ordinary session that
        the logout and revoke routes end. The answer is a bodiless 204 carrying the
        `__Host-evidgate_session` cookie and the antiforgery pair; a body over 4096 bytes is 413
        `payload_too_large`, a body that is not `application/json`, is empty, is not JSON or is not a
        JSON object is 422 `request_invalid`, and every response carries `Cache-Control: no-store`.
        Throttled per client address from the CI exchange limiter's budget under its own key prefix
        at one unit, so a wrong guess is never free. No `Idempotency-Key`: nothing is created that a
        retry would duplicate, and a repeated sign-in replaces the browser's previous session row.
      x-permission: none
      x-auth: anonymous
      x-version: v1
      x-dev-only: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevSessionRequest'
      responses:
        '204':
          description: >-
            Signed in as the seeded dev user: no body, and the browser now holds the session cookie
            and the antiforgery pair.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: >-
                `__Host-evidgate_session=<opaque value>; Path=/; Secure; HttpOnly; SameSite=Lax` and
                the antiforgery pair `XSRF-TOKEN` (readable by the page script) plus
                `__Host-evidgate_af`, exactly as the federated login completion writes them. The
                session value is opaque and only its HMAC is stored.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          description: >-
            401 `token_invalid` — the presented secret is wrong, absent or blank. No session row is
            written and no cookie is set, and the answer is identical for every one of those cases.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            403 `no_membership` — the seeded dev account holds no active membership in any
            organization (the seed has not run, or the membership was removed). No session is issued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            503 `unavailable` — the audit chain or the session write failed, so the sign-in did not
            happen (no session exists for a sign-in nothing recorded), or the request did not arrive
            over HTTPS: the cookie pair this route must issue is Secure-only, so a plaintext sign-in
            can never complete. The plaintext refusal is answered before the secret is judged, so the
            status code says nothing about whether the presented secret was right, and it writes
            neither a row nor a cookie.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: >-
                Seconds to wait, from `EVIDGATE__LOGIN__RETRYAFTERSECONDS` (30 by default) — the same
                value the login completion sets on its own outage answer.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/link/{provider}:
    post:
      operationId: startProviderLink
      tags: [identity]
      summary: >-
        Start adding a second sign-in provider to the signed-in account (02.3.1-T2)
      description: >-
        Pre-tenant (00 §5.4.8): the only credential is the caller's own `__Host-evidgate_session`
        cookie — `ISessionUserReader` turns it into a user and no route takes a user id, so one
        account can never link or read another's staged identity. `x-permission: none` with
        `x-auth: user_session`: the operation carries no catalogue permission (it acts only on the
        caller's own session, never inside a tenant), which is why the viewer and `ci_producer` deny
        matrices derive it as unpermissioned rather than as a permission a caller could be denied
        for. Step one of three (Q4, AC6): the provider authorization URL is built through the same
        helper as `GET /auth/oidc/{provider}/start`, with the calling account as the signed state's
        link target, and the pending state cookie (`__Host-evidgate_login`, purpose `link`) is
        written; the shared callback verifies the identity and stages it in `__Host-evidgate_link`,
        `GET /auth/link/pending` shows what is waiting, and `POST /auth/link/confirm` writes it. That
        order is what makes "an explicit confirm, never an automatic merge" true at the API and not
        only in a comment. `return_url` is optional and allowlisted by `ReturnUrlPolicy` exactly like
        the sign-in route's `returnUrl` (a refused value lands on `/` and is not an error); a body
        over 4096 bytes is 413 and a body whose media type is not `application/json`, or one that is
        not JSON, is 422. Every response carries `Cache-Control: no-store`, spends its own prefix of
        the CI exchange limiter's per-client budget (`EVIDGATE__CI__EXCHANGEBURSTLIMIT`, one unit) so
        a flood here cannot spend another route's window, and refuses a present `Origin` header that
        is not this deployment's public origin (`EVIDGATE__LOGIN__PUBLICBASEURL`) with 403
        `forbidden` — defence in depth on top of `SameSite=Lax`, because a same-site browser form post
        still carries the session cookie. No token, code, subject, email or cookie value is echoed,
        logged or counted: the answer is the provider's authorization URL, which is public.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProviderPath'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkStartRequest'
      responses:
        '200':
          description: >-
            The authorization URL to send the browser to next, and the pending state cookie that
            binds this attempt (provider, PKCE verifier, nonce, the linking account and the
            allowlisted return path) to the callback.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: >-
                `__Host-evidgate_login=<protected payload>; Path=/; Secure; HttpOnly; SameSite=Lax;
                Max-Age=<EVIDGATE__LOGIN__STATELIFETIMESECONDS>` (600 s default), the state cookie of
                the login routes, here carrying purpose `link` and the account the identity is being
                added to.
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            503 `unavailable` — the identity store or the session lookup is not usable: a registered
            provider whose client credential is missing, a deployment with no
            `EVIDGATE__LOGIN__PUBLICBASEURL` (one answer for both, so the route is no oracle for the
            deployment's configuration), no session pepper (`EVIDGATE__SESSION__PEPPER`) or a
            database outage. The route sets `Retry-After` through `EVIDGATE__LOGIN__RETRYAFTERSECONDS`
            when it reports the outage itself; a refusal raised by the session lookup (the
            missing-pepper case) leaves the header to the envelope filter's default `60` (00 §9.2).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              description: >-
                Seconds to wait, when the route reports the outage itself; absent on the
                missing-pepper refusal.
              schema:
                type: integer
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/link/pending:
    get:
      operationId: getPendingProviderLink
      tags: [identity]
      summary: >-
        The second-provider link this browser has staged and not confirmed yet (02.3.1-T2)
      description: >-
        Pre-tenant, session-cookie only, and never another account's (`x-permission: none` /
        `x-auth: user_session`, like `POST /auth/link/{provider}`). Reads the caller's own
        `__Host-evidgate_link` cookie and answers the identity the callback verified: the provider,
        the address that provider verified, its profile name and when the staged link stops being
        confirmable (ten minutes after the callback staged it). A cookie that is missing, expired,
        unreadable or belongs to another user is not a leak and not an error the caller can repair
        by retrying: it is deleted on the way out and the answer is 404 `not_found`, exactly as for a
        browser that never staged anything. Every response carries `Cache-Control: no-store` (the
        body is personal data), spends the pending key prefix of the CI exchange limiter's per-client
        budget, and refuses a foreign `Origin` with 403 `forbidden`. Nothing from the cookie's
        plaintext — no subject, no token — is echoed or logged.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The identity this browser has staged, and when it stops being confirmable.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: >-
                Present only when a presented `__Host-evidgate_link` value was unusable (expired,
                forged or another user's): the deletion of that cookie. A usable staged link is left
                in place.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPendingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            503 `unavailable` — no session pepper (`EVIDGATE__SESSION__PEPPER`) or a database
            outage in the session lookup. The answer is the 00 §9.2 envelope and never a 200 with an
            empty body; the route sets no `Retry-After`, so the envelope filter's default `60`
            applies.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: discardPendingProviderLink
      tags: [identity]
      summary: Discard the staged second-provider link of this browser (02.3.1-T2)
      description: >-
        Pre-tenant, session-cookie only (`x-permission: none` / `x-auth: user_session`): a session is
        required, so a cross-site caller that somehow sent no cookie cannot clear another browser's
        staging. Deletes `__Host-evidgate_link` and answers 204 — with or without a staged link, so
        the call is idempotent (`Idempotency-Key` is not required; see `contracts/README.md`) and a
        client needs no read first. Every response carries `Cache-Control: no-store`, spends the
        pending key prefix of the CI exchange limiter's per-client budget, and refuses a foreign
        `Origin` with 403 `forbidden`.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: The staged link is gone; nothing else changed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: >-
                The deletion of `__Host-evidgate_link` when the request presented one (nothing is
                written when it did not).
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            503 `unavailable` — no session pepper (`EVIDGATE__SESSION__PEPPER`) or a database
            outage in the session lookup; the route sets no `Retry-After`, so the envelope filter's
            default `60` applies (00 §9.2).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /auth/link/confirm:
    post:
      operationId: confirmProviderLink
      tags: [identity]
      summary: >-
        Confirm the staged second-provider link and attach the identity to the signed-in account
        (02.3.1-T2)
      description: >-
        Pre-tenant, session-cookie only (`x-permission: none` / `x-auth: user_session`), and the one
        route of the linking surface that writes. It attaches the staged identity — the
        `(provider, subject)` the callback verified and stored in `__Host-evidgate_link` — to the
        account the session names, then extends the audit chain of every **active** organization of
        that account: `auth.link` in each, and `auth.link_move` with the previous account when the
        identity was moved. Order is the story's: the identity row first (one call, the database's own
        decision), then the audit rows. A successful outcome (`linked`, `already_linked`, `moved`) is
        200; anything else deletes the staging, because one staging buys one confirmation. 409
        `binding_conflict` means that `(provider, subject)` belongs to another account which still
        holds a membership or a live session, so it is never taken from it (AC6: no automatic merge,
        ever — the other person links their own account). 403 `account_disabled` is reachable only
        where the database reports the status itself, i.e. the account was disabled between the
        session check and this call; the session lookup cannot tell a disabled account from an absent
        session and answers 401 `unauthenticated` there. A 503 from the audit leaves the staging in
        place, so the retry converges on `already_linked` and writes the audit rows again (at least
        once per organisation, `auth.link_move` included; a move re-issues `__Host-evidgate_link`
        carrying the moved-from account with its original deadline). Every response carries
        `Cache-Control: no-store`, costs two units of the confirm key prefix in the CI exchange
        limiter (it writes a row and a chain), and refuses a foreign `Origin` with 403 `forbidden`.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: >-
            The identity is attached: `outcome` is `linked` (a new identity row), `already_linked`
            (this account already held it — the retry after an audit failure) or `moved` (it was
            taken from an account that is no longer in use).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: The deletion of the `__Host-evidgate_link` cookie this confirmation spent.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkConfirmResponse'
        '401':
          description: >-
            401 `unauthenticated` — no `__Host-evidgate_session` cookie, or one that is unknown,
            expired, revoked or belongs to an account disabled after it was minted; or 401
            `token_invalid` — this browser has no usable staged link (missing, expired, forged or
            another user's `__Host-evidgate_link`), nothing was written and the link has to be
            started again. Both are `retryable: false`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: >-
            403 `forbidden` — the request named an `Origin` other than this deployment's public
            origin; or 403 `account_disabled` — the account the identity would attach to is
            `disabled` (02.3.1 §6), detected by the store itself. Both are `retryable: false`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: >-
            503 `unavailable`, retryable — a database fault, an audit chain that could not be
            extended (the staging is kept, so the retry converges), no session pepper
            (`EVIDGATE__SESSION__PEPPER`) or a stored contract this build does not know. The route
            sets `Retry-After` (`EVIDGATE__LOGIN__RETRYAFTERSECONDS`) on the answers it raises itself
            (the unknown stored contract, the audit failure); the session lookup and the store
            command leave the header to the envelope filter's default `60` (00 §9.2).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /me:
    get:
      operationId: getMyProfile
      tags: [identity]
      summary: The signed-in account's own profile (02.3.1-T3)
      description: >-
        Pre-tenant and session-cookie only (`x-permission: none`, `x-auth: user_session`): the caller is the
        session the presented `__Host-evidgate_session` cookie proves, resolved INSIDE the owner-owned definer
        from the cookie's HMAC (`evidgate_resolve.user_profile_read`, 02.3.1-T3) — the route takes no user id,
        so one account can never read another's profile. The answer is the account's own row only:
        `preferred_locale` is null until the account chooses a language, and it is exactly the member
        `PATCH /me` writes. The row's `version` is published as the response's strong `ETag`, which the next
        write must send back as `If-Match`. Every response carries `Cache-Control: no-store` because the body is
        personal data. 401 `unauthenticated` / `session_expired` / `session_revoked` are the request
        authenticator's own answers, raised before the handler runs; 403 `account_disabled` is the
        disabled-account answer of the same layer, and the definer itself also requires the account to be
        `active`, so a session that outlives a disable resolves no row.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's own profile, its version in the ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updateMyProfile
      tags: [identity]
      summary: Change the account's preferred language under If-Match (02.3.1-T3)
      description: >-
        Pre-tenant, session-cookie only, and one of the cookie mutations that must carry the antiforgery pair
        (403 `csrf_failed` otherwise): the session is the route's whole authority, and the acting user is again
        resolved inside the definer from the cookie's HMAC (`user_profile_update`), never from a parameter; the
        definer requires the owning account to be `active`. The body carries exactly one member,
        `preferred_locale` (`vi` or `en`): any other name is 422 `field_not_patchable` WITH the offending member
        named in `error.details` (bounded to 64 characters), even when a valid locale travels beside it; a name
        sent twice is 422 `request_invalid` with `duplicate`, judged before any value, so an invalid first value
        is never overwritten by a valid second one; an empty, non-JSON or non-object body is 422 `request_invalid`;
        and a body that is not `application/json` is that same 422 `request_invalid` with `body` in
        `error.details` — this route's own reader answers it, never the framework's 415. A value outside the two
        languages is 422 `locale_invalid`; the column's check constraint carries the same pair of values.
        `If-Match` is required and carries the `ETag` of the profile the client read: an absent or unparsable
        header is 422 `request_invalid` with `If-Match`/`required` or `If-Match`/`invalid`, and a version the row
        no longer has is 412 `precondition_failed` with nothing written. The `version` belongs to the database:
        the shared `set_updated_at_and_version` trigger increments it on every update of the row — including the
        login upsert's `last_login_at` write — so a sign-in between the client's GET and its PATCH can make an
        otherwise valid PATCH answer 412. The write also appends one `user.locale_changed` audit row per active org
        of the account (`member_orgs` answers at most 200), the actor and the object being the same user and the
        new language allowlisted metadata. Those rows are written AFTER the profile commit, best-effort and
        fail-closed: a chain that cannot be written — or the whole fan-out missing its 5 s deadline — answers 503
        `unavailable` with `Retry-After`, and the change stays stored, so that 503 can arrive with some orgs
        audited and the rest not, and a retry with the version the next read shows can append a second row for an
        org that was already written. The answer is the profile in its new state, its new `version` in the `ETag`.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: The profile in its new state, its new version in the ETag.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [identity]
      summary: List the caller's live sessions, current one marked (02.3.2-T2)
      description: >-
        Pre-tenant and session-cookie only (`x-permission: none`, `x-auth: user_session`): the caller is the
        session the presented `__Host-evidgate_session` cookie proves, resolved INSIDE the owner-owned definer
        from the cookie's HMAC candidates (`evidgate_resolve.session_list`, 02.3.2-T2.1) — no route value and no
        body ever names a user. The answer is every row of that account that is neither revoked nor past its idle
        or absolute deadline, newest first; it is bounded by the account itself (a person's live sessions), so
        there is no `cursor` and no `limit`. `current` marks the session that answered this request, and the two
        deadlines, `last_seen_at`, `ip` and `user_agent` are the caller's own data only. No cookie value, HMAC,
        pepper version or any other secret is part of any answer, and every response carries
        `Cache-Control: no-store` because the body is personal data. 401 `unauthenticated` / `session_expired` /
        `session_revoked` are the request authenticator's own answers, raised before the handler runs (AC4, AC8);
        403 `account_disabled` is the disabled-account answer of the same layer.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      responses:
        '200':
          description: The caller's live sessions, newest first.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/sessions/{s}:
    delete:
      operationId: revokeSession
      tags: [identity]
      summary: Revoke one of the caller's sessions, or a member's as an admin (02.3.2-T2)
      description: >-
        Pre-tenant, session-cookie only (`x-permission: none`, `x-auth: user_session`), and one of the three
        cookie mutations that must carry the antiforgery pair (AC5): the session is the route's whole authority.
        The acting user is again resolved inside the definer from the cookie's HMAC (`session_revoke_one`), never
        from a parameter. Two paths exist and the definer decides between them: with no `X-Evidgate-Org` only the
        session's OWNER may revoke the row; with the header the caller must hold an active membership in that org
        carrying `membership:write`, and the target session's user must hold an active membership in the SAME org
        (the admin path of AC6, which is what makes a member removal immediate). A session id that is unknown,
        belongs to another account, belongs to an account outside the named org, or is already revoked or expired
        answers the SAME 404 `not_found` a missing id does — never 403, so the route is no oracle for another
        account's ids. A segment that is not a uuid answers that SAME 404 as well, and only after the request was
        authenticated: the id is parsed by the handler, not by parameter binding, so neither an anonymous caller
        nor a malformed value ever reaches an undocumented 400 (the literal `revoke-all` included). Revoking the
        caller's OWN session ends the request's credential, so that answer also expires the session and
        antiforgery cookies (`Set-Cookie`, `Max-Age=0`), exactly like `POST /auth/logout`; revoking any other row
        leaves the caller's own cookies untouched, because the caller stays signed in on both paths. The call is
        idempotent by contract (`Idempotency-Key` not required; see `contracts/README.md`): a repeat on a dead row
        still answers 404, and the first successful call already wrote the state. A 503 `unavailable` means the call
        aborted and nothing was written — no session pepper, a database fault, or the admin path's audit row failing
        to write in the same definer transaction — so the target session is still live and the retry is safe. Every
        response carries `Cache-Control: no-store`.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/OrgHeader'
      responses:
        '204':
          description: >-
            The row is revoked; its next request answers 401 `session_revoked` (AC4). When the revoked row was the
            caller's OWN session, the response also expires the session and antiforgery cookies so the browser drops
            them, exactly like `POST /auth/logout`; a client that keeps a copy still gets the 401 `session_revoked`,
            because the row — not the cookie — is the state that changed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: >-
                Present only when the revoked row was the request's own session: the expiry (`Max-Age=0`) of
                `__Host-evidgate_session` and of the antiforgery pair cookies, with the same attributes they were
                written with (`Path=/; Secure; HttpOnly; SameSite=Lax`, no `Domain`), exactly like
                `POST /auth/logout`. Absent when another row was revoked.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      tags: [identity]
      summary: Revoke every session of the caller, optionally keeping the current one (02.3.2-T2)
      description: >-
        Pre-tenant, session-cookie only (`x-permission: none`, `x-auth: user_session`), with the antiforgery
        pair required (AC5) and no `Idempotency-Key` (revocation is naturally idempotent — see
        `contracts/README.md`). `keep_current` defaults to `true`, the "all but this one" case of the story:
        every other live row of the account is revoked and the answering session survives. With
        `keep_current: false` the current row is revoked too, exactly like `POST /auth/logout`, and the answer
        expires the session and antiforgery cookies so the browser cannot replay them. The acting user comes from
        the cookie's HMAC inside the definer (`session_revoke_others`), never from the body. The optional body is
        bounded and parsed here, so a body that is not `application/json`, not valid JSON or not the documented
        shape answers 422 `request_invalid` (the same refusal `POST /auth/invite-token` gives the same body, since
        the media type is a security boundary on both), and a body over 1024 bytes answers 413
        `payload_too_large`; neither refusal reaches the definer, so every row stays as it was. Every response
        carries `Cache-Control: no-store`.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAllSessionsRequest'
      responses:
        '204':
          description: The other sessions (and the current one, when `keep_current` is false) are revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: >-
                Present only with `keep_current: false`: the expiry (`Max-Age=0`) of
                `__Host-evidgate_session` and of the antiforgery pair cookies, with the same attributes they were
                written with (`Path=/; Secure; HttpOnly; SameSite=Lax`, no `Domain`). Absent when the current
                session is kept.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      operationId: logout
      tags: [identity]
      summary: Log the calling session out and expire its cookies (02.3.2-T2)
      description: >-
        Pre-tenant, session-cookie only (`x-permission: none`, `x-auth: user_session`), with the antiforgery
        pair required (AC5) and no `Idempotency-Key` (see `contracts/README.md`). Revokes the row the presented
        cookie proves — resolved from the cookie's HMAC inside the definer (`session_revoke_current`), never from
        a parameter — so the revocation is a row state and the very next request with the old cookie answers 401
        `session_revoked` (D9, AC4, AC8). The answer expires `__Host-evidgate_session` and the antiforgery pair
        cookies with `Max-Age=0` and the attributes they were written with, so a browser drops them; a client
        that keeps a copy still gets the 401. Every response carries `Cache-Control: no-store`.
      x-permission: none
      x-auth: user_session
      x-version: v1
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '204':
          description: The current session is revoked and its cookies are expired.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: >-
                `__Host-evidgate_session=; Max-Age=0; Path=/; Secure; HttpOnly; SameSite=Lax` and the same
                expiry for the antiforgery pair cookies, so no client-held copy is honoured by a browser.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/manifests:
