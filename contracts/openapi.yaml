          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healing/candidates/{c}:
    get:
      operationId: getHealingCandidate
      tags: [healing]
      summary: Read a healing candidate with validation evidence (08)
      x-permission: healing:triage
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200':
          description: Healing candidate detail
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healing/candidates/{c}/reject:
    post:
      operationId: rejectHealingCandidate
      tags: [healing]
      summary: Reject a healing candidate (V2); reason required; audited (08)
      x-permission: healing:approve
      x-version: v2
      parameters:
        - $ref: '#/components/parameters/CandidateId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Candidate rejected
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healing/switch:
    get:
      operationId: getHealingSwitch
      tags: [healing]
      summary: Resolved healing availability per tenant/project (most restrictive wins)
      x-permission: healing:triage
      x-version: v1
      responses:
        '200':
          description: Resolved switch (`enabled|shadow|disabled|unavailable`, 00 §8.7)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [availability]
                properties:
                  availability:
                    type: string
                    enum: [enabled, shadow, disabled, unavailable]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    put:
      operationId: setHealingSwitch
      tags: [healing]
      summary: Set the healing switch (`enabled|shadow|disabled` only, TL T33)
      x-permission: healing:configure
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability:
                  type: string
                  enum: [enabled, shadow, disabled]
      responses:
        '200':
          description: Switch updated
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /waivers:
    post:
      operationId: createWaiver
      tags: [policy]
      summary: Request a waiver for a case or suite (07.3.1-T1)
      description: >-
        Records a human risk acceptance for one case or suite of the project; a waiver is
        never itself a test result and never changes a decision (00 §8.8). The caller must
        be a member of the org (`X-Evidgate-Org` selects it when the caller has more than
        one) and hold `policy:write`; the project must be in the credential's scope and
        exist, else 404 (also for another tenant's project). `expires_at` must be strictly
        in the future and `reason` 1..2000 characters, else 422 with `error.details[]` per
        field. The waiver starts `requested` with `requested_by` = the caller; a different
        `release_approver` approves it (`POST /v1/waivers/{w}/approve`). Idempotency-Key
        required.
      x-permission: policy:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiverCreateRequest'
      responses:
        '201':
          description: Waiver requested
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /waivers/{w}/approve:
    post:
      operationId: approveWaiver
      tags: [policy]
      summary: Approve a requested waiver (07.3.1-T1)
      description: >-
        Approves a waiver that is still `requested` and not yet expired. The approver must
        differ from the requester: the requester approving their own waiver is 403
        `waiver_self_approval` (also enforced by the `waiver_self_approval_check` DB
        constraint). A waiver that is not `requested`, or whose `expires_at` has passed, is
        409 `waiver_state_conflict`; an unknown id, another tenant's waiver or a project
        outside the credential's scope is 404. Idempotency-Key required.
      x-permission: policy:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/WaiverId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Waiver approved
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /waivers/{w}/revoke:
    post:
      operationId: revokeWaiver
      tags: [policy]
      summary: Revoke a requested or approved waiver (07.3.1-T1)
      description: >-
        Withdraws a waiver that is `requested` or `approved` and not yet expired (a
        requester or an approver may withdraw before or after approval). A waiver already
        `expired` or `revoked`, or one whose `expires_at` has passed, is 409
        `waiver_state_conflict`; an unknown id, another tenant's waiver or a project outside
        the credential's scope is 404. Idempotency-Key required.
      x-permission: policy:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/WaiverId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Waiver revoked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/waivers:
    get:
      operationId: listProjectWaivers
      tags: [policy]
      summary: Cursor page of a project's waivers (07.3.1-T1)
      description: >-
        Every member role, including `viewer`, may read (T58). The stored `state` is
        returned as is (`requested`, `approved`, `expired`, `revoked`); the page is
        keyset-ordered on `(created_at, id)` ascending. Another tenant's project, or a
        project outside the credential's scope, is 404; a `limit` outside 1..200 or a
        malformed `cursor` is 422.
      x-permission: policy:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of waivers
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiverPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /quarantine:
    post:
      operationId: createQuarantineEntry
      tags: [policy]
      summary: Quarantine a case; a critical case is refused 422 (07.3.1-T2)
      description: >-
        Excludes one case from gating while its failure stays visible (00 §8.8). The caller
        must be a member of the org (`X-Evidgate-Org` selects it when the caller has more
        than one) and hold `quarantine:write` (`test_maintainer`); the project must be in the
        credential's scope and exist, else 404 (also for another tenant's project). `case_id`
        must be a case of that project (else 404 `not_found`) and `owner` a membership of the
        org (else 422 with `error.details[]`). A case on the active policy revision's
        critical list can never be quarantined: 422 `critical_case_not_quarantinable`, and no
        row is written (T23). An active entry for the case already exists: 409
        `quarantine_conflict`. `expires_at` must be strictly in the future and `reason`
        1..2000 characters, else 422. Idempotency-Key required.
      x-permission: quarantine:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineEntryCreateRequest'
      responses:
        '201':
          description: Case quarantined
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /quarantine/{q}:
    delete:
      operationId: removeQuarantineEntry
      tags: [policy]
      summary: Remove a quarantine entry; a non-active entry is 404 (07.3.1-T2)
      description: >-
        Moves an `active` entry to `removed` (terminal) and returns it. The caller must hold
        `quarantine:write` (`test_maintainer`). An entry that is unknown, another tenant's,
        outside the credential's project scope, or not `active` (already `removed` or
        `expired`) is 404 `not_found`, never a silent no-op 200 (AC6). Idempotency-Key
        required.
      x-permission: quarantine:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/QuarantineEntryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Entry removed
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/quarantine:
    get:
      operationId: listQuarantineEntries
      tags: [policy]
      summary: Cursor page of a project's quarantine entries (07.3.1-T2)
      description: >-
        Every member role, including `viewer`, may read (T58). The stored `state` is returned
        as is (`active`, `expired`, `removed`); the page is keyset-ordered on
        `(created_at, id)` ascending. Another tenant's project, or a project outside the
        credential's scope, is 404; a `limit` outside 1..200 or a malformed `cursor` is 422.
      x-permission: policy:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of quarantine entries
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineEntryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-evidgate
      description: '`__Host-` httpOnly, Secure, SameSite=Lax browser session cookie (00 §9.1).'
    bearerToken:
      type: http
      scheme: bearer
      description: 'CLI/agent bearer tokens — `ci_producer`, ingest, personal (00 §9.1; T38: never cookie-authenticated).'
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC signature on inbound GitHub webhook deliveries (00 §9.3).
  parameters:
    BindingId:
      name: b
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IngestTokenId:
      name: t
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditExportFormat:
      name: format
      in: query
      required: false
      schema:
        type: string
        enum: [jsonl, csv]
        default: jsonl
    AuditActorType:
      name: actor_type
      in: query
      required: false
      schema:
        type: string
        enum: [user, ci_producer, agent, platform_operator, system]
    AuditAction:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
    AuditObjectType:
      name: object_type
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    AuditFrom:
      name: from
      in: query
      required: false
      description: Inclusive lower bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      required: false
      description: Exclusive upper bound on `created_at` (ISO 8601).
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(created_at, id)` (00 §9.1).
      schema:
        type: string
    PolicyRevisionCursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(revision_no, id)` (07.1.1-T3, 00 §9.1).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    RunRefName:
      name: ref_name
      in: query
      required: false
      description: >-
        Exact `ref_name` of the run's recorded identity (05.2.2 §5, AC6): the
        branch of `refs/heads/<n>`, the tag of `refs/tags/<n>`, or GitHub's
        `<N>/merge` for a pull request. 1..255 code points with no control
        character; a present but invalid value is 422 `request_invalid` with
        `details[].path` = `ref_name`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RunPrNumber:
      name: pr_number
      in: query
      required: false
      description: >-
        Exact `pr_number` of the run's recorded identity (05.2.2 §5, AC6); an
        integer ≥ 1, a present but invalid value is 422 `request_invalid` with
        `details[].path` = `pr_number`.
      schema:
        type: integer
        format: int32
        minimum: 1
    RunHeadSha:
      name: head_sha
      in: query
      required: false
      description: >-
        Exact `head_sha` of the run's recorded identity (05.2.2 §5, AC6):
        GitHub's SHA-1 or SHA-256 commit id, lowercase. A present but invalid
        value is 422 `request_invalid` with `details[].path` = `head_sha`.
      schema:
        type: string
        pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
    RunTriggerEvent:
      name: trigger_event
      in: query
      required: false
      description: >-
        Exact `trigger_event` of the run's recorded identity (05.2.2 §5, AC6).
        A present but invalid value is 422 `request_invalid` with
        `details[].path` = `trigger_event`.
      schema:
        type: string
        enum: [push, pull_request, schedule, manual, dispatch]
    RunIsFork:
      name: is_fork
      in: query
      required: false
      description: >-
        Exact `is_fork` of the run's recorded identity (05.2.2 §5, AC6); the
        literal `true` or `false`. A present but invalid value is 422
        `request_invalid` with `details[].path` = `is_fork`.
      schema:
        type: boolean
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied, ≤ 128 chars, unique per `(org_id, project_id, operation)` ≥ 24 h (00 §7/§9.1).
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag for optimistic concurrency; stale → 412 (00 §9.1).
      schema:
        type: string
    IfMatchOptional:
      name: If-Match
      in: header
      required: false
      description: >-
        Optional optimistic-concurrency check: the caller's cached head revision
        id, quoted; stale or malformed → 412 with the current head revision id in
        `error.details`; absent means no check (00 §9.1, 07.1.1-T3).
      schema:
        type: string
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        Required whenever the caller is cookie-authenticated (00 §9.1, T38);
        bearer-only callers omit it. 403 `csrf_failed` on mismatch.
      schema:
        type: string
    OrgId:
      name: o
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: m
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: p
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: a
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PolicyRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentSlug:
      name: e
      in: path
      required: true
      schema:
        type: string
    SupportGrantId:
      name: g
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteId:
      name: s
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseStatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, missing, archived]
    CaseFrameworkFilter:
      name: framework
      in: query
      required: false
      schema:
        type: string
    CaseId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DryRun:
      name: dry_run
      in: query
      required: false
      schema:
        type: boolean
      description: When true, nothing is written; the response previews the revision.
    AgainstRevision:
      name: against
      in: query
      required: true
      schema:
        type: string
        format: uuid
    SuiteRevisionId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: d
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: i
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: j
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WaiverId:
      name: w
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuarantineEntryId:
      name: q
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Server request id; echoed in `error.request_id` (00 §9.1/§9.2).
      schema:
        type: string
    RetryAfter:
      description: Seconds (or HTTP-date) to wait before retrying (00 §9.2).
      schema:
        type: string
    ETag:
      description: The row's `version`, quoted; send it back in `If-Match` (00 §9.1).
      schema:
        type: string
  responses:
    Unauthorized:
      description: 401 unauthenticated (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '403 forbidden — includes token-scope mismatch and `csrf_failed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 not found — also for other-tenant ids (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: '409 conflict — e.g. `idempotency_conflict`, `run_closed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: 412 precondition failed — stale ETag; current revision id in `error.details` (00 §9.1/§9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: 413 too large (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 422 schema/manifest invalid — per-item causes in `error.details[]` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '429 — `rate_limited` (bursts) or `quota_exceeded` (tenant/project limit); always `Retry-After` (00 §9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 503 unavailable — always `Retry-After` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: 00 §9.2 error envelope; `details` never contains secrets.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  index:
                    type: integer
                  path:
                    type: string
                  reason:
                    type: string
    CursorList:
      type: object
      description: 00 §9.1 cursor list envelope; `next_cursor` is null when the page is last.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: [string, 'null']
    RunStateDto:
      type: object
      required: [run_id, state, current_evidence_revision_id, version, purpose, ref, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        current_evidence_revision_id:
          type: [string, 'null']
          format: uuid
          description: >-
            The evidence revision the run's current verdict was frozen from;
            null while none exists (`run.current_evidence_revision_id`, 05.3.1;
            05.3.2 owns the write side).
        version:
          type: integer
          minimum: 0
        purpose:
          type: string
          enum: [regular, replay]
        ref:
          $ref: '#/components/schemas/RunRef'
        unverified_ref:
          type: boolean
          description: >-
            True when at least one stored identity value came from the request
            body instead of a verified CI claim (05.2.2-T1); false for a
            verified CI caller and for a run with no identity at all.
    RunSummary:
      type: object
      description: >-
        One row of `GET /v1/projects/{p}/runs` (05.2.2 §5). Since 05.2.2-T2 the
        list serves the run's state, `created_at`, the recorded identity `ref`
        and `unverified_ref`; `decision`, `parent_run_id`, `rerun_label` and
        `reprocess_label` remain optional here until 07 and 05.5.1/05.5.2 add
        them.
      required: [run_id, state, created_at, ref, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        created_at:
          type: string
          format: date-time
          description: Creation, UTC — the primary sort key of the list (AC6).
        ref:
          $ref: '#/components/schemas/RunRef'
        unverified_ref:
          type: boolean
          description: >-
            True when at least one stored identity value came from the request
            body instead of a verified CI claim (05.2.2-T1); false for a
            verified CI caller and for a run with no identity at all.
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        parent_run_id:
          type: [string, 'null']
          format: uuid
        rerun_label:
          type: [string, 'null']
        reprocess_label:
          type: [string, 'null']
    RunPage:
      type: object
      description: 00 §9.1 cursor page of `RunSummary`, keyset-ordered on `(created_at, id)` ascending (05.2.2-T2).
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RunSummary' }
        next_cursor: { type: [string, 'null'] }
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [manifest_id]
      properties:
        manifest_id:
          type: string
          format: uuid
        release:
          type: string
          minLength: 1
          maxLength: 128
          description: >-
            Optional release name; at M1 it resolves to 422
            `release_unresolvable` (05.6.1 owns the write-bind).
        purpose:
          type: string
          enum: [regular, replay]
          default: regular
          description: >-
            Optional run purpose; absent means `regular`. `replay` is refused
            422 `replay_grant_invalid` until 08.4.3 issues grants (05.2.1-T5);
            with `regular` it never changes the 201 shape.
        replay_grant_id:
          type: string
          format: uuid
          description: >-
            Optional grant id issued by 08.4.3; meaningful only with
            `purpose: replay`, where it must name a valid, unexpired grant
            bound to this project. With `regular` (or an absent `purpose`) it is
            422 `request_invalid` (`details[]` reason `invalid_value`, path
            `/replay_grant_id`; 05.2.1-T5).
        components:
          type: object
          description: Optional build identifiers for the run's components.
        ref:
          $ref: '#/components/schemas/RunRefRequest'
    RunCreated:
      type: object
      required: [run_id, state, unverified_ref]
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued]
        unverified_ref:
          type: boolean
          description: >-
            True when the stored identity block carries at least one
            body-supplied value (05.2.2-T1); false for a verified CI caller and
            for a run created without an identity.
    RunRefRequest:
      type: object
      additionalProperties: false
      description: >-
        Optional run identity supplied by the caller (00 §7/§8.1, 05.2.2-T1).
        A verified CI caller's OIDC claims always win and a conflicting member
        is ignored, never rejected (AC3); every value stored from here marks
        the run `unverified_ref = true`. An unknown member is 422
        `request_invalid` (`details[].path` `/ref/<member>`, reason
        `additional_properties`), like every other shape failure of this body.
      properties:
        kind:
          type: string
          enum: [branch, tag, pull_request]
          description: >-
            `pull_request` requires `pr_number`, checked on the values after
            the verified-claim merge → 422 `request_invalid`.
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Branch or tag name; for a PR the GITHUB_REF_NAME form `<N>/merge`.
        pr_number:
          type: integer
          minimum: 1
        head_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
          description: 40 hex for a SHA-1 repo, 64 for a SHA-256 repo.
        base_sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        trigger_event:
          type: string
          enum: [push, pull_request, schedule, manual, dispatch]
        is_fork:
          type: boolean
          default: false
          description: >-
            Only a body value can set this: a verified CI caller is never a
            fork (02.4.1 refuses a fork exchange 403).
    RunRef:
      type: object
      additionalProperties: false
      description: >-
        The run's stored identity block (00 §7/§8.1, 05.2.2-T1). Every member is
        present, `null` where unknown; an existing run created before 05.2.2 has
        all members null and `is_fork` false. A verified `ci_producer` caller's
        `ref`/`sha` claims win over the request body; the remaining values are
        body-supplied and the run carries `unverified_ref = true`. `head_sha` is
        only ever the verified `sha` claim of a `branch` or `tag` ref: for a
        `pull_request` ref that claim is GitHub's test-merge commit and is not
        stored.
      required: [kind, name, pr_number, head_sha, base_sha, trigger_event, is_fork]
      properties:
        kind:
          type: [string, 'null']
          enum: [branch, tag, pull_request, null]
        name:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        pr_number:
          type: [integer, 'null']
          minimum: 1
        head_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        base_sha:
          type: [string, 'null']
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        trigger_event:
          type: [string, 'null']
          enum: [push, pull_request, schedule, manual, dispatch, null]
        is_fork:
          type: boolean
    Decision:
      type: object
      description: Evaluation decision or `pending` (00 §8.5/§9.3); `decision` values are upper case (00 §7).
      properties:
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        evaluation_revision:
          type: string
        reasons:
          type: array
          items:
            type: string
    EventBatch:
      type: object
      description: >-
        Inline mirror of `contracts/schemas/event-envelope.v1.json` (00 §9.4);
        the schema file is authoritative.
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: './schemas/event-envelope.v1.json#/$defs/event'
      x-max-bytes: 1048576
    BatchAckResult:
      type: object
      description: >-
        The 200 body of `POST /v1/runs/{r}/events` (00 §9.4): the batch row this
        call wrote, its counts and one ack per event in request order. A resend
        answers 200 with `accepted: 0` and every ack `duplicate`; no metering
        row is written for it (04.8.1 §4).
      required: [batch_id, accepted, duplicates, acks]
      properties:
        batch_id:
          type: string
          format: uuid
          description: The `event_batch` row written by this accepted batch.
        accepted:
          type: integer
          minimum: 0
          description: How many events were newly committed.
        duplicates:
          type: integer
          minimum: 0
          description: How many events were already on file with the identical canonical payload.
        acks:
          type: array
          items:
            $ref: '#/components/schemas/EventAck'
    EventAck:
      type: object
      description: One event's per-event acknowledgement (00 §9.4), in request order.
      required: [index, event_id, ack]
      properties:
        index:
          type: integer
          minimum: 0
          description: The 0-based position of the event in the request (`details[].index` uses the same numbering).
        event_id:
          type: string
          format: uuid
          description: The event's client-assigned id.
        ack:
          type: string
          enum: [accepted, duplicate]
          description: >-
            `accepted` when this batch committed the row, `duplicate` when it was
            already on file with the identical canonical payload.
    PermissionView:
      type: object
      description: >-
        One entry of the permission catalogue (00 §2). The catalogue holds no
        secrets: `sensitive` describes the permission, it is never a value.
      required: [code, resource, action, description, sensitive, reserved, tenant_assignable]
      properties:
        code:
          type: string
          pattern: '^[a-z_]+:[a-z_]+$'
          description: The `resource:action` string — the catalogue's identity.
        resource:
          type: string
        action:
          type: string
        description:
          type: string
        sensitive:
          type: boolean
          description: True when the permission gates secret-adjacent data (AC5).
        reserved:
          type: boolean
          description: True when the string has no V1 consumer yet (AC2).
        tenant_assignable:
          type: boolean
          description: False for a code a member principal must never hold (T79).
    PermissionListResponse:
      type: object
      description: 00 §9.1 cursor page of `PermissionView`, ordered by `code`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PermissionView'
        next_cursor:
          type: [string, 'null']
          description: The last code of the page when a further page exists, else null.
    RoleView:
      type: object
      description: One role — a built-in (`org_id` null) or the caller's own org row (02 §4.5).
      required: [id, code, name, is_builtin, created_at, version]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: [string, 'null']
          format: uuid
          description: Null for a built-in role, the owning org for a custom role.
        code:
          type: string
        name:
          type: string
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
        version:
          type: integer
    RoleListResponse:
      type: object
      description: 00 §9.1 cursor page of `RoleView`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleView'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CreateRoleRequest:
      type: object
      description: Body of `POST /v1/roles` (02.2.1 §5). V1 answers 403 until the custom-role flag is on.
      required: [code, name, permissions]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]*$'
          description: Role code; unique per org → 409 `role_code_taken`.
        name:
          type: string
          minLength: 1
          maxLength: 64
        permissions:
          type: array
          description: Catalogue codes to grant; unknown → 422 `unknown_permission`, non-assignable → 422 `permission_not_assignable` (T79).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    UpdateRoleRequest:
      type: object
      description: Body of `PATCH /v1/roles/{r}` (02.2.1 §5). Both fields optional; a built-in role is 409 `builtin_role_immutable`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        add_permissions:
          type: array
          description: >-
            Catalogue codes granted in addition to the role's current set. Additive only:
            migration 0010 revokes `DELETE` on `role_permission` for the app role, so V1 cannot
            shrink a role's grant set (02.2.1 §3).
          items:
            type: string
            pattern: '^[a-z_]+:[a-z_]+$'
    OrganizationDto:
      type: object
      description: >-
        One organization (02.1.1 §4). `organization` is the T4 exception: its own `id` is
        the tenant key. Limit columns are null when no limit is set (02.1.1-T3).
      required:
        [
          id,
          name,
          slug,
          status,
          retention_default_days,
          allowed_email_domains,
          created_at,
          updated_at,
          version,
          max_projects,
          max_seats,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Globally unique (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        retention_default_days:
          type: [integer, 'null']
        allowed_email_domains:
          type: [array, 'null']
          maxItems: 64
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        max_projects:
          type: [integer, 'null']
          description: Projects that are not `deleted` the org may hold; null = no limit.
        max_seats:
          type: [integer, 'null']
          description: Active memberships the org may hold; null = no limit (enforced by plan 12).
    ProjectDto:
      type: object
      description: One project (02.1.1 §4); `unique (org_id, slug)`.
      required:
        [
          id,
          org_id,
          name,
          slug,
          status,
          default_environment_id,
          created_at,
          updated_at,
          version,
          retention_days,
          monthly_run_quota,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,61}[a-z0-9]$'
          description: Unique within the org (DECISIONS §8.1 D-A1).
        status:
          type: string
          enum: [active, suspended, deleted]
        default_environment_id:
          type: [string, 'null']
          format: uuid
          description: Null until 05.1.2-T1 adds the environment table.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
        retention_days:
          type: [integer, 'null']
          description: Overrides the org's `retention_default_days`; null = inherit.
        monthly_run_quota:
          type: [integer, 'null']
          description: Runs per calendar month; null = no limit (enforced by plan 12).
    ProjectListResponse:
      type: object
      description: 00 §9.1 cursor page of `ProjectDto`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectDto'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor of the next page, or null on the last page.
    CaseDto:
      type: object
      description: A test case (03.1.1). Its identity (`annotation_id`, `first_seen_commit`) never changes.
      required:
        [
          id,
          org_id,
          project_id,
          annotation_id,
          name,
          framework,
          status,
          labels,
          first_seen_commit,
          created_at,
          updated_at,
          version,
        ]
      properties:
        id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
          description: The durable `evidgate.id`; the case's identity inside the project.
        name:
          type: string
          maxLength: 512
        framework:
          type: string
          maxLength: 64
        language:
          type: [string, 'null']
        file_path:
          type: [string, 'null']
          description: Current repository path; moves with a rename.
        status:
          type: string
          enum: [active, missing, archived]
        owner_membership_id:
          type: [string, 'null']
          format: uuid
        labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
        first_seen_commit:
          type: string
        last_seen_commit:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          description: Optimistic-concurrency token; the response `ETag` and the `If-Match` value (00 §9.1).
    CaseIdentitySourceDto:
      type: object
      required: [source, raw_key, commit_sha, created_at]
      properties:
        source:
          type: string
          enum: [annotation, sidecar, imported]
        raw_key:
          type: string
        commit_sha:
          type: string
        created_at:
          type: string
          format: date-time
    CaseRenameDto:
      type: object
      required: [from_path, to_path, commit_sha, detected_at]
      properties:
        from_path:
          type: string
        to_path:
          type: string
        commit_sha:
          type: string
        detected_at:
          type: string
          format: date-time
    CaseDetailDto:
      type: object
      description: A case plus its identity trail, so a duplicate-id mistake is diagnosable.
      required: [case, identity_sources, renames]
      properties:
        case:
          $ref: '#/components/schemas/CaseDto'
        identity_sources:
          type: array
          items:
            $ref: '#/components/schemas/CaseIdentitySourceDto'
        renames:
          type: array
          items:
            $ref: '#/components/schemas/CaseRenameDto'
    CaseListResponse:
      type: object
      description: 00 §9.1 cursor page of `CaseDto`, keyset-ordered on `(created_at, id)`.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CaseDto'
        next_cursor:
          type: [string, 'null']
    UpdateCaseRequest:
      type: object
      description: Omitted members are unchanged. Any other member is rejected (identity members with `case_field_immutable`).
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 512
        owner_membership_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, archived]
        labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
    CaseRevisionDto:
      type: object
      required:
        [
          id,
          case_id,
          revision_hash,
          commit_sha,
          file_path,
          framework,
          content_sha256,
          assertion_hash,
          created_at,
          assertions_extracted,
          assertions_reliable,
        ]
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        revision_hash:
          type: string
          description: '`sha256:` over the canonical content descriptor (00 §7).'
        commit_sha:
          type: string
        file_path:
          type: string
        framework:
          type: string
        language:
          type: [string, 'null']
        content_sha256:
          type: string
        assertion_hash:
          type: string
        created_at:
          type: string
          format: date-time
        assertions_extracted:
          type: boolean
          description: False when the framework is not understood; `assertion_hash` then changes with any edit.
        assertions_reliable:
          type: boolean
          description: False when the scan could not follow the file to its end; treat `assertion_hash` as "content changed".
