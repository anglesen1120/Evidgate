  /artifacts/{a}/complete:
    post:
      operationId: completeArtifact
      tags: [artifacts]
      summary: Verify object/size/checksum → artifact `ready`
      description: >-
        Verifies the object the client `PUT` to the staging key and commits the outcome
        (06.1.2 §5, AC3/AC4/AC5/AC8). The route takes no request body: the artifact is
        named by `{a}` and the project comes from the credential, so a project-scoped
        principal (the CI producer token) is required — an org-scoped principal is refused
        403 `project_required` (T1 decision 10). T86
        order: (1) read the artifact row (state, declared bytes, checksum, kind, final key,
        project status) in a tenant read scope; (2) with NO transaction open, `HEAD` the
        staging key `pending/<org_id>/<artifact_id>`; when it is absent, `HEAD` the final
        key and, if its size and SHA-256 equal the declared ones, proceed to commit `ready`
        (retry path) — otherwise the outcome is `rejected` with `object_missing`; (3)
        verify the `HEAD` size equals the declared `bytes` and is within the kind policy
        `max_bytes`, and that the `HEAD` SHA-256 equals the declared one (a store that
        reports no checksum is not verified and fails closed as `checksum_mismatch`); (4)
        idempotently copy the staging object to the final key (skipped on the retry path);
        (5) in ONE tenant transaction, guard the state, write `state=ready`, `bytes`,
        `scan_state=pending` and the outbox rows `artifact_secret_scan` and
        `artifact_staging_delete`, and bump `version`; a mismatch instead writes
        `state=rejected` and `failure_code` with no outbox rows. Storage calls never run
        inside a DB transaction (00 §5.7 P5) and the staging object is deleted by the
        outbox task only after commit; a failed commit leaves the staging object for the
        24 h bucket lifecycle (T18) and the already-copied final object for the orphan
        sweeper (06.4.3) to remove. A verification mismatch is a COMMITTED 200 with
        `state: rejected` and a `failure_code`, never an error response; the final object
        key is never in the body. Replay: `complete` on a `ready` artifact returns the same
        body, on a `rejected` artifact the current state unchanged, and a same key with a
        different canonical payload is 409 `idempotency_conflict`. The `Idempotency-Key` is
        a header and is required (T92): a missing or over-long key is 400 `request_invalid`,
        refused before the artifact is read or the object store is touched. `failure_code` is
        one of `size_mismatch`, `checksum_mismatch`, `media_type_mismatch`, `too_large` or
        `object_missing`.
        Errors: 404 `artifact_not_found` (unknown, other-tenant or other-project artifact),
        409 `artifact_state_conflict` (a state that is neither `pending_upload`/`uploaded`
        nor a replayable `ready`/`rejected`), 409 `project_deleting` (project status
        `deleted`), 403 `forbidden` (missing `artifact:write`) or 403 `project_required`
        (an org-scoped credential that names no project). The parse-profile failure
        `artifact_invalid` (422, 06.3.1-T1) is registered here for discoverability but is
        not returned by this route: it comes from in-process parser callers (`IParsing`,
        reason ∈ `dtd_prohibited`, `depth_exceeded`, `size_exceeded`, `timeout`,
        `malformed`), and this route never parses the object — a sniff mismatch is the
        committed 200 `rejected` + `media_type_mismatch` above.
      x-permission: artifact:write
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XsrfToken'
      responses:
        '200':
          description: Artifact verified (`ready`) or verification refused (`rejected`)
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
