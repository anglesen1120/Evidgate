      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Candidate revoked
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /projects/{p}/healing/candidates:
    get:
      operationId: listHealingCandidates
      tags: [healing]
      summary: Shadow (V1) and proposed (V2) candidates with validation evidence (08)
      x-permission: healing:triage
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of healing candidates
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /healing/candidates/{c}:
    get:
      operationId: getHealingCandidate
      tags: [healing]
      summary: Read a healing candidate with validation evidence (08)
      x-permission: healing:triage
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/CandidateId'
      responses:
        '200':
          description: Healing candidate detail
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
