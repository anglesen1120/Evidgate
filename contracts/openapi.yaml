components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-evidgate
      description: '`__Host-` httpOnly, Secure, SameSite=Lax browser session cookie (00 §9.1).'
    bearerToken:
      type: http
      scheme: bearer
      description: 'CLI/agent bearer tokens — `ci_producer`, ingest, personal (00 §9.1; T38: never cookie-authenticated).'
    githubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC signature on inbound GitHub webhook deliveries (00 §9.3).
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; ordering `(created_at, id)` (00 §9.1).
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-supplied, ≤ 128 chars, unique per `(org_id, project_id, operation)` ≥ 24 h (00 §7/§9.1).
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag for optimistic concurrency; stale → 412 (00 §9.1).
      schema:
        type: string
    XsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: false
      description: >-
        Required whenever the caller is cookie-authenticated (00 §9.1, T38);
        bearer-only callers omit it. 403 `csrf_failed` on mismatch.
      schema:
        type: string
    OrgId:
      name: o
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: p
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: a
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentRevisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnvironmentSlug:
      name: e
      in: path
      required: true
      schema:
        type: string
    SupportGrantId:
      name: g
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteId:
      name: s
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuiteRevisionId:
      name: r
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftId:
      name: d
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IncidentId:
      name: i
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: j
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CandidateId:
      name: c
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    XRequestId:
      description: Server request id; echoed in `error.request_id` (00 §9.1/§9.2).
      schema:
        type: string
    RetryAfter:
      description: Seconds (or HTTP-date) to wait before retrying (00 §9.2).
      schema:
        type: string
  responses:
    Unauthorized:
      description: 401 unauthenticated (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: '403 forbidden — includes token-scope mismatch and `csrf_failed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 404 not found — also for other-tenant ids (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: '409 conflict — e.g. `idempotency_conflict`, `run_closed` (00 §9.1/§9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: 412 precondition failed — stale ETag; current revision id in `error.details` (00 §9.1/§9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooLarge:
      description: 413 too large (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: 422 schema/manifest invalid — per-item causes in `error.details[]` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: '429 — `rate_limited` (bursts) or `quota_exceeded` (tenant/project limit); always `Retry-After` (00 §9.2)'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: 503 unavailable — always `Retry-After` (00 §9.2)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      description: 00 §9.2 error envelope; `details` never contains secrets.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: array
              items:
                type: object
                required: [reason]
                properties:
                  index:
                    type: integer
                  path:
                    type: string
                  reason:
                    type: string
    CursorList:
      type: object
      description: 00 §9.1 cursor list envelope; `next_cursor` is null when the page is last.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            type: object
        next_cursor:
          type: [string, 'null']
    RunSummary:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [created, queued, running, collecting, complete, incomplete, canceled]
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        parent_run_id:
          type: [string, 'null']
          format: uuid
        rerun_label:
          type: [string, 'null']
        reprocess_label:
          type: [string, 'null']
    Decision:
      type: object
      description: Evaluation decision or `pending` (00 §8.5/§9.3); `decision` values are upper case (00 §7).
      properties:
        decision:
          type: [string, 'null']
          enum: [PASS, FAIL, INCONCLUSIVE, null]
          description: null while pending (00 §9.3); UPPER per 00 §7
        evaluation_revision:
          type: string
        reasons:
          type: array
          items:
            type: string
    ManifestUpload:
      type: object
      description: Manifest upload payload; verified server-side → `manifest_id` + `manifest_hash` (00 §9.3). Shape finalized by 05.
    EventBatch:
      type: object
      description: >-
        Inline mirror of `contracts/schemas/event-envelope.v1.json` (00 §9.4);
        the schema file is authoritative.
      required: [events]
      properties:
        events:
          type: array
          maxItems: 500
          items:
            $ref: './schemas/event-envelope.v1.json#/$defs/event'
      x-max-bytes: 1048576
security:
  - sessionCookie: []
  - bearerToken: []
