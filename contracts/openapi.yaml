      tags: [security]
      summary: Security events filtered by project/type/severity/time
      description: >-
        The tenant's own security events, newest first: V1 carries all five types
        (`auth_failure`, `cross_tenant_probe`, `secret_scanner_alert`, `kill_switch_used`,
        `support_access`) and V2 adds `injection_attempt` (11.5.1-T5, 11.4.1-T2; view
        09.7.1-T9). One statement per page, keyset-ordered on `(created_at, id)` descending: an
        unfiltered page, or one narrowed only by `from`/`to`, is served by
        `security_event_org_created_idx` on `(org_id, created_at DESC, id DESC)`; a page that binds all
        three of `project_id`, `type` and `severity` is narrowed by `security_event_list_idx` on
        `(org_id, project_id, type, severity, created_at DESC, id DESC)`, whose equalities come first and
        whose key ends in the cursor tuple, so an index scan returns that page already ordered. Two planner
        choices still sort, legitimately: a bitmap scan (cheaper for a small selective page, keeps no order)
        and a partial bind on those three filters (an unbound column precedes `created_at` in the key).
        Each filter is optional and exact: omitting it does not narrow the page. A `project_id` that is unknown
        or belongs to another org answers an empty page, not 404. A non-member or unknown org is refused
        at tenant resolution with 403 forbidden (the same body either way, so the answer never discloses
        which org ids exist); 404 `not_found` only if the resolved tenant differs from `{o}` (a service
        credential bound to another org, 00 §9.2). A present but invalid `project_id`, `type`, `severity`,
        `from`, `to`, `cursor` or `limit` is 422 `request_invalid` with `details[].path` naming the
        parameter. Rows are written by the emitter modules, never by this read; the application role
        holds insert and select only, so a recorded event can never be rewritten or deleted.
      x-permission: security_event:read
      x-version: v1
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SecurityEventProjectFilter'
        - $ref: '#/components/parameters/SecurityEventType'
