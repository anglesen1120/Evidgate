        `parent_id`, every other kind names one), so a missing, wrong-kind, soft-deleted or
        other-project parent, a self-parent and a placement deeper than the four-level ladder are
        422 `authoring_parent_invalid` with `details[].reason` ∈ `parent_not_found`,
