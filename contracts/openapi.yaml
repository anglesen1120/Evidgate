      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 512
        owner_membership_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, archived]
        labels:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 64
    CaseRevisionDto:
      type: object
      required:
        [
          id,
          case_id,
          revision_hash,
          commit_sha,
          file_path,
          framework,
          content_sha256,
          assertion_hash,
          created_at,
          assertions_extracted,
          assertions_reliable,
        ]
      properties:
        id:
          type: string
          format: uuid
        case_id:
          type: string
          format: uuid
        revision_hash:
          type: string
          description: '`sha256:` over the canonical content descriptor (00 §7).'
        commit_sha:
          type: string
        file_path:
          type: string
        framework:
          type: string
        language:
          type: [string, 'null']
        content_sha256:
          type: string
        assertion_hash:
          type: string
        created_at:
          type: string
          format: date-time
